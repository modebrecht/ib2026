  <script id="p1-data" type="application/json">[{"id":"grundlagen","title":"Was macht dieses Tastenkürzel?","points":4,"lead":"Kreuze jeweils die richtige Aussage an. Genau eine Aussage ist korrekt.","questions":[{"id":"1-1","q":"Ctrl + C","options":["Kopiert markierte Inhalte.","Fügt kopierte Inhalte ein.","Schliesst die aktuelle Anwendung."],"correct":0,"answer":"Ctrl + C kopiert markierte Inhalte in die Zwischenablage."},{"id":"1-2","q":"Ctrl + V","options":["Speichert das Dokument.","Fügt kopierte oder ausgeschnittene Inhalte ein.","Macht den letzten Schritt rückgängig."],"correct":1,"answer":"Ctrl + V fügt den Inhalt der Zwischenablage ein."},{"id":"1-3","q":"Ctrl + X","options":["Schneidet markierte Inhalte aus.","Sucht nach einem Begriff.","Öffnet eine Datei."],"correct":0,"answer":"Ctrl + X schneidet markierte Inhalte aus. Mit Ctrl + V kannst du sie anderswo einfügen."},{"id":"1-4","q":"Ctrl + Z","options":["Macht den letzten Schritt rückgängig.","Markiert alles.","Druckt das Dokument."],"correct":0,"answer":"Ctrl + Z macht den letzten Arbeitsschritt rückgängig."}]},{"id":"alltag","title":"Tastenkombinationen im Alltag","points":6,"lead":"Wähle jeweils die sinnvollste Tastenkombination.","questions":[{"id":"2-1","q":"1. Dokument sichern\nElena arbeitet seit längerer Zeit an einem wichtigen Dokument. Bevor sie weiterarbeitet, möchte sie den aktuellen Stand speichern.","options":["Ctrl + S","Ctrl + P","Ctrl + O"],"correct":0,"answer":"Ctrl + S – speichert den aktuellen Stand des Dokuments."},{"id":"2-2","q":"2. Alles formatieren\nJan möchte den gesamten Text seines Dokuments markieren, um die Schriftart für alles gleichzeitig zu ändern.","options":["Ctrl + A","Ctrl + F","Ctrl + C"],"correct":0,"answer":"Ctrl + A – markiert alles im aktuellen Bereich oder Dokument."},{"id":"2-3","q":"3. Begriff finden\nAmir hat ein sechsseitiges Dokument geöffnet. Er sucht darin nach dem Begriff „Datenschutz“.","options":["Ctrl + F","Ctrl + H","Ctrl + L"],"correct":0,"answer":"Ctrl + F – öffnet die Suche im Dokument."},{"id":"2-4","q":"4. Direkt ans Ende\nSophie arbeitet an einem sehr langen Bericht. Sie befindet sich weit oben und möchte direkt ganz ans Ende des Dokuments springen.","options":["Ctrl + End","Ctrl + Home","Ctrl + ↓"],"correct":0,"answer":"Ctrl + End – springt ans Ende des Dokuments."},{"id":"2-5","q":"5. Ohne fremde Formatierung\nTim kopiert Text von einer Webseite in ein Dokument. Die fremde Schriftart und Formatierung soll möglichst nicht übernommen werden.","options":["Ctrl + Shift + V","Ctrl + V","Ctrl + Shift + C"],"correct":0,"answer":"Ctrl + Shift + V – fügt in vielen Programmen als unformatierten Text ein. Die genaue Funktion kann je nach Programm abweichen."},{"id":"2-6","q":"6. Doch wiederherstellen\nLuca hat einen Schritt rückgängig gemacht und merkt, dass er ihn doch behalten wollte.","options":["Ctrl + Y","Ctrl + Z","Ctrl + S"],"correct":0,"answer":"Ctrl + Y – stellt in Word und vielen Windows-Programmen einen rückgängig gemachten Schritt wieder her."}]},{"id":"altgr","title":"Sonderzeichen mit AltGr","points":8,"lead":"Schreibe in jedes stark umrandete Feld nur die zweite Taste. Lies jede Aufgabe als: ZEICHEN = AltGr + [2. Taste]. Es gilt die Belegung einer Schweizer Tastatur.","questions":[{"id":"3-1","q":"1. @\nAltGr +","answer":"2","explanation":"AltGr + 2 ergibt @."},{"id":"3-2","q":"2. #\nAltGr +","answer":"3","explanation":"AltGr + 3 ergibt #."},{"id":"3-3","q":"3. €\nAltGr +","answer":"E","explanation":"AltGr + E ergibt €."},{"id":"3-4","q":"4. |\nAltGr +","answer":"7","explanation":"AltGr + 7 ergibt |."},{"id":"3-5","q":"5. \\\nAltGr +","answer":"\u003c","explanation":"AltGr + \u003c ergibt den umgekehrten Schrägstrich (Backslash)."},{"id":"3-6","q":"6. [\nAltGr +","answer":"ü","explanation":"AltGr + ü ergibt [."},{"id":"3-7","q":"7. {\nAltGr +","answer":"ä","explanation":"AltGr + ä ergibt {."},{"id":"3-8","q":"8. °\nAltGr +","answer":"4","explanation":"AltGr + 4 ergibt °."}]},{"id":"browser","title":"Programme & Browser","points":4,"lead":"Wähle die passendste Tastenkombination.","questions":[{"id":"4-1","q":"1. Neues Word-Dokument\nDu möchtest in Word ein neues Dokument erstellen.","options":["Ctrl + N","Ctrl + T","Ctrl + W"],"correct":0,"answer":"Ctrl + N – erstellt in Word ein neues Dokument."},{"id":"4-2","q":"2. Neuer Browser-Tab\nDu möchtest im Browser einen neuen Tab öffnen.","options":["Ctrl + N","Ctrl + T","Ctrl + L"],"correct":1,"answer":"Ctrl + T – öffnet im Browser einen neuen Tab."},{"id":"4-3","q":"3. Webseite neu laden\nDu möchtest die aktuelle Webseite neu laden.","options":["F5","Ctrl + F","Win + D"],"correct":0,"answer":"F5 – lädt die aktuelle Webseite neu."},{"id":"4-4","q":"4. Adresse markieren\nDu möchtest sofort die gesamte Adresse im Browser markieren.","options":["Ctrl + L","Ctrl + F","Ctrl + T"],"correct":0,"answer":"Ctrl + L – setzt den Fokus in die Adressleiste und markiert die Adresse."}]},{"id":"windows","title":"Windows & Arbeitsalltag","points":5,"lead":"Schreibe die passende Tastenkombination direkt ins leere Feld.","questions":[{"id":"5-1","q":"1. Desktop anzeigen","answer":"Win + D","explanation":"Zeigt den Desktop an; erneutes Drücken stellt die Fenster wieder her."},{"id":"5-2","q":"2. Datei-Explorer öffnen","answer":"Win + E","explanation":"Öffnet den Datei-Explorer."},{"id":"5-3","q":"3. Einen Bildschirmausschnitt aufnehmen","answer":"Win + Shift + S","explanation":"Öffnet die Auswahl für einen Screenshot-Ausschnitt."},{"id":"5-4","q":"4. Task-Manager direkt öffnen","answer":"Ctrl + Shift + Esc","explanation":"Öffnet den Task-Manager ohne zusätzlichen Zwischenschritt."},{"id":"5-5","q":"5. Verlauf der Zwischenablage öffnen","answer":"Win + V","explanation":"Öffnet den Zwischenablageverlauf, sofern diese Funktion aktiviert ist."}]},{"id":"erklaeren","title":"Kurz erklären","points":6,"lead":"Beschreibe kurz die Wirkung. Stichwort oder Satz genügt; bewertet wird der Inhalt. Je 1 Punkt.","questions":[{"id":"6-1","q":"1. Ctrl + H in Word","answer":"Öffnet Suchen und Ersetzen.","explanation":"Damit kannst du Textstellen im Dokument durch anderen Text ersetzen."},{"id":"6-2","q":"2. Ctrl + P","answer":"Öffnet den Druckdialog.","explanation":"Dort wählst du Drucker und Druckeinstellungen."},{"id":"6-3","q":"3. Ctrl + O","answer":"Öffnet einen Dialog zum Öffnen einer Datei.","explanation":"Damit kannst du eine bestehende Datei öffnen."},{"id":"6-4","q":"4. Win + ←","answer":"Dockt das aktive Fenster links am Bildschirm an.","explanation":"Das Fenster nimmt in der Regel die linke Bildschirmhälfte ein."},{"id":"6-5","q":"5. Win + ↑","answer":"Maximiert das aktive Fenster.","explanation":"Je nach Ausgangszustand kann der erste Schritt auch die Fensterposition ändern."},{"id":"6-6","q":"6. Win + ↓ bei maximiertem Fenster","answer":"Stellt die normale Fenstergrösse wieder her.","explanation":"Ein maximiertes Fenster wird verkleinert und ist danach nicht mehr maximiert."}]},{"id":"vergleichen","title":"Nicht verwechseln","points":4,"lead":"Erkläre jeweils kurz den Unterschied. Pro Teilaufgabe sind 2 Punkte möglich.","questions":[{"id":"7-1","points":2,"q":"A) Ctrl + Tab und Alt + Tab\nWann verwendest du Ctrl + Tab und wann Alt + Tab?","answer":"Ctrl + Tab: Zwischen Tabs innerhalb einer Anwendung bzw. des Browsers wechseln.\nAlt + Tab: Zwischen geöffneten Fenstern beziehungsweise Programmen wechseln.","explanation":"Beide wechseln den Kontext, aber auf unterschiedlichen Ebenen."},{"id":"7-2","points":2,"q":"B) Ctrl + W und Alt + F4\nWas schliesst Ctrl + W typischerweise und was schliesst Alt + F4?","answer":"Ctrl + W: Den aktuellen Tab bzw. das aktuelle Dokument schliessen.\nAlt + F4: Das aktive Fenster beziehungsweise Programm schliessen.","explanation":"Was genau geschlossen wird, kann vom jeweiligen Programm abhängen."}]},{"id":"transfer","title":"Transfer","points":4,"lead":"Nenne die sinnvollste Tastenkombination und begründe kurz.","questions":[{"id":"8-1","points":2,"q":"A) Zwei Programme nebeneinander - 2 P\nDas aktive Browserfenster soll ohne Maus die rechte Bildschirmhälfte einnehmen, damit PowerPoint daneben sichtbar bleiben kann.\nTastenkombination\nBegründung","answer":"Win + →","explanation":"Damit wird das aktive Browserfenster rechts angedockt. Auf der anderen Hälfte bleibt Platz für PowerPoint. 1 Punkt für das Kürzel und 1 Punkt für die sinnvolle Begründung."},{"id":"8-2","points":2,"q":"B) Arbeitsplatz verlassen - 2 P\nDu gehst kurz aus dem Raum. Programme sollen geöffnet bleiben, aber niemand soll den Computer benutzen können.\nTastenkombination\nBegründung","answer":"Win + L","explanation":"Damit wird der Computer gesperrt. Die geöffneten Programme und Dokumente bleiben erhalten. 1 Punkt für das Kürzel und 1 Punkt für die sinnvolle Begründung."}]},{"id":"bonus","title":"Bonus - max. +2 P","points":2,"bonus":true,"lead":"Genau unterscheiden: je +1 P. · Bonuspunkte zusätzlich zu 41 P · Maximalnote 6.0","questions":[{"id":"B-1","q":"Bonus 1 · Im Browser bleiben (+1 P)\nZum vorherigen Browser-Tab wechseln, ohne zu Word zu wechseln.\nAntwort","answer":"Ctrl + Shift + Tab","explanation":"Damit wechselst du einen Tab zurück, bleibst aber im Browser."},{"id":"B-2","q":"Bonus 2 · Fenster neu anordnen (+1 P)\nMaximiertes Fenster zuerst normal gross machen, danach links andocken. Zwei Kürzel in Reihenfolge.\nAntwort","answer":"1. Win + ↓\n2. Win + ←","explanation":"Zuerst verlässt das Fenster die maximierte Ansicht; anschliessend dockst du es links an."}]}]</script>
  <script>
    (function(){
      'use strict';
      const data = JSON.parse(document.getElementById('p1-data').textContent);
      const storageKey = 'ib2026_tk2_p1_korrektur_v1';
      let states = {};
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
        if (saved && typeof saved === 'object' && !Array.isArray(saved)) states = saved;
      } catch (_e) {}
      let errorsOnly = false;
      const root = document.getElementById('sections');
      const nav = document.getElementById('sectionNav');
      const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const entry = id => states[id] || (states[id] = {wrong:false,done:false,note:''});
      function persist(){try{localStorage.setItem(storageKey,JSON.stringify(states));}catch(_e){}}
      function questionHTML(q) {
        const options = q.options ? '<ul class="choices" aria-label="Antwortmöglichkeiten">'+q.options.map((option,i)=>'<li class="choice '+(q.correct===i?'correct':'')+'"><span class="choice-letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(option)+'</span><span class="choice-tick" aria-label="Richtig">✓</span></li>').join('')+'</ul>' : '';
        // Multiple-choice options already show the answer in green; don't repeat the text.
        const answer = q.options ? '' : '<div class="answer-line"><span class="answer-mark" aria-hidden="true">✓</span><span class="answer">'+esc(q.answer)+'</span></div>';
        // Keep the explanation available without filling every card with extra paragraphs.
        const why = q.explanation ? '<details class="reason"><summary aria-label="Erklärung anzeigen" title="Erklärung anzeigen">?</summary><p>'+esc(q.explanation)+'</p></details>' : '';
        const label = q.id.startsWith('B') ? q.id.replace('-','.') : q.id.replace('-', '.');
        return '<article class="question-card" data-id="'+esc(q.id)+'"><div class="question-top"><span class="q-number">'+esc(label)+'</span><div><p class="q-text">'+esc(q.q)+'</p>'+((q.points || 1)>1 ? '<div class="q-meta">'+(q.points || 1)+' Punkte</div>' : '')+'</div></div>'+options+answer+why+
          '<label class="selfcheck"><input class="wrong-input" type="checkbox" aria-label="Fehler bei Frage '+esc(label)+' markieren">Fehler <span class="fix-status" aria-live="polite"></span></label>'+
          '<div class="correction-area" hidden><label class="note-label" for="correction-'+esc(q.id)+'">Korrektur</label><textarea id="correction-'+esc(q.id)+'" class="note-input" placeholder="Richtige Antwort notieren …"></textarea><label class="done-label"><input type="checkbox" class="done-input">Korrigiert</label></div></article>';
      }
      data.forEach((s,index)=>{
        const section = document.createElement('section');
        section.className='sheet'+(s.bonus?' bonus':'');
        section.id=s.id;
        section.innerHTML='<header class="sheet-head"><span class="sheet-number">'+(s.bonus?'★':String(index+1).padStart(2,'0'))+'</span><div><h2>'+esc(s.title)+'</h2><p>'+esc(s.lead)+'</p><span class="points">'+(s.bonus?'+':'')+s.points+' '+(s.points===1?'Punkt':'Punkte')+'</span></div></header><div class="question-list">'+s.questions.map(questionHTML).join('')+'</div>';
        root.appendChild(section);
        const a=document.createElement('a');a.href='#'+s.id;a.textContent=(s.bonus?'★':index+1)+' · '+s.title;nav.appendChild(a);
      });
      function updateCard(card){
        const s=entry(card.dataset.id);
        card.querySelector('.wrong-input').checked=!!s.wrong;
        card.querySelector('.correction-area').hidden=!s.wrong;
        card.querySelector('.done-input').checked=!!s.done;
        card.querySelector('.note-input').value=s.note || '';
        card.classList.toggle('is-fixed',!!s.wrong&&!!s.done);
        card.querySelector('.fix-status').textContent=s.wrong?(s.done?'✓':'Offen'):'';
      }
      function updateProgress(){
        let wrong=0,done=0;
        Object.values(states).forEach(s=>{if(s.wrong){wrong++;if(s.done)done++;}});
        document.getElementById('progressArea').hidden=wrong===0;
        const percent=wrong?Math.round(done/wrong*100):0;
        document.getElementById('progressLabel').textContent=wrong?done+' von '+wrong+' korrigiert':'Noch keine Fehler markiert';
        document.getElementById('progressFill').style.width=percent+'%';
        document.querySelector('.progress-track').setAttribute('aria-valuenow',String(percent));
      }
      function applyFilter(){
        const wrongCount=Object.values(states).filter(s=>s.wrong).length;
        if(wrongCount===0)errorsOnly=false;
        let visible=0;
        document.querySelectorAll('.sheet').forEach(section=>{
          let sectionVisible=0;
          section.querySelectorAll('.question-card').forEach(card=>{
            const show=!errorsOnly || !!entry(card.dataset.id).wrong;
            card.hidden=!show;
            if(show){sectionVisible++;visible++;}
          });
          section.hidden=sectionVisible===0;
        });

        document.getElementById('reviewActions').hidden=wrongCount===0;
        const btn=document.getElementById('errorFilter');
        btn.setAttribute('aria-pressed',String(errorsOnly));
        btn.textContent=errorsOnly?'Alle Aufgaben':'Nur Fehler ('+wrongCount+')';
      }
      root.querySelectorAll('.question-card').forEach(updateCard);
      root.addEventListener('change',e=>{
        const card=e.target.closest('.question-card');
        if(!card)return;
        const s=entry(card.dataset.id);
        if(e.target.matches('.wrong-input')){
          s.wrong=e.target.checked;
          if(!s.wrong)s.done=false;
          persist();updateCard(card);updateProgress();applyFilter();
        }else if(e.target.matches('.done-input')){
          s.done=e.target.checked;persist();card.classList.toggle('is-fixed',s.done);card.querySelector('.fix-status').textContent=s.done?'✓':'Offen';updateProgress();
        }
      });
      root.addEventListener('input',e=>{
        if(!e.target.matches('.note-input'))return;
        const card=e.target.closest('.question-card');
        entry(card.dataset.id).note=e.target.value;
        persist();
      });
      document.getElementById('errorFilter').addEventListener('click',()=>{errorsOnly=!errorsOnly;applyFilter();document.getElementById('sections').scrollIntoView({block:'start'});});
      
      updateProgress();applyFilter();
    })();
  </script>
</body>
</html>
