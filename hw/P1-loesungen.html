  <script id="p1-data" type="application/json">[{"id":"komponenten","title":"1. Computer-Komponenten","lead":"Kreuze bei jeder Komponente die richtige Aussage an. Genau eine Aussage ist korrekt.","points":7,"questions":[{"id":"1-1","q":"CPU","options":["Speichert Dateien auch ohne Strom dauerhaft.","Führt Berechnungen aus und verarbeitet Befehle von Programmen.","Liefert dem Computer die benötigte elektrische Energie.","Ist hauptsächlich dafür zuständig, Bilder auf dem Bildschirm darzustellen."],"correct":1,"answer":"Führt Berechnungen aus und verarbeitet Befehle von Programmen.","explanation":"Die CPU führt Befehle aus und übernimmt zentrale Berechnungen."},{"id":"1-2","q":"RAM","options":["Speichert Fotos und Dokumente dauerhaft.","Verbindet die verschiedenen Hardware-Komponenten miteinander.","Hält aktuell benötigte Daten und Programme kurzfristig bereit.","Wandelt den Strom aus der Steckdose für die PC-Komponenten um."],"correct":2,"answer":"Hält aktuell benötigte Daten und Programme kurzfristig bereit.","explanation":"RAM hält Daten und laufende Programme nur vorübergehend bereit. Ohne Strom gehen diese Daten verloren."},{"id":"1-3","q":"SSD","options":["Speichert Daten dauerhaft und verwendet keine beweglichen mechanischen Teile.","Führt die eigentlichen Berechnungen eines Programms aus.","Speichert Daten nur solange der Computer eingeschaltet ist.","Ist eine langsamere Variante des Arbeitsspeichers."],"correct":0,"answer":"Speichert Daten dauerhaft und verwendet keine beweglichen mechanischen Teile.","explanation":"Eine SSD speichert Daten dauerhaft in Flash-Speicher und hat keine beweglichen mechanischen Teile."},{"id":"1-4","q":"HDD","options":["Berechnet 3D-Grafiken für Spiele.","Ist ein dauerhafter Speicher mit mechanisch beweglichen Teilen.","Ist grundsätzlich schneller als eine SSD.","Wird als kurzfristiger Arbeitsspeicher für geöffnete Programme verwendet."],"correct":1,"answer":"Ist ein dauerhafter Speicher mit mechanisch beweglichen Teilen.","explanation":"Eine HDD ist ein dauerhafter Datenspeicher mit rotierenden Scheiben."},{"id":"1-5","q":"Mainboard","options":["Speichert das Betriebssystem dauerhaft.","Versorgt sämtliche Komponenten direkt mit Strom aus der Steckdose.","Kühlt Prozessor und Grafikkarte.","Verbindet zentrale Komponenten und ermöglicht deren Kommunikation untereinander."],"correct":3,"answer":"Verbindet zentrale Komponenten und ermöglicht deren Kommunikation untereinander.","explanation":"Das Mainboard verbindet wichtige Bauteile des Computers miteinander."},{"id":"1-6","q":"Netzteil","options":["Wandelt Netzstrom um und versorgt die PC-Komponenten mit geeigneter elektrischer Energie.","Speichert besonders grosse Dateien günstig.","Verbindet CPU, RAM und Grafikkarte miteinander.","Beschleunigt Programme, indem es häufig benötigte Daten zwischenspeichert."],"correct":0,"answer":"Wandelt Netzstrom um und versorgt die PC-Komponenten mit geeigneter elektrischer Energie.","explanation":"Das Netzteil wandelt die elektrische Energie für die Komponenten passend um."},{"id":"1-7","q":"Grafikkarte","options":["Speichert Dokumente dauerhaft auf dem Computer.","Berechnet vor allem Grafiken und Bildinformationen für die Ausgabe.","Verteilt den Strom an Mainboard und Laufwerke.","Ist für die allgemeine Verarbeitung aller Programmbefehle verantwortlich."],"correct":1,"answer":"Berechnet vor allem Grafiken und Bildinformationen für die Ausgabe.","explanation":"Die Grafikkarte bzw. GPU ist insbesondere für Grafikberechnungen zuständig."}]},{"id":"eva","title":"2. EVA-Prinzip","lead":"Ordne jeweils Eingabe, Verarbeitung oder Ausgabe zu.","points":6,"context":"Situation · Antwort (E / V / A)","questions":[{"id":"2-1","q":"1. Der Preis erscheint auf dem Display.","answer":"Ausgabe","explanation":"Hier werden Informationen für den Menschen sichtbar."},{"id":"2-2","q":"2. Du bewegst die Maus.","answer":"Eingabe","explanation":"Hier werden Daten bzw. Befehle in das System eingegeben."},{"id":"2-3","q":"3. Das Kassensystem berechnet den Gesamtpreis.","answer":"Verarbeitung","explanation":"Hier verarbeitet bzw. berechnet der Computer Informationen."},{"id":"2-4","q":"4. Ein Barcode wird an der Kasse eingescannt.","answer":"Eingabe","explanation":"Hier werden Daten bzw. Befehle in das System eingegeben."},{"id":"2-5","q":"5. Der Mauszeiger erscheint an einer neuen Stelle auf dem Bildschirm.","answer":"Ausgabe","explanation":"Hier werden Informationen für den Menschen sichtbar."},{"id":"2-6","q":"6. Der Computer berechnet die neue Position des Mauszeigers.","answer":"Verarbeitung","explanation":"Hier verarbeitet bzw. berechnet der Computer Informationen."}]},{"id":"eva-verstehen","title":"3. EVA verstehen","lead":"Ein Schüler sagt: „Der Monitor verarbeitet die Daten, weil er das Bild erzeugt.“ Beantworte die drei Teilfragen. Jede Teilfrage gibt 1 Punkt.","points":3,"questions":[{"id":"3-1","q":"1. Welche Rolle hat der Monitor im EVA-Prinzip: Eingabe, Verarbeitung oder Ausgabe?","answer":"Ausgabe","explanation":"Der Monitor zeigt ein fertiges Bild. Das Anzeigen ist die Ausgabe, nicht die Verarbeitung der Daten."},{"id":"3-2","q":"2. Welche Komponente verarbeitet bzw. berechnet die Bildinformationen hauptsächlich?","answer":"Grafikkarte (GPU)","explanation":"Die GPU berechnet bzw. verarbeitet hauptsächlich die Grafik. Je nach fachlich sinnvoller Erklärung kann auch die CPU als beteiligte Komponente gelten."},{"id":"3-3","q":"3. Nenne ein passendes Beispiel für die Eingabe dieser EVA-Kette: Grafikkarte/CPU verarbeitet → Monitor zeigt das Ergebnis.","answer":"Zum Beispiel: Maus, Tastatur, Scanner oder Kamera.","explanation":"Ein konkretes Eingabegerät oder eine passende Eingabe genügt. Die EVA-Kette beginnt mit der Eingabe, danach folgt die Verarbeitung und schliesslich die Ausgabe."}]},{"id":"anschluesse","title":"4. Anschlüsse","lead":"Wähle den passendsten Anschluss aus der Auswahl und schreibe ihn hin. Jeder Anschluss wird genau einmal verwendet.","points":6,"context":"Auswahl: HDMI · RJ45/Ethernet · 3,5-mm-Klinke · USB-C · VGA · M.2","questions":[{"id":"4-1","q":"1. Moderner Monitor oder Fernseher mit Bild und Ton","answer":"HDMI","explanation":"HDMI überträgt digitales Bild und digitalen Ton."},{"id":"4-2","q":"2. Netzwerkkabel zum Router","answer":"RJ45/Ethernet","explanation":"RJ45/Ethernet bezeichnet den Anschluss für ein Netzwerkkabel."},{"id":"4-3","q":"3. Kopfhörer mit klassischem Audiostecker","answer":"3,5-mm-Klinke","explanation":"Die 3,5-mm-Klinke wird häufig für analoge Kopfhörer verwendet."},{"id":"4-4","q":"4. Modernes Smartphone mit einem kleinen, beidseitig einsteckbaren Anschluss zum Laden und zur Datenübertragung","answer":"USB-C","explanation":"USB-C ist klein und beidseitig einsteckbar; je nach Gerät kann es Daten und Strom übertragen."},{"id":"4-5","q":"5. Älterer Monitor mit analogem Bildsignal","answer":"VGA","explanation":"VGA ist eine ältere, analoge Bildverbindung."},{"id":"4-6","q":"6. Interne SSD direkt auf dem Mainboard","answer":"M.2","explanation":"M.2 ist ein Steckplatz-/Formfaktor für viele interne SSDs. Nicht jede M.2-SSD verwendet dasselbe Übertragungsprotokoll."}]},{"id":"speicher","title":"5. RAM, HDD oder SSD?","lead":"Wähle jeweils die beste Lösung. Bei den offenen Fragen antworte kurz und präzise.","points":5,"questions":[{"id":"5-1","q":"1. Ein PC soll schneller starten und Programme schneller öffnen.","options":["RAM","HDD","SSD"],"correct":2,"answer":"SSD","explanation":"Eine SSD verbessert normalerweise Start- und Ladezeiten, verglichen mit einer HDD."},{"id":"5-2","q":"2. 4 TB Fotos sollen möglichst günstig archiviert werden.","options":["RAM","HDD","SSD"],"correct":1,"answer":"HDD","explanation":"Für sehr grosse Datenmengen ist eine HDD häufig günstiger pro TB."},{"id":"5-3","q":"3. Ein Schüler hat nur 4 GB RAM. Beim gleichzeitigen Arbeiten mit Browser, Teams, PowerPoint und Bildbearbeitung zeigt der Task-Manager 95 % RAM-Auslastung, während der Datenträger nur bei 20 % liegt. Welche Aufrüstung hilft hier am direktesten?","options":["RAM","HDD","SSD"],"correct":0,"answer":"RAM","explanation":"Bei 95 % RAM-Auslastung ist zusätzlicher Arbeitsspeicher am direktesten hilfreich."},{"id":"5-4","q":"4. Was passiert mit den Daten im RAM, wenn der Strom ausgeschaltet wird?","answer":"Die Daten im RAM gehen verloren.","explanation":"RAM ist flüchtiger Arbeitsspeicher und benötigt Strom, um Inhalte zu halten."},{"id":"5-5","q":"5. Nenne einen Vorteil einer SSD gegenüber einer HDD.","answer":"Zum Beispiel: schneller, leiser, robuster oder keine beweglichen Teile.","explanation":"Ein fachlich richtiger Vorteil genügt. SSDs sind insbesondere bei typischen Zugriffs- und Startzeiten meist schneller als HDDs."}]},{"id":"kaufberatung","title":"6. Kaufberatung","lead":"Eine Kundin braucht einen Laptop für Word/PowerPoint, viele Browser-Tabs, Videokonferenzen und Schule. Anspruchsvolle Games spielt sie nicht.","points":4,"comparison":[{"name":"LAPTOP A","details":["8 GB RAM","256 GB SSD","sehr starke Grafikkarte","CHF 1'500"]},{"name":"LAPTOP B","details":["16 GB RAM","512 GB SSD","normale integrierte Grafik","CHF 850"]}],"questions":[{"id":"6-1","points":4,"q":"Welchen Laptop würdest du empfehlen? Nenne drei kurze, sinnvolle Gründe für deine Entscheidung.\nEntscheidung: 1 P · Gründe: je 1 P, max. 3 P","answer":"Laptop B","explanation":"Mögliche Gründe (je 1 Punkt, maximal 3):\n• 16 GB RAM sind für viele Tabs und gleichzeitig laufende Programme geeigneter.\n• 512 GB SSD bieten mehr Speicherplatz.\n• Für die beschriebenen Aufgaben ist keine besonders starke Grafikkarte nötig.\n• Laptop B ist deutlich günstiger.\n• Das Gesamtpaket passt besser zum beschriebenen Einsatzzweck.\nAuch andere sinnvolle und fachlich richtige Gründe zählen."}]},{"id":"troubleshooting","title":"7. Troubleshooting","lead":"Kreuze bei jedem Fall genau zwei sinnvolle erste Troubleshooting-Schritte an. Je korrekt gewähltem Schritt 1 P. Werden in einem Fall mehr als zwei Schritte angekreuzt, gibt dieser Fall 0 P.","points":6,"questions":[{"id":"7-1","points":2,"q":"A) PC reagiert gar nicht – 2 P\nBeim Drücken des Einschaltknopfs passiert nichts: keine LEDs, keine Lüfter, kein Geräusch.","options":["Prüfen, ob das Stromkabel fest am PC und an der Steckdose steckt","Eine andere Steckdose testen","HDMI-/DisplayPort-Kabel zum Monitor prüfen","Maus an einem anderen USB-Anschluss testen","Netzwerkkabel austauschen","Browser neu öffnen"],"correct":[0,1],"answer":"1. Prüfen, ob das Stromkabel fest am PC und an der Steckdose steckt\n2. Eine andere Steckdose testen","explanation":"Prüfe zuerst die Stromversorgung. Zwei sinnvolle Antworten ergeben 2 Punkte. Mehr als zwei Kreuze führen bei diesem Fall zu 0 Punkten."},{"id":"7-2","points":2,"q":"B) Monitor meldet „Kein Signal“ – 2 P\nDer PC läuft: LEDs und Lüfter sind an, aber der Monitor meldet direkt beim Einschalten „Kein Signal“.","options":["HDMI-/DisplayPort-Kabel prüfen","Richtigen Eingang am Monitor auswählen","Netzwerkkabel zum Router prüfen","Maus neu anschliessen","Drucker aus- und einschalten","Eine andere Webseite öffnen"],"correct":[0,1],"answer":"1. HDMI-/DisplayPort-Kabel prüfen\n2. Richtigen Eingang am Monitor auswählen","explanation":"Wenn der PC läuft, aber der Monitor kein Signal erkennt, prüfst du zuerst Bildkabel und gewählten Eingang. Mehr als zwei Kreuze führen bei diesem Fall zu 0 Punkten."},{"id":"7-3","points":2,"q":"C) Kein Internet über Netzwerkkabel – 2 P\nAm PC steht „Netzwerkkabel nicht angeschlossen“.","options":["Prüfen, ob das RJ45-Kabel am PC und am Router/Switch richtig steckt","Ein anderes Netzwerkkabel testen","HDMI-/DisplayPort-Kabel zum Monitor prüfen","WLAN-Passwort neu eingeben","Lautsprecher neu anschliessen","Bildschirmhelligkeit ändern"],"correct":[0,1],"answer":"1. Prüfen, ob das RJ45-Kabel am PC und am Router/Switch richtig steckt\n2. Ein anderes Netzwerkkabel testen","explanation":"Die Meldung deutet zuerst auf ein Kabel- oder Verbindungsproblem hin. Mehr als zwei Kreuze führen bei diesem Fall zu 0 Punkten."}]},{"id":"green-it","title":"8. Green IT","lead":"Beantworte die Fragen zur nachhaltigen Nutzung von Geräten.","points":4,"questions":[{"id":"8-1","points":2,"q":"1. Ein funktionierender Laptop ist vier Jahre alt. Der Akku hält nicht mehr lange. Was ist nachhaltiger?\nBegründe deine Entscheidung. (2 P)","options":["A: Neues Gerät kaufen","B: Akku ersetzen und Laptop weiterverwenden"],"correct":1,"answer":"B: Akku ersetzen und Laptop weiterverwenden.","explanation":"Die längere Nutzungsdauer vermeidet häufig eine unnötige Neuproduktion und spart Rohstoffe. 1 Punkt für die passende Entscheidung, 1 Punkt für die sinnvolle Begründung."},{"id":"8-2","q":"2. Warum ist die Herstellung von Elektronik ökologisch relevant? Nenne einen Grund. (1 P)","answer":"Zum Beispiel: Rohstoffabbau, Energieverbrauch bei der Herstellung, Transporte oder die Nutzung knapper Metalle.","explanation":"Ein fachlich richtiger ökologischer Grund genügt."},{"id":"8-3","q":"3. Was sollte mit einem defekten Smartphone gemacht werden? (1 P)","options":["A: Hausmüll","B: Schublade","C: Fachgerecht zurückgeben/recyceln"],"correct":2,"answer":"C: Fachgerecht zurückgeben/recyceln.","explanation":"Elektrogeräte gehören in die geeignete Rückgabe- und Recycling-Sammlung, nicht in den Hausmüll."}]},{"id":"bonus","title":"Bonus – max. +2 P","lead":"Zwei freiwillige Transferfragen. Jede richtige Lösung gibt +1 Bonuspunkt.","points":2,"bonus":true,"questions":[{"id":"B-1","q":"Bonus 1 – Hardware Detective (+1 P)\nEin Schüler sagt: „Mein PC ist langsam, also brauche ich sicher eine neue Grafikkarte.“\nDer PC hat: 4 GB RAM · HDD · CPU 35 % · GPU 8 % · 17 Browser-Tabs geöffnet\nWas würdest du zuerst ändern – und warum?","answer":"RAM erweitern und/oder HDD durch eine SSD ersetzen.","explanation":"Die Grafikkarte ist bei 8 % GPU-Auslastung wahrscheinlich nicht der Engpass. Bei 4 GB RAM und vielen geöffneten Browser-Tabs kann mehr RAM helfen; eine SSD kann die alltäglichen Zugriffs- und Ladezeiten verbessern. Eine fachlich sinnvolle Massnahme mit Begründung genügt."},{"id":"B-2","q":"Bonus 2 – Flaschenhals (+1 P)\nEin PC hat: 32 GB RAM · starke CPU · starke Grafikkarte · 5400-rpm-HDD · Windows startet in 2 Minuten\nWelche Komponente ist der wahrscheinlichste Flaschenhals? Begründe kurz.","answer":"Die 5400-rpm-HDD.","explanation":"Sie ist gegenüber CPU, RAM und Grafikkarte der wahrscheinlichste Flaschenhals für die langen Startzeiten. Eine SSD würde den Start typischerweise beschleunigen."}]}]</script>
  <script>
    (function(){
      'use strict';
      const data = JSON.parse(document.getElementById('p1-data').textContent);
      const storageKey = 'ib2026_hw_p1_korrektur_v1';
      let states = {};
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
        if (saved && typeof saved === 'object' && !Array.isArray(saved)) states = saved;
      } catch (_e) {}
      let errorsOnly = false;
      const root = document.getElementById('sections');
      const nav = document.getElementById('sectionNav');
      const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const entry = id => states[id] || (states[id] = {wrong:false,done:false,note:''});
      function persist(){try{localStorage.setItem(storageKey,JSON.stringify(states));}catch(_e){}}
      function questionHTML(q) {
        const options = q.options ? '<ul class="choices" aria-label="Antwortmöglichkeiten">'+q.options.map((option,i)=>'<li class="choice '+((Array.isArray(q.correct)?q.correct.includes(i):q.correct===i)?'correct':'')+'"><span class="choice-letter">'+String.fromCharCode(65+i)+'</span><span>'+esc(option)+'</span><span class="choice-tick" aria-label="Richtig">✓</span></li>').join('')+'</ul>' : '';
        // The highlighted answer choice is sufficient for multiple-choice questions.
        const answer = q.options ? '' : '<div class="answer-line"><span class="answer-mark" aria-hidden="true">✓</span><span class="answer">'+esc(q.answer)+'</span></div>';
        const why = q.explanation ? '<details class="reason"><summary aria-label="Erklärung anzeigen" title="Erklärung anzeigen">?</summary><p>'+esc(q.explanation)+'</p></details>' : '';
        const label = q.id.startsWith('B') ? q.id.replace('-','.') : q.id.replace('-', '.');
        const hasOriginalLabel = /^(?:\d+\.\s|[A-C]\)\s|Bonus\s+\d+\b)/.test(q.q);
        const numberBadge = hasOriginalLabel ? '' : '<span class="q-number">'+esc(label)+'</span>';
        return '<article class="question-card" data-id="'+esc(q.id)+'"><div class="question-top">'+numberBadge+'<div><p class="q-text">'+esc(q.q)+'</p>'+((q.points || 1)>1 ? '<div class="q-meta">'+(q.points || 1)+' Punkte</div>' : '')+'</div></div>'+options+answer+why+
          '<label class="selfcheck"><input class="wrong-input" type="checkbox" aria-label="Fehler bei Frage '+esc(label)+' markieren">Fehler <span class="fix-status" aria-live="polite"></span></label>'+
          '<div class="correction-area" hidden><label class="note-label" for="correction-'+esc(q.id)+'">Korrektur</label><textarea id="correction-'+esc(q.id)+'" class="note-input" placeholder="Richtige Antwort notieren …"></textarea><label class="done-label"><input type="checkbox" class="done-input">Korrigiert</label></div></article>';
      }
      data.forEach((s,index)=>{
        const section = document.createElement('section');
        section.className='sheet'+(s.bonus?' bonus':'');
        section.id=s.id;
        const context = s.context ? '<div class="section-context">'+esc(s.context)+'</div>' : '';
        const comparison = s.comparison ? '<div class="laptop-grid">'+s.comparison.map(l=>'<div class="laptop-card"><h3>'+esc(l.name)+'</h3><ul>'+l.details.map(d=>'<li>'+esc(d)+'</li>').join('')+'</ul></div>').join('')+'</div>' : '';
        // Word headings already contain their chapter number. Do not show it twice.
        const hasOriginalChapterNumber = /^\d+\.\s/.test(s.title);
        const sectionBadge = hasOriginalChapterNumber ? '' : '<span class="sheet-number">'+(s.bonus?'★':String(index+1).padStart(2,'0'))+'</span>';
        section.innerHTML='<header class="sheet-head">'+sectionBadge+'<div><h2>'+esc(s.title)+'</h2><p>'+esc(s.lead)+'</p><span class="points">'+(s.bonus?'+':'')+s.points+' '+(s.points===1?'Punkt':'Punkte')+'</span></div></header>'+context+comparison+'<div class="question-list">'+s.questions.map(questionHTML).join('')+'</div>';
        root.appendChild(section);
        const a=document.createElement('a');a.href='#'+s.id;a.textContent=(hasOriginalChapterNumber?'':(s.bonus?'★ · ':index+1+' · '))+s.title;nav.appendChild(a);
      });
      function updateCard(card){
        const s=entry(card.dataset.id);
        card.querySelector('.wrong-input').checked=!!s.wrong;
        card.querySelector('.correction-area').hidden=!s.wrong;
        card.querySelector('.done-input').checked=!!s.done;
        card.querySelector('.note-input').value=s.note || '';
        card.classList.toggle('is-fixed',!!s.wrong&&!!s.done);
        card.querySelector('.fix-status').textContent=s.wrong?(s.done?'✓':'Offen'):'';
      }
      function updateProgress(){
        let wrong=0,done=0;
        Object.values(states).forEach(s=>{if(s.wrong){wrong++;if(s.done)done++;}});
        document.getElementById('progressArea').hidden=wrong===0;
        const percent=wrong?Math.round(done/wrong*100):0;
        document.getElementById('progressLabel').textContent=wrong?done+' von '+wrong+' korrigiert':'Noch keine Fehler markiert';
        document.getElementById('progressFill').style.width=percent+'%';
        document.querySelector('.progress-track').setAttribute('aria-valuenow',String(percent));
      }
      function applyFilter(){
        const wrongCount=Object.values(states).filter(s=>s.wrong).length;
        if(wrongCount===0)errorsOnly=false;
        let visible=0;
        document.querySelectorAll('.sheet').forEach(section=>{
          let sectionVisible=0;
          section.querySelectorAll('.question-card').forEach(card=>{
            const show=!errorsOnly || !!entry(card.dataset.id).wrong;
            card.hidden=!show;
            if(show){sectionVisible++;visible++;}
          });
          section.hidden=sectionVisible===0;
        });
        document.getElementById('reviewActions').hidden=wrongCount===0;
        const btn=document.getElementById('errorFilter');
        btn.setAttribute('aria-pressed',String(errorsOnly));
        btn.textContent=errorsOnly?'Alle Aufgaben':'Nur Fehler ('+wrongCount+')';
      }
      root.querySelectorAll('.question-card').forEach(updateCard);
      root.addEventListener('change',e=>{
        const card=e.target.closest('.question-card');
        if(!card)return;
        const s=entry(card.dataset.id);
        if(e.target.matches('.wrong-input')){
          s.wrong=e.target.checked;
          if(!s.wrong)s.done=false;
          persist();updateCard(card);updateProgress();applyFilter();
        }else if(e.target.matches('.done-input')){
          s.done=e.target.checked;persist();card.classList.toggle('is-fixed',s.done);card.querySelector('.fix-status').textContent=s.done?'✓':'Offen';updateProgress();
        }
      });
      root.addEventListener('input',e=>{
        if(!e.target.matches('.note-input'))return;
        const card=e.target.closest('.question-card');
        entry(card.dataset.id).note=e.target.value;
        persist();
      });
      document.getElementById('errorFilter').addEventListener('click',()=>{errorsOnly=!errorsOnly;applyFilter();document.getElementById('sections').scrollIntoView({block:'start'});});
      document.getElementById('printButton').addEventListener('click',()=>window.print());
      let printFilter=null;
      window.addEventListener('beforeprint',()=>{
        printFilter=errorsOnly;
        errorsOnly=false;
        applyFilter();
      });
      window.addEventListener('afterprint',()=>{
        if(printFilter!==null){errorsOnly=printFilter;printFilter=null;applyFilter();}
      });
      updateProgress();applyFilter();
    })();
  </script>
</body>
</html>
