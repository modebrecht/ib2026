<!doctype html>
<html lang="de" class="h-full">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A12: Schnittstellen sortieren</title>
<script src="assets/js/tailwind.min.js"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{onedrive:{500:'#0078d4',600:'#106ebe'}}}}};</script>
<link rel="stylesheet" href="assets/css/fontawesome.min.css">
<link rel="stylesheet" href="assets/css/worksheet-common.css">
<style>
@import url('assets/fonts/inter.css');
*{box-sizing:border-box}body{font-family:'Segoe UI','Inter',system-ui,sans-serif}.surface{background:rgba(255,255,255,.93);border:1px solid rgba(226,232,240,.95);box-shadow:0 18px 48px rgba(15,23,42,.07);backdrop-filter:blur(14px)}.dark .surface{background:rgba(15,23,42,.92);border-color:#334155;box-shadow:0 18px 48px rgba(0,0,0,.24)}.field{width:100%;min-height:44px;padding:.68rem .78rem;border:1px solid #cbd5e1;border-radius:.8rem;background:#fff}.dark .field{background:#1e293b;border-color:#475569;color:#fff}.conn-card{border:1px solid #e2e8f0;border-radius:1.1rem;padding:.9rem;background:rgba(248,250,252,.86);transition:.18s}.dark .conn-card{border-color:#334155;background:rgba(30,41,59,.72)}.conn-card.ok{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.08)}.conn-card.bad{border-color:#f59e0b}.progress-glow{background:linear-gradient(90deg,#0078d4,#7c3aed,#10b981);background-size:200% 100%;animation:flow 3.5s linear infinite}@keyframes flow{to{background-position:200% 0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="min-h-full overflow-x-hidden bg-gradient-to-br from-slate-100 via-sky-50/50 to-violet-50/30 dark:from-slate-950 dark:via-slate-950 dark:to-slate-900 text-slate-800 dark:text-slate-100">
<header class="sticky top-0 z-40 worksheet-header">
<div class="max-w-5xl mx-auto p-3 flex items-center justify-between gap-3"><div class="min-w-0"><div class="text-[10px] uppercase font-black tracking-[.16em] text-slate-400">A12 · Schnittstellen sortieren</div><div class="flex items-center gap-2 mt-.5"><div id="pct" class="font-black text-onedrive-600 dark:text-blue-400">0% bearbeitet</div><span class="hidden sm:inline text-slate-300 dark:text-slate-700">•</span><div class="hidden sm:block text-xs font-bold text-slate-400">12 Anschlüsse</div></div></div><div class="flex gap-2 shrink-0"><button class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/70 dark:bg-slate-900" onclick="toggleDarkMode()" title="Dunkelmodus"><i id="themeIcon" class="fa-solid fa-moon"></i></button><button id="pdf" class="w-10 h-10 rounded-xl bg-slate-200 text-slate-400 dark:bg-slate-800 dark:text-slate-600" onclick="makePdf()" title="PDF nach Abschluss"><i class="fa-solid fa-lock"></i></button><button class="w-10 h-10 rounded-xl border border-rose-200 dark:border-rose-900/60 bg-white/70 dark:bg-slate-900 text-rose-600" onclick="resetA12()" title="Zurücksetzen"><i class="fa-solid fa-rotate-right"></i></button></div></div>
<div class="h-1 bg-slate-200 dark:bg-slate-800 overflow-hidden"><div id="bar" class="h-1 progress-glow" style="width:0"></div></div>
</header>
<main class="max-w-5xl mx-auto p-4 sm:p-6 lg:p-8 space-y-5">
<section class="surface rounded-[1.6rem] p-5 sm:p-6"><div class="flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-violet-500 to-sky-500 text-white flex items-center justify-center text-xl shadow-lg shrink-0"><i class="fa-solid fa-plug"></i></div><div><h1 class="text-2xl sm:text-3xl font-black tracking-tight">Schnittstellen richtig sortieren</h1><p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Ordne 12 typische Anschlüsse einer Hauptkategorie zu: Bild &amp; Ton, Daten &amp; Geräte, Netzwerk oder Strom.</p></div></div><div class="hidden"><input id="studentName" readonly><input id="studentClass" readonly value="B24"><input id="studentDate" readonly></div></section>
<section class="surface rounded-[1.8rem] p-5 sm:p-7"><div id="conn" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div></section>
</main>
<script src="assets/js/worksheet-common.js"></script><script src="assets/js/pdf-engine.js"></script>
<script>
const K='onedrive_a12_schnittstellen_9sek';
const C=[
{id:'usb-a',name:'USB-A',desc:'Klassischer rechteckiger USB-Anschluss.',img:'assets/usb_a_cable_1786198032413.webp',category:'data'},
{id:'usb-c',name:'USB-C',desc:'Kompakter, beidseitig einsteckbarer USB-Anschluss.',img:'assets/usb_c_cable_1786198043571.webp',category:'data'},
{id:'hdmi',name:'HDMI',desc:'Digitaler Anschluss für Bild und Ton.',img:'assets/hdmi_cable_1786198053921.webp',category:'av'},
{id:'dp',name:'DisplayPort',desc:'Digitaler Monitoranschluss für Bild und Ton.',img:'assets/dp_cable_1786198067133.webp',category:'av'},
{id:'rj45',name:'LAN (RJ45)',desc:'Kabelgebundene Netzwerkverbindung.',img:'assets/lan_cable_1786198076546.webp',category:'network'},
{id:'audio',name:'Audio 3,5 mm',desc:'Klinkenanschluss für Kopfhörer, Mikrofon oder Lautsprecher.',img:'assets/audio_cable_1786198086224.webp',category:'av'},
{id:'vga',name:'VGA',desc:'Älterer analoger Bildanschluss.',img:'assets/vga_cable_1786198097423.webp',category:'av'},
{id:'dvi',name:'DVI',desc:'Älterer digitaler Bildanschluss.',img:'assets/dvi_cable_1786198107586.webp',category:'av'},
{id:'usb-b',name:'USB-B',desc:'USB-Anschluss, oft an Druckern.',img:'assets/usb_b_cable_1786198671715.webp',category:'data'},
{id:'micro-usb',name:'Micro-USB',desc:'Älterer kleiner USB-Anschluss.',img:'assets/img_micro_usb_1786222089308.jpg',category:'data'},
{id:'lightning',name:'Apple Lightning',desc:'Anschluss älterer iPhones und iPads.',img:'assets/img_lightning_1786222112950.jpg',category:'data'},
{id:'power',name:'Stromkabel C13',desc:'Versorgt das PC-Netzteil mit Strom.',img:'assets/power_cable_1786198664189.webp',category:'power'}
];
const LABEL={av:'Bild & Ton',data:'Daten & Geräte',network:'Netzwerk',power:'Strom'};const $=id=>document.getElementById(id);let timer;
function build(){$('conn').innerHTML=C.map(x=>`<article id="card_${x.id}" class="conn-card"><div class="flex items-start gap-3"><img src="${x.img}" alt="${x.name}" class="w-20 h-16 rounded-xl object-cover bg-white border border-slate-200 dark:border-slate-700" onerror="this.style.display='none'"><div><h2 class="font-black">${x.name}</h2><p class="text-xs text-slate-500 dark:text-slate-400 mt-1">${x.desc}</p></div></div><select id="choice_${x.id}" class="field mt-3"><option value="">Kategorie wählen …</option><option value="av">Bild &amp; Ton</option><option value="data">Daten &amp; Geräte</option><option value="network">Netzwerk</option><option value="power">Strom</option></select><div id="fb_${x.id}" class="text-xs font-black min-h-[1.25rem] mt-2"></div></article>`).join('')}
function update(){let n=0;C.forEach(x=>{const e=$('choice_'+x.id),card=$('card_'+x.id),fb=$('fb_'+x.id),ok=e.value===x.category;if(ok)n++;card.classList.toggle('ok',ok);card.classList.toggle('bad',!!e.value&&!ok);fb.textContent=!e.value?'':ok?'✓ Richtig':`Noch nicht – ${x.name} gehört hier nicht hin.`;fb.className='text-xs font-black min-h-[1.25rem] mt-2 '+(ok?'text-emerald-600':'text-amber-600')});const p=Math.round(n/C.length*100),b=$('pdf');$('pct').textContent=p+'% bearbeitet';$('bar').style.width=p+'%';const done=p===100;b.className=done?'w-10 h-10 rounded-xl bg-emerald-600 text-white shadow-lg shadow-emerald-500/20':'w-10 h-10 rounded-xl bg-slate-200 text-slate-400 dark:bg-slate-800 dark:text-slate-600';b.innerHTML=done?'<i class="fa-solid fa-file-pdf"></i>':'<i class="fa-solid fa-lock"></i>';b.title=done?'PDF frei':'PDF nach Abschluss';saveLater();return p}
function data(){const choices={};C.forEach(x=>choices[x.id]=$('choice_'+x.id).value);return{version:1,choices}}
function saveLater(){clearTimeout(timer);timer=setTimeout(()=>localStorage.setItem(K,JSON.stringify(data())),120)}
function load(){try{const d=JSON.parse(localStorage.getItem(K)||'{}');C.forEach(x=>{const e=$('choice_'+x.id);if(e)e.value=d.choices?.[x.id]||''})}catch(e){}}
function resetA12(){if(!confirm('A12 vollständig zurücksetzen?'))return;localStorage.removeItem(K);location.reload()}
function makePdf(){if(update()<100)return alert('PDF erst, wenn alle 12 Anschlüsse richtig sortiert sind.');downloadTextWorksheetPDF({title:'A12 · Schnittstellen sortieren',filenamePrefix:'A12_Schnittstellen',sections:[{heading:'Sortierung',fields:C.map(x=>({label:x.name,value:LABEL[x.category]}))}]})}
build();load();document.querySelectorAll('select').forEach(e=>e.addEventListener('change',update));update();if(typeof applyDefaultClassAndDate==='function')applyDefaultClassAndDate();
</script>
</body></html>
