<!doctype html>
<html lang="de" class="h-full">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A11: Kaufberatung</title>
<script src="assets/js/tailwind.min.js"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{onedrive:{500:'#0078d4',600:'#106ebe'}}}}};</script>
<link rel="stylesheet" href="assets/css/fontawesome.min.css">
<link rel="stylesheet" href="assets/css/worksheet-common.css">
<style>
@import url('assets/fonts/inter.css');
*{box-sizing:border-box}body{font-family:'Segoe UI','Inter',system-ui,sans-serif}.surface{background:rgba(255,255,255,.93);border:1px solid rgba(226,232,240,.95);box-shadow:0 18px 48px rgba(15,23,42,.07);backdrop-filter:blur(14px)}.dark .surface{background:rgba(15,23,42,.92);border-color:#334155;box-shadow:0 18px 48px rgba(0,0,0,.24)}.field{width:100%;min-height:44px;padding:.7rem .8rem;border:1px solid #cbd5e1;border-radius:.85rem;background:#fff}.dark .field{background:#1e293b;border-color:#475569;color:#fff}.advisor-card{border:1px solid #e2e8f0;border-radius:1.25rem;padding:1rem;background:rgba(248,250,252,.86)}.dark .advisor-card{border-color:#334155;background:rgba(30,41,59,.72)}.advisor-card.ok{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.08)}.advisor-card.bad{border-color:#f59e0b}.progress-glow{background:linear-gradient(90deg,#0078d4,#7c3aed,#10b981);background-size:200% 100%;animation:flow 3.5s linear infinite}@keyframes flow{to{background-position:200% 0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="min-h-full overflow-x-hidden bg-gradient-to-br from-slate-100 via-sky-50/50 to-violet-50/30 dark:from-slate-950 dark:via-slate-950 dark:to-slate-900 text-slate-800 dark:text-slate-100">
<header class="sticky top-0 z-40 worksheet-header">
<div class="max-w-5xl mx-auto p-3 flex items-center justify-between gap-3"><div class="min-w-0"><div class="text-[10px] uppercase font-black tracking-[.16em] text-slate-400">A11 · Kaufberatung</div><div class="flex items-center gap-2 mt-.5"><div id="pct" class="font-black text-onedrive-600 dark:text-blue-400">0% bearbeitet</div><span class="hidden sm:inline text-slate-300 dark:text-slate-700">•</span><div class="hidden sm:block text-xs font-bold text-slate-400">4 Fälle</div></div></div><div class="flex gap-2 shrink-0"><button class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/70 dark:bg-slate-900" onclick="toggleDarkMode()" title="Dunkelmodus"><i id="themeIcon" class="fa-solid fa-moon"></i></button><button id="pdf" class="w-10 h-10 rounded-xl bg-slate-200 text-slate-400 dark:bg-slate-800 dark:text-slate-600" onclick="makePdf()" title="PDF nach Abschluss"><i class="fa-solid fa-lock"></i></button><button class="w-10 h-10 rounded-xl border border-rose-200 dark:border-rose-900/60 bg-white/70 dark:bg-slate-900 text-rose-600" onclick="resetA11()" title="Zurücksetzen"><i class="fa-solid fa-rotate-right"></i></button></div></div>
<div class="h-1 bg-slate-200 dark:bg-slate-800 overflow-hidden"><div id="bar" class="h-1 progress-glow" style="width:0"></div></div>
</header>
<main class="max-w-5xl mx-auto p-4 sm:p-6 lg:p-8 space-y-5">
<section class="surface rounded-[1.6rem] p-5 sm:p-6"><div class="flex items-center gap-4"><div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-sky-500 to-violet-600 text-white flex items-center justify-center text-xl shadow-lg shrink-0"><i class="fa-solid fa-cart-shopping"></i></div><div><h1 class="text-2xl sm:text-3xl font-black tracking-tight">Welcher Computer passt?</h1><p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Wähle für vier Personen die wichtigste Hardware-Priorität und begründe kurz deine Empfehlung.</p></div></div><div class="hidden"><input id="studentName" readonly><input id="studentClass" readonly value="B24"><input id="studentDate" readonly></div></section>
<section class="surface rounded-[1.8rem] p-5 sm:p-7"><div id="cases" class="grid md:grid-cols-2 gap-4"></div></section>
</main>
<script src="assets/js/worksheet-common.js"></script><script src="assets/js/pdf-engine.js"></script>
<script>
const K='onedrive_a11_kaufberatung_9sek';
const CASES=[
{id:'gaming',icon:'fa-gamepad',title:'Gaming & Videoschnitt',text:'Neue Spiele und Videoschnitt sollen flüssig laufen.',correct:'gpu',answer:'Starke Grafikkarte (GPU)'},
{id:'school',icon:'fa-graduation-cap',title:'Schule & unterwegs',text:'Office, Browser und Videokonferenzen – oft ohne Steckdose.',correct:'battery',answer:'Leichtes Gerät + guter Akku'},
{id:'multitask',icon:'fa-layer-group',title:'Viele Programme gleichzeitig',text:'Viele Browser-Tabs, Teams und Office sind gleichzeitig offen.',correct:'ram',answer:'Mehr Arbeitsspeicher (RAM)'},
{id:'slowpc',icon:'fa-gauge-high',title:'Alter PC startet sehr langsam',text:'Windows und Programme brauchen ewig zum Starten. Im PC steckt noch eine HDD.',correct:'ssd',answer:'SSD statt HDD'}
];
const OPTIONS=[['','Priorität wählen …'],['gpu','Starke Grafikkarte (GPU)'],['battery','Leichtes Gerät + guter Akku'],['ram','Mehr Arbeitsspeicher (RAM)'],['ssd','SSD statt HDD'],['cpu','Möglichst viele CPU-Kerne']];
const $=id=>document.getElementById(id);let timer;
function build(){$('cases').innerHTML=CASES.map((x,i)=>`<article id="card_${x.id}" class="advisor-card"><div class="flex items-start gap-3"><div class="w-11 h-11 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-onedrive-600 shrink-0"><i class="fa-solid ${x.icon}"></i></div><div><div class="text-[10px] uppercase font-black tracking-[.15em] text-slate-400">Fall ${i+1}</div><h2 class="font-black text-lg">${x.title}</h2><p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${x.text}</p></div></div><label class="block text-xs font-black mt-4">Was ist hier besonders wichtig?</label><select id="choice_${x.id}" class="field mt-1">${OPTIONS.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select><div id="fb_${x.id}" class="text-xs font-black min-h-[1.25rem] mt-2"></div><label class="block text-xs font-black mt-3">Begründe deine Empfehlung kurz.</label><textarea id="reason_${x.id}" class="field mt-1" rows="2" placeholder="Ich empfehle das, weil …"></textarea></article>`).join('')}
function score(){let n=0,total=CASES.length*2;CASES.forEach(x=>{const choice=$('choice_'+x.id),reason=$('reason_'+x.id),card=$('card_'+x.id),fb=$('fb_'+x.id),ok=choice.value===x.correct,reasonOk=reason.value.trim().length>=15;if(ok)n++;if(reasonOk)n++;card.classList.toggle('ok',ok&&reasonOk);card.classList.toggle('bad',!!choice.value&&!ok);fb.textContent=!choice.value?'':ok?'✓ Gute Priorität':'Noch nicht – überlege, was das Problem direkt verbessert.';fb.className='text-xs font-black min-h-[1.25rem] mt-2 '+(ok?'text-emerald-600':'text-amber-600')});return[n,total]}
function update(){const[n,total]=score(),p=Math.round(n/total*100),b=$('pdf');$('pct').textContent=p+'% bearbeitet';$('bar').style.width=p+'%';const done=p===100;b.className=done?'w-10 h-10 rounded-xl bg-emerald-600 text-white shadow-lg shadow-emerald-500/20':'w-10 h-10 rounded-xl bg-slate-200 text-slate-400 dark:bg-slate-800 dark:text-slate-600';b.innerHTML=done?'<i class="fa-solid fa-file-pdf"></i>':'<i class="fa-solid fa-lock"></i>';b.title=done?'PDF frei':'PDF nach Abschluss';saveLater();return p}
function data(){const values={};CASES.forEach(x=>{values['choice_'+x.id]=$('choice_'+x.id).value;values['reason_'+x.id]=$('reason_'+x.id).value});return{version:1,values}}
function saveLater(){clearTimeout(timer);timer=setTimeout(()=>localStorage.setItem(K,JSON.stringify(data())),120)}
function load(){try{const d=JSON.parse(localStorage.getItem(K)||'{}');Object.entries(d.values||{}).forEach(([id,v])=>{const e=$(id);if(e)e.value=v})}catch(e){}}
function resetA11(){if(!confirm('A11 vollständig zurücksetzen?'))return;localStorage.removeItem(K);location.reload()}
function makePdf(){if(update()<100)return alert('PDF erst, wenn alle vier Empfehlungen stimmen und begründet sind.');downloadTextWorksheetPDF({title:'A11 · Kaufberatung',filenamePrefix:'A11_Kaufberatung',sections:CASES.map(x=>({heading:x.title,fields:[{label:'Empfehlung',value:x.answer},{label:'Begründung',value:$('reason_'+x.id).value}]}))})}
build();load();document.querySelectorAll('select,textarea').forEach(e=>{e.addEventListener('change',update);e.addEventListener('input',update)});update();if(typeof applyDefaultClassAndDate==='function')applyDefaultClassAndDate();
</script>
</body></html>
