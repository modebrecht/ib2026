<!doctype html>
<html lang="de" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>A11: Grüne IT & Nachhaltigkeit</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f5f5}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
  <iframe id="sheet" src="A23.html" title="A11: Grüne IT & Nachhaltigkeit"></iframe>
  <script>
    const frame=document.getElementById('sheet');
    function relabel(){
      try{
        const d=frame.contentDocument;
        if(!d)return;
        d.title=d.title.replace(/A9/g,'A11');
        const w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);
        const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
        nodes.forEach(n=>{if(n.nodeValue&&n.nodeValue.includes('A9'))n.nodeValue=n.nodeValue.replace(/A9/g,'A11')});
      }catch(e){}
    }
    frame.addEventListener('load',()=>{relabel();setTimeout(relabel,250)});
  </script>
</body>
</html>
