<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A5: Schnittstellen & PC-Kabel</title>
<script src="assets/js/tailwind.min.js"></script>
<script>
tailwind.config={darkMode:'class',theme:{extend:{colors:{onedrive:{500:'#0078d4',600:'#106ebe',700:'#005a9e'}},fontFamily:{sans:['Segoe UI','Inter','system-ui','sans-serif']}}}};
</script>
<link rel="stylesheet" href="assets/css/fontawesome.min.css">
<style>
@import url('assets/fonts/inter.css');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI','Inter',system-ui,sans-serif}
.card{background:white;border:1px solid #e2e8f0;border-radius:1rem}
.dark .card{background:#0f172a;border-color:#334155}
.field{width:100%;border:1px solid #cbd5e1;border-radius:.75rem;padding:.65rem .75rem;background:#fff}
.dark .field{background:#1e293b;border-color:#475569;color:#f8fafc}
.btn{border-radius:.75rem;padding:.6rem .85rem;font-weight:700}
@media(max-width:640px){.mobile-stack{grid-template-columns:1fr!important}}
</style>
</head>
<body class="min-h-full bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100">
<header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 border-b border-slate-200 dark:border-slate-800">
  <div class="max-w-[1500px] mx-auto px-3 sm:px-6 py-2.5 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-lg bg-onedrive-500 text-white flex items-center justify-center"><i class="fa-solid fa-plug"></i></div>
      <div><div class="text-[10px] uppercase font-bold text-slate-400">Fortschritt</div><div id="headerPercentText" class="text-sm font-extrabold text-onedrive-600">0% erledigt</div></div>
    </div>
    <div class="flex gap-2">
      <button class="btn border border-slate-300 dark:border-slate-700" onclick="toggleDarkMode()" title="Dunkelmodus"><i id="themeIcon" class="fa-solid fa-moon"></i></button>
      <button id="pdfBtn" class="btn bg-slate-200 dark:bg-slate-800 text-slate-400 opacity-60" onclick="downloadPdf()" title="Erst bei 100%"><i class="fa-solid fa-file-pdf"></i></button>
      <button class="btn border border-rose-300 text-rose-600" onclick="resetA5()" title="Zurücksetzen"><i class="fa-solid fa-rotate-right"></i></button>
    </div>
  </div>
  <div class="h-1 bg-slate-200 dark:bg-slate-800"><div id="progressBar" class="h-1 bg-onedrive-500 transition-all" style="width:0%"></div></div>
</header>

<main class="max-w-[1500px] mx-auto px-3 sm:px-6 py-5 space-y-4">
  <section class="max-w-4xl mx-auto">
    <div id="connectorGrid"></div>
    <nav class="mt-4 flex items-center justify-between gap-3" aria-label="Anschlusskarten">
      <button id="prevCardBtn" type="button" class="btn border border-slate-300 dark:border-slate-700 disabled:opacity-40 disabled:cursor-not-allowed" onclick="changeCard(-1)">
        <i class="fa-solid fa-arrow-left mr-1"></i> Zurück
      </button>
      <div class="text-center">
        <div id="cardCounter" class="text-sm font-black text-onedrive-600">1 / 16</div>
        <div id="cardCounterLabel" class="text-[10px] uppercase font-bold tracking-wider text-slate-400">Information</div>
      </div>
      <button id="nextCardBtn" type="button" class="btn bg-onedrive-500 hover:bg-onedrive-600 text-white disabled:opacity-40 disabled:cursor-not-allowed" onclick="changeCard(1)">
        Weiter <i class="fa-solid fa-arrow-right ml-1"></i>
      </button>
    </nav>
  </section>
</main>

<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 translate-y-8 opacity-0 transition-all bg-slate-900 text-white px-4 py-3 rounded-xl text-sm font-bold z-50"></div>

<script src="assets/js/worksheet-common.js"></script>
<script src="assets/js/pdf-engine.js"></script>
<script>
const STORAGE_KEY='onedrive_a5_worksheet_8sek';
const LEGACY_AUTOSAVE_KEY='hw_autosave_A5.html';
const CONNECTORS=[{"id": "usb-a", "name": "USB-A", "desc": "Breiter, flacher, rechteckiger Stecker; nur in einer Richtung einsteckbar.", "img": "assets/usb_a_cable_1786198032413.webp", "category": "daten"}, {"id": "usb-c", "name": "USB-C", "desc": "Kleiner ovaler, symmetrischer Stecker; beidseitig einsteckbar.", "img": "assets/usb_c_cable_1786198043571.webp", "category": "daten"}, {"id": "hdmi", "name": "HDMI", "desc": "Flacher, trapezähnlicher Stecker mit abgeschrägten unteren Ecken.", "img": "assets/hdmi_cable_1786198053921.webp", "category": "video_audio"}, {"id": "dp", "name": "DisplayPort", "desc": "Fast rechteckig; meist ist eine Ecke abgeschrägt, teilweise mit Rastmechanismus.", "img": "assets/dp_cable_1786198067133.webp", "category": "video_audio"}, {"id": "rj45", "name": "LAN (RJ45)", "desc": "Breiter Kunststoffstecker mit acht Kontakten und einem gut sichtbaren Rastclip.", "img": "assets/lan_cable_1786198076546.webp", "category": "netz_strom"}, {"id": "audio", "name": "Audio (3,5 mm)", "desc": "Schmaler runder Metallstecker mit mehreren dunklen Isolierringen.", "img": "assets/audio_cable_1786198086224.webp", "category": "video_audio"}, {"id": "vga", "name": "VGA", "desc": "Breiter D-förmiger Stecker mit 15 Pins in drei Reihen und zwei Schrauben.", "img": "assets/vga_cable_1786198097423.webp", "category": "video_audio"}, {"id": "dvi", "name": "DVI", "desc": "Breiter rechteckiger Stecker mit dichtem Pin-Raster und zwei seitlichen Schrauben.", "img": "assets/dvi_cable_1786198107586.webp", "category": "video_audio"}, {"id": "bt-dongle", "name": "Bluetooth-Dongle", "desc": "Sehr kleiner USB-Stecker mit kurzem, kompaktem Gehäuse.", "img": "assets/bluetooth_dongle_1786198654619.webp", "category": "daten"}, {"id": "power", "name": "Stromkabel (C13)", "desc": "Kräftiger Stecker mit dreipoliger, annähernd rechteckiger Buchsenform.", "img": "assets/power_cable_1786198664189.webp", "category": "netz_strom"}, {"id": "usb-b", "name": "USB-B (Drucker)", "desc": "Nahezu quadratischer Stecker mit zwei abgeschrägten oberen Ecken.", "img": "assets/usb_b_cable_1786198671715.webp", "category": "daten"}, {"id": "micro-usb", "name": "Micro-USB", "desc": "Sehr kleiner, flacher und asymmetrischer Stecker.", "img": "assets/img_micro_usb_1786222089308.jpg", "category": "daten"}, {"id": "lightning", "name": "Apple Lightning", "desc": "Sehr schmaler, flacher, symmetrischer Metallstecker mit sichtbaren Kontakten.", "img": "assets/img_lightning_1786222112950.jpg", "category": "daten"}, {"id": "sd-card", "name": "SD-Karte", "desc": "Flache rechteckige Karte mit einer abgeschrägten Ecke und Kontaktflächen auf der Rückseite.", "img": "assets/sd_card_item.jpg", "category": "daten"}, {"id": "wlan-antenne", "name": "WLAN-Antenne", "desc": "Schmale stabförmige Antenne mit Schraubanschluss am Fuß.", "img": "assets/wlan_antenna_item.jpg", "category": "netz_strom"}, {"id": "usb-hub", "name": "USB-Hub", "desc": "Kleines Gehäuse mit mehreren gleichartigen USB-Buchsen an einer Seite.", "img": "assets/usb_hub_item.jpg", "category": "daten"}];
let currentPercentage=0, saveTimer=null, currentCardIndex=0;

function renderCards(){
  const grid=document.getElementById('connectorGrid');
  const introCard=`<article class="connector-card card overflow-hidden" data-index="0">
    <div class="p-5 sm:p-8">
      <div class="flex flex-col sm:flex-row sm:items-start gap-5">
        <div class="w-14 h-14 rounded-2xl bg-onedrive-500 text-white flex items-center justify-center text-2xl shadow-lg shrink-0">
          <i class="fa-solid fa-plug"></i>
        </div>
        <div class="flex-1">
          <div class="text-xs font-bold uppercase tracking-wider text-onedrive-600">IT-Hardware · A5</div>
          <h1 class="text-2xl sm:text-3xl font-black mt-1">Schnittstellen & PC-Kabel</h1>
          <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">Die gleichen <strong>16 Anschlüsse und Geräte wie in A4</strong> – jetzt beschreibst du ihren typischen Einsatz in eigenen Worten.</p>
        </div>
      </div>
      <div class="mt-6 rounded-xl bg-blue-50 dark:bg-blue-950/30 border border-blue-100 dark:border-blue-900/60 p-4 flex items-start gap-3">
        <div class="w-9 h-9 rounded-lg bg-white dark:bg-slate-900 text-blue-600 flex items-center justify-center shrink-0"><i class="fa-solid fa-circle-info"></i></div>
        <div>
          <h2 class="font-bold">Auftrag</h2>
          <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">Bearbeite die 16 Karten nacheinander. Beschreibe jeweils kurz und in eigenen Worten, <strong>wofür der Anschluss oder das Gerät verwendet wird</strong>.</p>
        </div>
      </div>
      <div class="grid grid-cols-3 gap-2 mt-6 text-xs">
        <div class="rounded-xl bg-slate-50 dark:bg-slate-800 p-3"><span class="block text-[9px] uppercase text-slate-400 font-bold">Vorname</span><span id="metaName">–</span></div>
        <div class="rounded-xl bg-slate-50 dark:bg-slate-800 p-3"><span class="block text-[9px] uppercase text-slate-400 font-bold">Klasse</span><span id="metaClass">B24</span></div>
        <div class="rounded-xl bg-slate-50 dark:bg-slate-800 p-3"><span class="block text-[9px] uppercase text-slate-400 font-bold">Datum</span><span id="metaDate">–</span></div>
      </div>
      <div class="hidden">
        <input id="studentName" type="text" readonly><input id="studentClass" type="text" readonly value="B24"><input id="studentDate" type="text" readonly>
      </div>
    </div>
  </article>`;
  const connectorCards=CONNECTORS.map((c,i)=>`<article class="connector-card card overflow-hidden hidden" data-index="${i+1}">
    <div class="h-64 sm:h-80 bg-slate-50 dark:bg-slate-800 flex items-center justify-center p-4">
      <img src="${c.img}" alt="${c.name}" class="max-h-full max-w-full object-contain" loading="lazy">
    </div>
    <div class="p-4 sm:p-6">
      <div class="text-[10px] font-bold uppercase tracking-wider text-onedrive-600">${i+1} / ${CONNECTORS.length}</div>
      <h2 class="font-black text-xl mt-0.5">${c.name}</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${c.desc}</p>
      <label class="block text-sm font-bold mt-5 mb-1.5" for="use_${c.id}">Wofür wird es verwendet?</label>
      <textarea id="use_${c.id}" class="field text-sm" rows="4" placeholder="Typische Geräte oder Einsatz beschreiben …"></textarea>
    </div>
  </article>`).join('');
  grid.innerHTML=introCard+connectorCards;
  showCard(0);
}

function showCard(index){
  currentCardIndex=Math.max(0,Math.min(CONNECTORS.length,index));
  document.querySelectorAll('.connector-card').forEach((card,i)=>card.classList.toggle('hidden',i!==currentCardIndex));
  const isIntro=currentCardIndex===0;
  document.getElementById('cardCounter').textContent=isIntro?'Info':currentCardIndex+' / '+CONNECTORS.length;
  document.getElementById('cardCounterLabel').textContent=isIntro?'Information':'Anschluss';
  document.getElementById('prevCardBtn').disabled=isIntro;
  document.getElementById('nextCardBtn').disabled=currentCardIndex===CONNECTORS.length;
}

function changeCard(step){
  showCard(currentCardIndex+step);
  document.getElementById('connectorGrid').scrollIntoView({behavior:'smooth',block:'start'});
}

function fieldIds(){
  return CONNECTORS.map(c=>'use_'+c.id);
}
function collect(){
  const answers={}; fieldIds().forEach(id=>answers[id]=document.getElementById(id)?.value||'');
  return {version:4,answers,percent:currentPercentage,updatedAt:new Date().toISOString()};
}
function load(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY); if(!raw)return;
    const d=JSON.parse(raw); const answers=d.answers||d.form||{};
    Object.entries(answers).forEach(([id,v])=>{const el=document.getElementById(id);if(el&&v!=null)el.value=v;});
  }catch(e){console.warn('A5 Speicherstand konnte nicht geladen werden',e);}
}
function updateProgress(){
  const ids=fieldIds(), done=ids.filter(id=>(document.getElementById(id)?.value||'').trim()).length;
  currentPercentage=Math.round(done/ids.length*100);
  document.getElementById('headerPercentText').textContent=currentPercentage+'% erledigt';
  document.getElementById('progressBar').style.width=currentPercentage+'%';
  const b=document.getElementById('pdfBtn');
  if(currentPercentage===100){b.className='btn bg-emerald-600 hover:bg-emerald-700 text-white';b.title='PDF herunterladen';}
  else{b.className='btn bg-slate-200 dark:bg-slate-800 text-slate-400 opacity-60';b.title='Erst bei 100%';}
}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>localStorage.setItem(STORAGE_KEY,JSON.stringify(collect())),120);}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('translate-y-8','opacity-0');clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.classList.add('translate-y-8','opacity-0'),2200);}
function resetA5(){
  if(!confirm('Alle Eingaben von A5 zurücksetzen?'))return;
  localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(LEGACY_AUTOSAVE_KEY);
  fieldIds().forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  updateProgress(); scheduleSave(); showToast('A5 wurde zurückgesetzt.');
}
function downloadPdf(){
  if(currentPercentage<100){showToast('PDF erst bei 100%');return;}
  if(typeof downloadTextWorksheetPDF!=='function'){showToast('PDF-Modul nicht geladen');return;}
  const sections=CONNECTORS.map((c,i)=>({heading:`${i+1}. ${c.name}`,fields:[
    {label:'Verwendung',value:document.getElementById('use_'+c.id).value}
  ]}));
  downloadTextWorksheetPDF({title:'A5 · Schnittstellen & PC-Kabel',filenamePrefix:'A5_Schnittstellen_PC-Kabel',sections});
}
function syncMeta(){
  [['studentName','metaName'],['studentClass','metaClass'],['studentDate','metaDate']].forEach(([a,b])=>{const s=document.getElementById(a),d=document.getElementById(b);if(s&&d)d.textContent=s.value||'–';});
}
document.addEventListener('DOMContentLoaded',()=>{
  renderCards();
  if(typeof applyDefaultClassAndDate==='function')applyDefaultClassAndDate();
  load();
  fieldIds().forEach(id=>{const e=document.getElementById(id);e.addEventListener('input',()=>{updateProgress();scheduleSave();});});
  updateProgress(); syncMeta();
  setTimeout(()=>{syncMeta();updateProgress();scheduleSave();},400);
});
</script>
</body></html>
