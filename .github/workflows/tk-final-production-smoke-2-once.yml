name: Final TK A1-A7 Production Smoke 2
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/tk-final-production-smoke-2-once.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: https://ib2026.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for fixed production A7
        run: |
          for i in $(seq 1 36); do
            html="$(curl -fsSL --max-time 15 https://ib2026.vercel.app/tk2/A7.html || true)"
            if [ -n "$html" ] && ! printf '%s' "$html" | grep -Fq 'textContent=state.best'; then
              echo "Production A7 fix is live."
              exit 0
            fi
            echo "Waiting for Vercel production deploy ($i/36)..."
            sleep 10
          done
          echo "Production did not update in time."
          exit 1
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Run TK A1-A7 production smoke
        run: npx playwright test e2e/tk-a1-a7.spec.js --browser=chromium --workers=1 --reporter=line,html
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tk-final-smoke-2-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
