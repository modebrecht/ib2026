name: A4 WebP migration

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  migrate:
    if: contains(github.event.head_commit.message, '[a4-webp-migrate]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Update A4 image reference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('hw/A4.html')
          s = p.read_text(encoding='utf-8')
          old = "assets/scenario_micro_usb_powerbank.jpg"
          new = "assets/hq-micro-usb-powerbank.webp"
          if old not in s:
              raise SystemExit('Old A4 image reference not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git rm -f hw/assets/scenario_micro_usb_powerbank.jpg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hw/A4.html
          git commit -m 'Use HQ WebP Micro-USB scenario'
          git push origin HEAD:dev
