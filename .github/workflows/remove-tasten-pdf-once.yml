name: Remove embedded PDF from tasten

on:
  push:
    paths:
      - '.github/workflows/remove-tasten-pdf-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Remove embedded PDF
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('tk2/tasten.html')
          text = path.read_text(encoding='utf-8')
          before = len(text)

          pattern = r'<a class="btn secondary" href="data:application/pdf;base64,[^"]*"[^>]*>.*?</a>'
          text, count = re.subn(pattern, '', text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one embedded PDF link, removed {count}')

          text = re.sub(r'^\s*"downloadPdf":\s*"[^"]*",\n', '', text, flags=re.MULTILINE)

          if 'data:application/pdf;base64' in text:
              raise SystemExit('Embedded PDF data still present')

          path.write_text(text, encoding='utf-8')
          after = len(text)
          print(f'Removed {before - after:,} characters; {before:,} -> {after:,}')

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/tasten.html
          git commit -m "tk2: remove embedded PDF from tasten"
          git push origin HEAD:dev
