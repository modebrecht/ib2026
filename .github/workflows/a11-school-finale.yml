name: One-shot A11 School Finale
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/a11-school-finale.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Patch A11 finale
        run: python .github/scripts/a11_school_finale.py
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hw/A11.html
          git diff --cached --quiet && exit 0
          git commit -m "ui: replace A11 CAD finale with school notebook tradeoff"
          git push origin dev
