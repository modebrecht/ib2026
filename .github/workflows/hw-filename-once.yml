name: HW PDF naming convention once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/hw-filename-once.yml'

permissions:
  contents: write

jobs:
  rename-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Update HW PDF naming copy
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          replacements = {
            '<div><strong>1 P</strong> = Abgabe / Nachweis im OneDrive-Ordner <strong>IB</strong></div>': '<div><strong>1 P</strong> = PDF im OneDrive-Ordner <strong>IB</strong> · Dateiname immer <strong>A1.PDF, A2.PDF, …</strong></div>',
            '<span>Lege die <strong>Datei oder den Nachweis im OneDrive-Ordner „IB“</strong> ab. Erstelle den Ordner falls nötig und teile ihn <strong>einmal</strong> mit deiner Informatiklehrperson.</span>': '<span>Lege deine PDF im OneDrive-Ordner <strong>„IB“</strong> ab. Benenne sie immer nach der Aufgabe: <strong>A1.PDF, A2.PDF, … A14.PDF</strong>. Erstelle den Ordner falls nötig und teile ihn <strong>einmal</strong> mit deiner Informatiklehrperson.</span>',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:60]}')
              text = text.replace(old, new)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Clarify HW PDF naming convention"
          git push origin dev
