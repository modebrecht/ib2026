name: Premium A5 Windows scenes
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/premium-a5-windows-scenes-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch
        run: python .github/scripts/premium_a5_windows_scenes.py
      - name: Verify
        run: |
          node --check tk2/a4Scenes.js
          python - <<'PY'
          from pathlib import Path
          s=Path('tk2/a4Scenes.js').read_text(encoding='utf-8')
          checks=[
            "sceneLoopMs=cfg.family==='windows'?5600:LOOP_MS",
            "translate(0 118) scale(.72)",
            "Task-Manager geöffnet",
            "Verlauf geöffnet",
            "mode==='snapLeft'||mode==='snapRight'",
            "later(5200,function(){running=false;if(active&&autoLoop)run();});"
          ]
          for c in checks: assert c in s,c
          print('A5 premium motion checks OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/a4Scenes.js
          git commit -m "tk2: make A5 Windows animations more readable"
          git push origin dev
