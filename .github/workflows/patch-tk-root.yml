name: One-time root TK cleanup

on:
  push:
    paths:
      - '.github/workflows/patch-tk-root.yml'

permissions:
  contents: write

jobs:
  patch-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Simplify Tastenkombinationen root navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          new_tk_block = '''        <!-- Tile 1: Tastenkombinationen -->
        <div class="kachel open" id="tkKachel">
          <div class="kachel-header" onclick="toggleKachel(this)">
            <div class="kachel-title-wrap">
              <div class="kachel-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01"/><path d="M10 8h.01"/><path d="M14 8h.01"/><path d="M18 8h.01"/><path d="M8 12h.01"/><path d="M12 12h.01"/><path d="M16 12h.01"/><path d="M7 16h10"/></svg>
              </div>
              <div>
                <h3 class="kachel-title">Tastenkombinationen</h3>
                <p class="kachel-subtitle">Animierter Lernkurs A1–A5 &amp; Praxis</p>
              </div>
            </div>
            <div class="toggle-arrow">▼</div>
          </div>

          <div class="kachel-body">
            <div class="unterkacheln">
              <div class="unterkachel">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px;">
                  <div>
                    <h4 class="unterkachel-title" id="title-TK-Overview" style="margin-bottom: 2px;">
                      Kurs-Übersicht
                    </h4>
                    <p style="font-size: calc(13px * var(--font-scale)); color: var(--muted); margin: 0;">
                      Animierter Kurs mit XP, Fortschritt, Wiederholung &amp; PDF
                    </p>
                  </div>
                  <a href="tk2/index.html" target="_blank" rel="noopener" class="btn-link" title="In neuem Tab öffnen" aria-label="In neuem Tab öffnen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>
                </div>
              </div>
            </div>
          </div>
        </div>

'''

          block_pattern = re.compile(r'        <!-- Tile 1: Tastenkombinationen -->.*?(?=        <!-- Tile 2: Berufsorientierung -->)', re.S)
          text, count = block_pattern.subn(new_tk_block, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one TK block, found {count}')

          new_status = '''          let tkCourseDone = false;

          const tkQuestData = localStorage.getItem('tk_quest_scores_v1');
          const tkA4Data = localStorage.getItem('tk_a4_progress_v1');
          const tkA5Data = localStorage.getItem('tk_a5_progress_v1');

          if (tkQuestData && tkA4Data && tkA5Data) {
            const q = JSON.parse(tkQuestData);
            const a4Sets = JSON.parse(tkA4Data);
            const a5Sets = JSON.parse(tkA5Data);
            function attempts(entry) {
              if (!entry) return 0;
              if (typeof entry.attempts === 'number') return entry.attempts;
              return typeof entry.first === 'number' ? 1 : 0;
            }
            const tkA1Done = (q.q3 || 0) >= 70;
            const tkA2Done = (q.q6 || 0) >= 70;
            const tkA3Done = q.q7 === 100;
            const tkA4Done = ['A','B'].every(function (key) {
              return attempts(a4Sets[key]) >= 2;
            });
            const tkA5Done = ['A','B','C','D'].every(function (key) {
              return a5Sets[key] && typeof a5Sets[key].first === 'number';
            });
            tkCourseDone = tkA1Done && tkA2Done && tkA3Done && tkA4Done && tkA5Done;
          }

          if (tkCourseDone) {
            markDone('title-TK-Overview');
          }
'''

          status_pattern = re.compile(r"          let tkA1Done = false;.*?          if \(tkA1Done && tkA2Done && tkA3Done && tkA4Done && tkA5Done\) \{\n            markDone\('title-TK-Overview'\);\n          \}\n", re.S)
          text, count = status_pattern.subn(new_status, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one TK status block, found {count}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit root cleanup
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No root changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify root TK navigation"
          git push
