name: Apply A8 Tiered Gear V2

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/apply-a8-tiered-gear-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Refresh canonical gear overlay
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/modebrecht/shortcut-quest/dafdb0069fc79603d71dffb196c7fd54b44592f7/2026/gear-visuals.js \
            -o tk2/A8/gear-visuals.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tk2/a8-pdf-report.js')
          text = path.read_text(encoding='utf-8')
          old = "gear-visuals.js?v=2340e9cf"
          new = "gear-visuals.js?v=dafdb006"
          if old not in text and new not in text:
              raise SystemExit('gear loader cache marker missing')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          node --check tk2/A8/gear-visuals.js
          node --check tk2/a8-pdf-report.js
          grep -Fq 'version: 2' tk2/A8/gear-visuals.js
          grep -Fq 'gear-visuals.js?v=dafdb006' tk2/a8-pdf-report.js

      - name: Commit DEV overlay refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/A8/gear-visuals.js tk2/a8-pdf-report.js
          git commit -m "feat: show full tiered A8 knight loadout"
          git push origin HEAD:dev
