name: Refine TK2 Fleissnote card
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/refine-tk2-fleissnote-card-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch
        run: python .github/scripts/refine_tk2_fleissnote_card.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('tk2/index.html').read_text(encoding='utf-8')
          assert 'Dranbleiben lohnt sich' in s
          assert 'Du darfst so oft üben, wie du möchtest. Für die Fleissnote zählt dein bester erreichter Stand.' in s
          assert 'Weiterüben bis 100 % = bis +1 Punkt' in s
          assert 'Bester Stand zählt' in s
          assert 'Zielwert = bis +1 Punkt' not in s
          assert "count+' / 7'" in s
          print('Fleissnote wording checks OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/index.html
          git commit -m "tk2: reward best Fleissnote progress"
          git push origin dev
