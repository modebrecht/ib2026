name: Clarify second pass PDF
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/clarify-second-pass-pdf-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply wording update
        run: python .github/scripts/clarify_second_pass_pdf.py
      - name: Verify A4/A5 wording
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('A4.html','A5.html'):
              s=(Path('tk2')/name).read_text(encoding='utf-8')
              assert 'Noch ein Durchgang bis zur PDF ↻' in s
              assert 'Danach wird deine Auswertungs-PDF freigeschaltet.' in s
              assert '2. Durchgang starten → PDF freischalten' in s
          print('OK: A4/A5 clearly state second pass unlocks PDF')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/A4.html tk2/A5.html
          git commit -m "tk2: clarify second pass unlocks PDF"
          git push origin dev
