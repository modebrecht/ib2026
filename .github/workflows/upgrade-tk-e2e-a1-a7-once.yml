name: Upgrade TK E2E A1-A7
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/upgrade-tk-e2e-a1-a7-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Upgrade E2E
        run: python .github/scripts/upgrade_tk_e2e_a1_a7.py
      - name: Verify
        run: |
          test -f e2e/tk-a1-a7.spec.js
          test ! -f e2e/tk-a1-a6.spec.js
          grep -q 'A1-A7' .github/workflows/e2e-smoke-tk.yml
          grep -q 'tk-a1-a7.spec.js' .github/workflows/e2e-smoke-tk.yml
          node --check e2e/tk-a1-a7.spec.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/tk-a1-a6.spec.js e2e/tk-a1-a7.spec.js .github/workflows/e2e-smoke-tk.yml
          git commit -m "test: extend TK production smoke to A1-A7"
          git push origin dev
