name: Temp Glass HW Headers
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/temp-glass-hw-headers.yml']
permissions:
  contents: write
jobs:
  glass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Increase header glassmorphism A1-A9
        run: |
          python - <<'PY'
          from pathlib import Path
          changed=[]
          old='bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border-b border-slate-200/80 dark:border-slate-800'
          new='bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl border-b border-white/40 dark:border-slate-700/50'
          for i in range(1,10):
              p=Path(f'hw/A{i}.html')
              s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Expected header shell not found in {p}')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
              changed.append(str(p))
          print('changed:', changed)
          PY
      - name: Commit glass headers and remove temporary workflow
        run: |
          rm .github/workflows/temp-glass-hw-headers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hw/A1.html hw/A2.html hw/A3.html hw/A4.html hw/A5.html hw/A6.html hw/A7.html hw/A8.html hw/A9.html .github/workflows/temp-glass-hw-headers.yml
          git commit -m 'style(hw): increase header glassmorphism A1-A9'
          git push origin dev
