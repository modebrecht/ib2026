name: Clarify PDF after completion
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/clarify-pdf-after-completion-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply wording update
        run: python .github/scripts/clarify_pdf_after_completion.py
      - name: Verify wording
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('A4.html','A5.html'):
              s=(Path('tk2')/name).read_text(encoding='utf-8')
              assert 'Nach dem Abschliessen wird deine Auswertungs-PDF freigeschaltet.' in s
              assert '>2. Durchgang starten</button>' in s
              assert '2. Durchgang starten → PDF freischalten' not in s
          print('OK: PDF unlock wording refers to completion, not start')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/A4.html tk2/A5.html
          git commit -m "tk2: clarify PDF unlock after second pass"
          git push origin dev
