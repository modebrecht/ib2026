name: Add tasten favorite share

on:
  push:
    paths:
      - '.github/workflows/add-tasten-favorite-share-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply favorite share
        run: python .github/scripts/add_tasten_favorite_share.py
      - name: Check JavaScript
        run: |
          python -c "from pathlib import Path; import re; t=Path('tk2/tasten.html').read_text(encoding='utf-8'); Path('/tmp/tasten.js').write_text(re.search(r'<script>(.*)</script>', t, re.S).group(1), encoding='utf-8')"
          node --check /tmp/tasten.js
      - name: Verify share code
        run: |
          grep -F "const SHARE_CODES={copy:'A'" tk2/tasten.html
          grep -F "degree:'r'" tk2/tasten.html
          grep -F 'id="favoriteQr"' tk2/tasten.html
          grep -F 'function readSharedFavoritesFromHash()' tk2/tasten.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/tasten.html
          git commit -m "tk2: share favorites with compact letter QR links"
          git push origin dev
