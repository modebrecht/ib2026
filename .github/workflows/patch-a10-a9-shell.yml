name: One-shot A10 A9 Shell

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/patch-a10-a9-shell.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Align A10 shared shell with A9
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('hw/A10.html')
          text = path.read_text(encoding='utf-8')

          old = '<link rel="stylesheet" href="assets/css/fontawesome.min.css">\n<style>'
          new = '<link rel="stylesheet" href="assets/css/fontawesome.min.css">\n<link rel="stylesheet" href="assets/css/worksheet-common.css">\n<style>'
          if old not in text:
              raise SystemExit('A10 stylesheet insertion point not found')
          text = text.replace(old, new, 1)

          old = '.progress{background:linear-gradient(90deg,#0078d4,#7c3aed,#10b981);background-size:200% 100%;animation:flow 4s linear infinite}'
          new = '.progress,.progress-glow{background:linear-gradient(90deg,#0078d4,#7c3aed,#10b981);background-size:200% 100%;animation:flow 4s linear infinite}'
          if old not in text:
              raise SystemExit('A10 progress style not found')
          text = text.replace(old, new, 1)

          old_header = '''<header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/92 backdrop-blur border-b border-slate-200 dark:border-slate-800">
<div class="max-w-6xl mx-auto p-3 flex justify-between items-center gap-3"><div><div class="text-[10px] uppercase font-black tracking-wider text-slate-400">A10 · Speicher</div><div id="pct" class="font-black text-onedrive-600 dark:text-blue-400">0% bearbeitet</div></div><div class="flex gap-2"><button class="w-10 h-10 rounded-xl border" onclick="toggleDarkMode()" title="Dunkelmodus"><i id="themeIcon" class="fa-solid fa-moon"></i></button><button id="pdf" class="w-10 h-10 rounded-xl bg-slate-200 text-slate-400" onclick="makePdf()" title="PDF bei vollständiger Bearbeitung"><i class="fa-solid fa-file-pdf"></i></button><button class="w-10 h-10 rounded-xl border border-rose-300 text-rose-600" onclick="resetA10()" title="Zurücksetzen"><i class="fa-solid fa-rotate-right"></i></button></div></div>
<div class="h-1 bg-slate-200 dark:bg-slate-800"><div id="bar" class="h-1 progress" style="width:0"></div></div>
</header>'''
          new_header = '''<header class="sticky top-0 z-40 worksheet-header">
<div class="max-w-5xl mx-auto p-3 flex items-center justify-between gap-3"><div class="min-w-0"><div class="text-[10px] uppercase font-black tracking-[.16em] text-slate-400">A10 · Speicher</div><div class="flex items-center gap-2 mt-.5"><div id="pct" class="font-black text-onedrive-600 dark:text-blue-400">0% bearbeitet</div><span class="hidden sm:inline text-slate-300 dark:text-slate-700">•</span><div class="hidden sm:block text-xs font-bold text-slate-400">22 Aufgaben</div></div></div><div class="flex gap-2 shrink-0"><button class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/70 dark:bg-slate-900" onclick="toggleDarkMode()" title="Dunkelmodus"><i id="themeIcon" class="fa-solid fa-moon"></i></button><button id="pdf" class="w-10 h-10 rounded-xl bg-slate-200 text-slate-400 dark:bg-slate-800 dark:text-slate-600" onclick="makePdf()" title="PDF nach Abschluss"><i class="fa-solid fa-lock"></i></button><button class="w-10 h-10 rounded-xl border border-rose-200 dark:border-rose-900/60 bg-white/70 dark:bg-slate-900 text-rose-600" onclick="resetA10()" title="Zurücksetzen"><i class="fa-solid fa-rotate-right"></i></button></div></div>
<div class="h-1 bg-slate-200 dark:bg-slate-800 overflow-hidden"><div id="bar" class="h-1 progress-glow" style="width:0"></div></div>
</header>'''
          if text.count(old_header) != 1:
              raise SystemExit(f'Expected one A10 old header, found {text.count(old_header)}')
          text = text.replace(old_header, new_header, 1)

          old_main = '<main class="max-w-6xl mx-auto p-4 sm:p-6 space-y-4">'
          new_main = '<main class="max-w-5xl mx-auto p-4 sm:p-6 lg:p-8 space-y-5">'
          if text.count(old_main) != 1:
              raise SystemExit('A10 main wrapper not found')
          text = text.replace(old_main, new_main, 1)

          old_progress = "function progress(){const [a,at]=basicsScore(),[b,bt]=typeScore(),[c,ct]=mythScore(),[d,dt]=caseScore();const explain=$('m2_explain').value.trim().length>=12?1:0,total=at+bt+ct+dt+1,n=a+b+c+d+explain,p=Math.round(n/total*100);$('pct').textContent=p+'% bearbeitet';$('bar').style.width=p+'%';$('pdf').className=p===100?'w-10 h-10 rounded-xl bg-emerald-600 text-white':'w-10 h-10 rounded-xl bg-slate-200 text-slate-400';return p}"
          new_progress = "function updatePdfButton(p){const b=$('pdf'),ok=p===100;b.className=ok?'w-10 h-10 rounded-xl bg-emerald-600 text-white shadow-lg shadow-emerald-500/20':'w-10 h-10 rounded-xl bg-slate-200 text-slate-400 dark:bg-slate-800 dark:text-slate-600';b.innerHTML=ok?'<i class=\"fa-solid fa-file-pdf\"></i>':'<i class=\"fa-solid fa-lock\"></i>';b.title=ok?'PDF frei':'PDF nach Abschluss'}\nfunction progress(){const [a,at]=basicsScore(),[b,bt]=typeScore(),[c,ct]=mythScore(),[d,dt]=caseScore();const explain=$('m2_explain').value.trim().length>=12?1:0,total=at+bt+ct+dt+1,n=a+b+c+d+explain,p=Math.round(n/total*100);$('pct').textContent=p+'% bearbeitet';$('bar').style.width=p+'%';updatePdfButton(p);return p}"
          if text.count(old_progress) != 1:
              raise SystemExit('A10 progress function not found')
          text = text.replace(old_progress, new_progress, 1)

          if text.count('assets/css/worksheet-common.css') != 1:
              raise SystemExit('Shared CSS include validation failed')
          if text.count('assets/js/worksheet-common.js') != 1:
              raise SystemExit('Shared JS include validation failed')
          if 'worksheet-header' not in text or '22 Aufgaben' not in text:
              raise SystemExit('A9-style header validation failed')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hw/A10.html
          git commit -m "ui: align A10 shell with A9"
          git push origin HEAD:dev
