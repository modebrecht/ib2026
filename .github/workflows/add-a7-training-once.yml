name: Add A7 training
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/add-a7-training-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply A7 training patch
        run: python .github/scripts/add_a7_training.py
      - name: Verify A7 structure and syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          a7=Path('tk2/A7.html').read_text(encoding='utf-8')
          idx=Path('tk2/index.html').read_text(encoding='utf-8')
          old=Path('tk2/tasten.html').read_text(encoding='utf-8')
          required=[
            'tk_a7_training_v1','tk_a7_progress_v1','recordAccuracyRun','recordMemoryRun',
            'downloadTrainingPdf','TRAINING_MIN_RUNS=2','TRAINING_TARGET=70',
            'data-view="evidence"','id="downloadEvidencePdf"','A7_Trainingsnachweis_',
            "recordAccuracyRun('challenge'", "recordAccuracyRun('hunt'", 'recordMemoryRun('
          ]
          for needle in required: assert needle in a7, needle
          assert 'A7.html'+'' in old and 'location.replace' in old
          assert 'module-a7' in idx and "count+' / 7'" in idx and '(count/7*100)' in idx
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',a7,re.S)
          main=max(scripts,key=len)
          Path('/tmp/a7-inline.js').write_text(main,encoding='utf-8')
          print('A7 structural checks OK')
          PY
          node --check /tmp/a7-inline.js
      - name: Verify PDF semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('tk2/A7.html').read_text(encoding='utf-8')
          assert "button.disabled=s.accuracyRuns<TRAINING_MIN_RUNS" in s
          assert "completed:s.accuracyRuns>=TRAINING_MIN_RUNS" in s
          assert "targetReached:s.attempts>0&&s.accuracy>=TRAINING_TARGET" in s
          assert 'Die PDF wird danach freigeschaltet – unabhängig davon, ob du die Zielgenauigkeit von 70 % bereits erreicht hast.' in s
          print('PDF unlock is based on completed rounds, not target accuracy')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/A7.html tk2/tasten.html tk2/index.html
          git commit -m "tk2: add A7 training stats and PDF evidence"
          git push origin dev
