name: Format HW Fleissnote once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/format-hw-fleissnote-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Format Fleissnote info box
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          old = '''              <div style="padding: 14px; background: var(--blue-soft); border: 1px solid rgba(37,99,235,.22); border-radius: 10px; color: var(--text); font-size: calc(13px * var(--font-scale)); line-height: 1.45;">
                <div style="font-weight: 800; color: var(--blue); margin-bottom: 8px;">So funktioniert die Fleissnote</div>
                <div><strong>1 Punkt</strong> = PDF im OneDrive-Ordner <strong>IB</strong></div>
                <div>Bei <strong>100 % Genauigkeit</strong> gibt es einen vollen Zusatzpunkt. Sonst wird der Zusatzpunkt anteilig berechnet.</div>
                <div>Verbessern erlaubt – <strong>nur das beste Resultat zählt.</strong></div>
                <div style="margin-top: 6px; color: var(--muted);"><div>Maximal 2 Punkte pro Aufgabe</div><div>A1–A14 = maximal 28 Punkte</div></div>
              </div>'''

          new = '''              <div style="padding: 14px; background: var(--blue-soft); border: 1px solid rgba(37,99,235,.22); border-radius: 10px; color: var(--text); font-size: calc(13px * var(--font-scale)); line-height: 1.45;">
                <div style="font-weight: 800; color: var(--blue); margin-bottom: 8px;">So funktioniert die Fleissnote</div>
                <ul style="margin: 0; padding-left: 20px; display: grid; gap: 5px;">
                  <li><strong>1 Punkt</strong> = PDF im OneDrive-Ordner <strong>IB</strong></li>
                  <li><strong>100 % Genauigkeit</strong> = voller Zusatzpunkt; sonst anteilig</li>
                  <li>Verbessern erlaubt – <strong>nur das beste Resultat zählt</strong></li>
                </ul>
                <div style="margin-top: 10px; padding-top: 9px; border-top: 1px solid rgba(37,99,235,.18); color: var(--muted); display: grid; gap: 2px;">
                  <div><strong style="color: var(--text);">Maximal 2 Punkte</strong> pro Aufgabe</div>
                  <div>A1–A14 = <strong style="color: var(--text);">maximal 28 Punkte</strong></div>
                </div>
              </div>'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one Fleissnote block, found {count}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Format HW Fleissnote info box"
          git push origin dev
