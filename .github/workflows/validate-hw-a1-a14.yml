name: Validate HW A1-A14 once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/validate-hw-a1-a14.yml'

permissions:
  contents: read

jobs:
  smoke:
    name: Chromium smoke A1-A14
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Serve dev checkout
        run: |
          python3 -m http.server 8000 >/tmp/ib2026-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/ib2026-http.log
          exit 1
      - name: Run A1-A14 dev smoke
        run: npx playwright test e2e/hw-a1-a14.spec.js --browser=chromium --workers=1 --reporter=line,html
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validate-hw-a1-a14-dev-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
