name: Fix tasten share Vercel
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fix-tasten-share-vercel-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply Vercel share URL
        run: python .github/scripts/fix_tasten_share_vercel.py
      - name: Check JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('tk2/tasten.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/tasten.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/tasten.js
      - name: Verify Vercel share URL
        run: grep -q 'https://ib2026.vercel.app/tk2/tasten.html#f=' tk2/tasten.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/tasten.html
          git commit -m "tk2: share favorites via Vercel production"
          git push origin dev
