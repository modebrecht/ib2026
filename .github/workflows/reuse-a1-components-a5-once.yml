name: Reuse A1 components in A5
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/reuse-a1-components-a5-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply A5 reuse
        run: python .github/scripts/reuse_a1_components_a5.py
      - name: Check JavaScript
        run: |
          node --check tk2/sceneKeycaps.js
          node --check tk2/a4Scenes.js
          node --check tk2/a5-app.js
      - name: Verify reuse
        run: |
          python - <<'PY'
          from pathlib import Path
          a5=Path('tk2/A5.html').read_text(encoding='utf-8')
          a4s=Path('tk2/a4Scenes.js').read_text(encoding='utf-8')
          shared=Path('tk/shared.css').read_text(encoding='utf-8')
          assert 'sceneKeycaps.js' in a5
          assert '<script src="sceneKeycaps.js"></script>\n<script src="a4Scenes.js"></script>' in a5
          assert 'class="theory-finish"' in a5
          assert '.theory-action{' not in a5
          assert 'window.tk2SceneKeycaps.down' in a4s
          assert '.theory-finish {' in shared
          print('OK A5 reuses A1 keycap mechanics and shared finish component')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/A5.html
          git commit -m "tk2: reuse A1 components in A5"
          git push origin dev
