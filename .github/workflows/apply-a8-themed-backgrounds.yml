name: Apply A8 Themed Backgrounds

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/apply-a8-themed-backgrounds.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Refresh battle continuity loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tk2/a8-pdf-report.js')
          text = path.read_text(encoding='utf-8')
          old = 'battle-continuity.js?v=14d5f2bb'
          new = 'battle-continuity.js?v=95a3b280'
          if old not in text:
              raise SystemExit('battle continuity loader marker missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check tk2/a8-pdf-report.js
          grep -Fq 'battle-continuity.js?v=95a3b280' tk2/a8-pdf-report.js

      - name: Commit loader refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/a8-pdf-report.js
          git commit -m "fix: refresh A8 themed battle background loader"
          git push origin HEAD:dev
