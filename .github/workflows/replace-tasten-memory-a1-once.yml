name: Replace tasten memory with A1 memory

on:
  push:
    paths:
      - '.github/workflows/replace-tasten-memory-a1-once.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply A1 memory transplant
        run: python .github/scripts/replace_tasten_memory_a1.py

      - name: Sanity checks
        run: |
          grep -q 'class="mem-card card-fly-in"' tk2/tasten.html
          grep -q 'MEMORY_DIFFS' tk2/tasten.html
          grep -q 'aspect-ratio:4/5' tk2/tasten.html
          grep -q 'crownSvg()' tk2/tasten.html

      - name: Commit transplant
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/tasten.html
          git diff --cached --quiet && exit 0
          git commit -m "tk2: transplant HW A1 memory into tasten"
          git push origin HEAD:dev
