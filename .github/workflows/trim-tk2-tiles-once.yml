name: Trim TK2 tiles
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/trim-tk2-tiles-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Trim tile copy
        run: python .github/scripts/trim_tk2_tiles.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('tk2/index.html').read_text(encoding='utf-8')
          sec=s.split('<section class="modules">',1)[1].split('</section>',1)[0]
          assert 'PDF' not in sec
          assert 'Immer offen' not in sec
          for t in ['14 wichtige Alltagskürzel','10 AltGr-Sonderzeichen','Merkblatt sichern und drei persönliche','Programme & Browser: neue Kürzel','Windows-Kürzel für schnelleres','Alle bisherigen Tastenkürzel gemischt','Challenge, Fehlerjagd und Memory zum freien Training.']:
              assert t in sec, t
          print('tile copy OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/index.html
          git commit -m "tk2: simplify module tile copy"
          git push origin dev
