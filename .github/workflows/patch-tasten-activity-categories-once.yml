name: Patch tasten activity categories

on:
  push:
    paths:
      - '.github/workflows/patch-tasten-activity-categories-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch_tasten_activity_categories.py
      - name: Check JavaScript
        run: |
          python -c "from pathlib import Path; import re; t=Path('tk2/tasten.html').read_text(encoding='utf-8'); Path('/tmp/tasten.js').write_text(re.search(r'<script>(.*)</script>', t, re.S).group(1), encoding='utf-8')"
          node --check /tmp/tasten.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/tasten.html
          git commit -m "tk2: add category filters to challenge and favorites activities"
          git push origin dev
