name: Replace tasten sidebar with A9 header

on:
  push:
    paths:
      - '.github/workflows/replace-tasten-sidebar-a9-header-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply header migration
        run: python .github/scripts/replace_tasten_sidebar_with_a9_header.py
      - name: Check JavaScript
        run: |
          python -c "from pathlib import Path; import re; t=Path('tk2/tasten.html').read_text(encoding='utf-8'); Path('/tmp/tasten.js').write_text(re.search(r'<script>(.*)</script>', t, re.S).group(1), encoding='utf-8')"
          node --check /tmp/tasten.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/tasten.html
          git commit -m "tk2: replace sidebar with A9-style top navigation"
          git push origin dev
