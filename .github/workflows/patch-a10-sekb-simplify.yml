name: One-shot A10 Sek B Simplify

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/patch-a10-sekb-simplify.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Simplify A10 for 9th grade Sek B
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('hw/A10.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'RAM, HDD &amp; die SSD-Familie': 'RAM, HDD &amp; SSD',
              'Nicht jede SSD sieht gleich aus – und <strong>M.2 bedeutet nicht automatisch NVMe</strong>. Du unterscheidest Speicherart, Bauform, Schnittstelle und Protokoll und wählst danach den passenden Speicher für konkrete Situationen.': 'Du lernst <strong>RAM, HDD und verschiedene SSDs</strong> kennen und entscheidest, welcher Speicher zu welchem Computer passt. Wichtig: <strong>M.2 bedeutet nicht automatisch NVMe</strong>.',
              'Abgedeckt werden die wichtigen PC-/Notebook- und Serverformen: 2,5″ SATA, mSATA, M.2 SATA, M.2 NVMe, PCIe-Steckkarte, U.2/U.3 sowie externe SSDs. Spezialformen wie SAS/EDSFF werden bewusst nicht vertieft.': 'Im Fokus stehen die Speicherformen, die dir bei normalen PCs und Notebooks häufig begegnen: 2,5″ SATA, M.2 SATA, M.2 NVMe und externe SSDs.',
              "const K='onedrive_a10_storage_8sek';": "const K='onedrive_a10_storage_9sek';",
              "options:[['hdd','HDD'],['m2nvme','M.2 NVMe SSD'],['msata','mSATA SSD']]": "options:[['hdd','HDD'],['m2nvme','M.2 NVMe SSD'],['sata25','2,5″ SATA SSD']]",
              "options:[['external','Externe SSD'],['ram','RAM'],['u2','U.2 Server-SSD']]": "options:[['external','Externe SSD'],['ram','RAM'],['hdd','HDD']]",
          }

          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)

          remove_ids = ['msata', 'aic', 'u2', 'm4', 'm5', 'c5']
          for item_id in remove_ids:
              pattern = re.compile(r"^\{id:'" + re.escape(item_id) + r"'.*?\},?\n", re.M)
              text, count = pattern.subn('', text, count=1)
              if count != 1:
                  raise SystemExit(f'Expected to remove exactly one item {item_id}, removed {count}')

          forbidden = [
              "id:'msata'", "id:'aic'", "id:'u2'", "id:'m4'", "id:'m5'", "id:'c5'",
              'mSATA SSD', 'PCIe Add-in-Card SSD', 'U.2 / U.3 NVMe SSD',
              '2242, 2260 und 2280', 'PCIe 4.0 und PCIe 5.0', 'Server mit Hot-Swap-Enterprise-Laufwerken'
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'Forbidden advanced A10 content still present: {token}')

          required = [
              "id:'sata25'", "id:'m2sata'", "id:'m2nvme'", "id:'external'",
              "id:'m1'", "id:'m2'", "id:'m3'", "id:'m6'",
              "id:'c1'", "id:'c2'", "id:'c3'", "id:'c4'",
              'M.2 bedeutet nicht automatisch NVMe'
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'Required A10 core content missing: {token}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit A10 simplification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hw/A10.html
          git commit -m "content: simplify A10 for Sek B"
          git push origin HEAD:dev
