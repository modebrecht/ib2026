name: Add TK2 Fleissnote submission
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/add-tk2-fleissnote-submission-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch
        run: python .github/scripts/add_tk2_fleissnote_submission.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('tk2/index.html').read_text(encoding='utf-8')
          assert 'Ordner <strong>IB</strong> in OneDrive' in s
          assert 'teile den Ordner mit deiner Informatiklehrperson' in s
          assert 'Bester Stand zählt' in s
          assert "count+' / 7'" in s
          print('Fleissnote submission checks OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/index.html
          git commit -m "tk2: clarify Fleissnote OneDrive submission"
          git push origin dev
