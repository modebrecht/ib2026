name: One-shot A13 Final Theme Audit
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/patch-a13-final-theme-check.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Repair patch script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/patch_a13_final_theme_check.py')
          s=p.read_text(encoding='utf-8')
          needle="sub:'Digitale Dienste sind grundsätzlich schlecht'}]}\n}\nfor a,b"
          repl="sub:'Digitale Dienste sind grundsätzlich schlecht'}]}\",\n}\nfor a,b"
          if needle in s:
              s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply final theme audit
        run: python .github/scripts/patch_a13_final_theme_check.py
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hw/A13.html
          git diff --cached --quiet && exit 0
          git commit -m "content: complete A13 Green IT theme coverage"
          git push origin dev