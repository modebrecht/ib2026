name: One-shot A13 Final Theme Audit
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/patch-a13-final-theme-check.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Apply final theme audit
        run: python .github/scripts/patch_a13_final_theme_check.py
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hw/A13.html
          git diff --cached --quiet && exit 0
          git commit -m "content: complete A13 Green IT theme coverage"
          git push origin dev