name: Quality A1 A4 A5 keycaps
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/quality-a1-a4-a5-keycaps-once.yml'
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply quality patch
        run: python .github/scripts/quality_a1_a4_a5_keycaps.py
      - name: JavaScript syntax
        run: |
          node --check tk2/sceneKeycaps.js
          node --check tk2/docTextScene.js
          node --check tk2/utilityScenes-base.js
          node --check tk2/utilityNavigationScenes.js
          node --check tk2/a4Scenes.js
          node --check tk2/a4-app.js
          node --check tk2/a5-app.js
      - name: Structural quality checks
        run: |
          python - <<'PY'
          from pathlib import Path
          shared=Path('tk2/sceneKeycaps.js').read_text(encoding='utf-8')
          doc=Path('tk2/docTextScene.js').read_text(encoding='utf-8')
          util=Path('tk2/utilityScenes-base.js').read_text(encoding='utf-8')
          nav=Path('tk2/utilityNavigationScenes.js').read_text(encoding='utf-8')
          scenes=Path('tk2/a4Scenes.js').read_text(encoding='utf-8')
          a1=Path('tk2/A1.html').read_text(encoding='utf-8')
          a4=Path('tk2/A4.html').read_text(encoding='utf-8')
          a5=Path('tk2/A5.html').read_text(encoding='utf-8')
          css=Path('tk/shared.css').read_text(encoding='utf-8')

          # Same actual renderer/mechanics, not copied approximations.
          assert 'markup:markup' in shared and 'rowWidth:rowWidth' in shared and 'pressSequence:pressSequence' in shared
          assert "window.tk2SceneKeycaps.markup(cfg.keys,'doc')" in doc
          assert "window.tk2SceneKeycaps.markup(cfg.keys,'utility')" in util
          assert "window.tk2SceneKeycaps.markup(['Ctrl',toTop?'Home':'End'],'utility')" in nav
          assert 'window.tk2SceneKeycaps.markup(cfg.keys,keyProfile)' in scenes
          assert 'window.tk2SceneKeycaps.pressSequence' in scenes
          assert '.a4-key' not in scenes
          assert '.resize-key' not in scenes
          assert 'function keyDown(' not in scenes
          assert 'function keyUp(' not in scenes
          assert 'function keyMarkup(' not in doc
          assert 'function keyMarkup(' not in util
          assert 'function keyMarkup(' not in nav
          assert 'function keyMarkup(' not in scenes

          # Loader order must make the shared component available before scene creation.
          for name,html,next_script in [('A1',a1,'docTextScene.js'),('A4',a4,'a4Scenes.js'),('A5',a5,'a4Scenes.js')]:
              assert 'sceneKeycaps.js' in html, name+' missing sceneKeycaps loader'
              assert html.index('sceneKeycaps.js') < html.index(next_script), name+' loads sceneKeycaps too late'

          # Exact shared green finish component, no local clone in A4/A5.
          assert '.theory-finish {' in css
          for name,html in [('A4',a4),('A5',a5)]:
              assert 'class="theory-finish"' in html, name+' missing shared finish box'
              assert '.theory-action{' not in html, name+' still owns old finish clone'
              assert '@media(max-width:520px){.lesson-keys kbd{font-size:.7rem;padding:4px 7px}}' in html

          # A1 and A4/A5 top key labels share the same desktop visual values.
          a1_key='background:#182235;border:1px solid rgba(125,211,252,.28);box-shadow:0 3px 0 #020617;color:#dbeafe;padding:5px 9px;border-radius:7px;font-family:\'Space Grotesk\',monospace;font-size:.78rem;font-weight:800;white-space:nowrap'
          assert a1_key in a1
          assert a1_key in a4
          assert a1_key in a5
          print('QUALITY OK: A1/A4/A5 share renderer, press mechanics, loader order, mobile key sizing and finish component')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/sceneKeycaps.js tk2/docTextScene.js tk2/utilityScenes-base.js tk2/utilityNavigationScenes.js tk2/a4Scenes.js tk2/A4.html tk2/A5.html
          git commit -m "tk2: fully reuse A1 keycaps in A4 and A5"
          git push origin dev
