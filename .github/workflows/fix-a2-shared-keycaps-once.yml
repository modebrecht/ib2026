name: Fix A2 shared keycaps
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fix-a2-shared-keycaps-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply A2 shared keycaps
        run: python .github/scripts/fix_a2_shared_keycaps.py
      - name: JavaScript syntax
        run: |
          node --check tk2/sceneKeycaps.js
          node --check tk2/altGrScene.js
          node --check tk2/a2-app.js
      - name: Verify exact reuse
        run: |
          python - <<'PY'
          from pathlib import Path
          a2=Path('tk2/A2.html').read_text(encoding='utf-8')
          alt=Path('tk2/altGrScene.js').read_text(encoding='utf-8')
          shared=Path('tk2/sceneKeycaps.js').read_text(encoding='utf-8')
          assert '<script src="sceneKeycaps.js"></script>' in a2
          assert a2.index('sceneKeycaps.js') < a2.index('altGrScene.js')
          assert 'var CHORD_HOLD_MS=800;' in shared
          assert "window.tk2SceneKeycaps.markup(['AltGr',cfg.key2],'utility')" in alt
          assert "window.tk2SceneKeycaps.pressSequence($$('.tk2-u-key'),later,trans,'utility');" in alt
          assert "window.tk2SceneKeycaps.resetMany($$('.tk2-u-key'));" in alt
          assert 'function keyDown(' not in alt
          assert 'function keyUp(' not in alt
          assert 'key-alt' not in alt and 'key-main' not in alt
          assert 'CHORD_HOLD_MS' not in alt
          print('OK: A2 directly shares sceneKeycaps renderer + pressSequence + 800ms hold')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/altGrScene.js
          git commit -m "tk2: make A2 use shared scene keycaps"
          git push origin dev
