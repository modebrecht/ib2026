name: Temp Fix A5 Smoke Selector
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/temp-fix-a5-smoke.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update stale A5 smoke assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('e2e/hw-a1-a9.spec.js')
          s = p.read_text(encoding='utf-8')
          old = "    await expect(page.getByRole('heading', { name: 'Auftrag' })).toBeVisible();"
          new = "    await expect(page.locator('#nextCardBtn')).toBeVisible();"
          if old not in s:
              raise SystemExit('Expected stale A5 assertion not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/temp-fix-a5-smoke.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/hw-a1-a9.spec.js .github/workflows/temp-fix-a5-smoke.yml
          git commit -m 'fix(e2e): update A5 smoke selector'
          git push origin dev
