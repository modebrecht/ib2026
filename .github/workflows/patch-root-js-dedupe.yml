name: One-shot Root JS Dedupe

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/patch-root-js-dedupe.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Dedupe root settings and restore OneDrive copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          start_marker = "  <script>\n    const gearBtn = document.getElementById('gearBtn');"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('Root utility script start not found')
          end = text.find('  </script>', start)
          if end < 0:
              raise SystemExit('Root utility script end not found')
          end += len('  </script>')
          segment = text[start:end]

          for old in (
              "    const themeToggle = document.getElementById('themeToggle');\n",
              "    const fontSizeRange = document.getElementById('fontSizeRange');\n",
              "    const fontSizeValue = document.getElementById('fontSizeValue');\n",
              "    fontSizeRange.addEventListener('input', () => setFontSize(fontSizeRange.value));\n\n",
          ):
              if segment.count(old) != 1:
                  raise SystemExit(f'Expected one match in root utility script: {old!r}')
              segment = segment.replace(old, '')

          segment, count = re.subn(r'\n    function setFontSize\(percent\) \{.*?\n    \}\n', '\n', segment, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one duplicate setFontSize function, found {count}')

          old_init = "    // Initialize\n    setFontSize(localStorage.getItem('ib-font-size') || 100);\n    restoreKachelStates();\n"
          if segment.count(old_init) != 1:
              raise SystemExit('Expected duplicate root font initialization block')
          segment = segment.replace(old_init, '    restoreKachelStates();\n')
          text = text[:start] + segment + text[end:]

          empty_abgabe = '                <div style="display: flex; flex-direction: column; gap: 8px; width: 100%; font-size: calc(13px * var(--font-scale));">\n                </div>'
          onedrive_abgabe = '''                <div style="display: flex; flex-direction: column; gap: 8px; width: 100%; font-size: calc(13px * var(--font-scale));">
                  <div style="display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 12px; background: var(--card-soft); border: 1px solid var(--line); border-radius: 8px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
                    <span>Lade die <strong>PDFs in deinen OneDrive-Ordner hoch</strong> und teile ihn mit deiner Informatiklehrperson</span>
                  </div>
                </div>'''
          if text.count(empty_abgabe) != 1:
              raise SystemExit(f'Expected one empty Abgabe container, found {text.count(empty_abgabe)}')
          text = text.replace(empty_abgabe, onedrive_abgabe)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "refactor: simplify root settings logic"
          git push origin HEAD:dev
