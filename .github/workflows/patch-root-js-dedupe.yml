name: One-shot Root JS Dedupe

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/patch-root-js-dedupe.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Remove duplicate root font logic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              "    const themeToggle = document.getElementById('themeToggle');\n": "",
              "    const fontSizeRange = document.getElementById('fontSizeRange');\n": "",
              "    const fontSizeValue = document.getElementById('fontSizeValue');\n": "",
              """    function setFontSize(percent) {
      const value = Math.min(250, Math.max(80, Number(percent) || 100));
      document.documentElement.style.setProperty('--font-scale', value / 100);
      fontSizeRange.value = value;
      fontSizeValue.value = `${value}%`;
      fontSizeValue.textContent = `${value}%`;
      localStorage.setItem('ib-font-size', value);
    }

""": "",
              "    fontSizeRange.addEventListener('input', () => setFontSize(fontSizeRange.value));\n\n": "",
              "    // Initialize\n    setFontSize(localStorage.getItem('ib-font-size') || 100);\n    restoreKachelStates();\n": "    restoreKachelStates();\n",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit dedupe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "refactor: dedupe root font settings logic"
          git push origin HEAD:dev
