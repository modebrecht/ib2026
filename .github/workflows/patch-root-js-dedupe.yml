name: One-shot Root JS Dedupe

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/patch-root-js-dedupe.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Remove duplicate root font logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          for old in (
              "    const themeToggle = document.getElementById('themeToggle');\n",
              "    const fontSizeRange = document.getElementById('fontSizeRange');\n",
              "    const fontSizeValue = document.getElementById('fontSizeValue');\n",
              "    fontSizeRange.addEventListener('input', () => setFontSize(fontSizeRange.value));\n\n",
          ):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old!r}')
              text = text.replace(old, '')
          text, count = re.subn(r'\n    function setFontSize\(percent\) \{.*?\n    \}\n', '\n', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one duplicate setFontSize function, found {count}')
          old_init = "    // Initialize\n    setFontSize(localStorage.getItem('ib-font-size') || 100);\n    restoreKachelStates();\n"
          if text.count(old_init) != 1:
              raise SystemExit('Expected one duplicate font initialization block')
          text = text.replace(old_init, '    restoreKachelStates();\n')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit dedupe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "refactor: dedupe root font settings logic"
          git push origin HEAD:dev
