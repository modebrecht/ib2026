name: Patch A11 E2E click

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/patch-e2e-a11.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Stabilize animated dialogue button click
        run: |
          python -c "from pathlib import Path; p=Path('e2e/hw-a1-a14.spec.js'); s=p.read_text(); old=\"await page.locator('#dialogueNext').click();\"; new=\"await page.locator('#dialogueNext').click({ force: true });\"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new))"
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/hw-a1-a14.spec.js
          git commit -m "test: stabilize A11 dialogue click"
          git push origin HEAD:dev
