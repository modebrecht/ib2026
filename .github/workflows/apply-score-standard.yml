name: Apply HW score loader

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/apply-score-standard.yml

permissions:
  contents: write

jobs:
  integrate-loader:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Add shared score-history loader
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'hw/assets/js/worksheet-common.js';
          let content = fs.readFileSync(path, 'utf8');
          const marker = '/* ---------- Shared score history bootstrap ---------- */';
          if (!content.includes(marker)) {
            content += `\n\n${marker}\n(function loadSharedScoreHistory(){\n    if (document.querySelector('script[data-score-history]')) return;\n    var script = document.createElement('script');\n    script.src = 'assets/js/score-history.js';\n    script.async = false;\n    script.setAttribute('data-score-history', '1');\n    document.head.appendChild(script);\n})();\n`;
            fs.writeFileSync(path, content);
          }
          NODE
          node --check hw/assets/js/worksheet-common.js
          node --check hw/assets/js/score-history.js

      - name: Commit loader only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hw/assets/js/worksheet-common.js
          if git diff --cached --quiet; then
            echo "Loader already integrated"
            exit 0
          fi
          git commit -m "Integrate shared HW score history"
          git push origin dev
