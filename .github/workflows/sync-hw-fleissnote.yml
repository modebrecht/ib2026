name: Sync HW Fleissnote wording

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message != 'Sync HW Fleissnote with TK2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Update HW Fleissnote copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          changes = [
              (
                  '<div><strong>1 P</strong> pro abgegebener Aufgabe</div>',
                  '<div><strong>1 P</strong> = Abgabe / Nachweis im OneDrive-Ordner <strong>IB</strong></div>'
              ),
              (
                  '<div><strong>+ bis 1 P</strong> für Vollständigkeit / Qualität der Bearbeitung</div>',
                  '<div><strong>+ bis 1 P</strong> für Vollständigkeit / Qualität der Bearbeitung</div>\n'
                  '                <div>Bei Prozentresultaten: <strong>bestes Resultat ÷ 100</strong> (z. B. 80 % = +0.80 P · 100 % = +1.00 P).</div>\n'
                  '                <div>Ohne Prozentwert gilt: <strong>vollständig erledigt = +1 P</strong>.</div>'
              ),
              (
                  '<div style="margin-top: 6px; color: var(--muted);">Maximal 2 P pro Aufgabe · bei A1–A14 maximal 28 P.</div>',
                  '<div style="margin-top: 6px; color: var(--muted);">Maximal 2 P pro A-Aufgabe · A1–A14 = maximal 28 P.</div>'
              ),
              (
                  '<span>Lade die <strong>PDFs in deinen OneDrive-Ordner hoch</strong> und teile ihn mit deiner Informatiklehrperson</span>',
                  '<span>Lege die <strong>Datei oder den Nachweis im OneDrive-Ordner „IB“</strong> ab. Erstelle den Ordner falls nötig und teile ihn <strong>einmal</strong> mit deiner Informatiklehrperson.</span>'
              )
          ]
          for old, new in changes:
              if old not in s:
                  raise SystemExit(f'Expected text not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sync HW Fleissnote with TK2"
          git push origin dev
