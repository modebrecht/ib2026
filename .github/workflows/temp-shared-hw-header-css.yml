name: Temp Shared HW Header CSS
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/temp-shared-hw-header-css.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Centralize A1-A9 header glass styling
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css = '''/* Shared worksheet header glassmorphism */
          .worksheet-header {
            background: rgba(255, 255, 255, .70);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border-bottom: 1px solid rgba(255, 255, 255, .40);
          }

          .dark .worksheet-header {
            background: rgba(15, 23, 42, .70);
            border-bottom-color: rgba(51, 65, 85, .50);
          }
          '''
          Path('hw/assets/css/worksheet-common.css').write_text(css, encoding='utf-8')

          old = 'bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl border-b border-white/40 dark:border-slate-700/50'
          css_link = '<link rel="stylesheet" href="assets/css/worksheet-common.css">'
          changed = []

          for i in range(1, 10):
              p = Path(f'hw/A{i}.html')
              s = p.read_text(encoding='utf-8')

              if old not in s:
                  raise SystemExit(f'Expected current header glass classes not found in {p}')
              s = s.replace(old, 'worksheet-header', 1)

              if css_link not in s:
                  pattern = r'(<link\s+rel=["\']stylesheet["\']\s+href=["\']assets/css/fontawesome\.min\.css["\'][^>]*>)'
                  s, n = re.subn(pattern, r'\1\n' + css_link, s, count=1)
                  if n != 1:
                      raise SystemExit(f'Could not insert shared CSS link in {p}')

              if s.count('worksheet-header') != 1:
                  raise SystemExit(f'Unexpected worksheet-header count in {p}: {s.count("worksheet-header")}')
              if s.count(css_link) != 1:
                  raise SystemExit(f'Unexpected shared CSS link count in {p}: {s.count(css_link)}')

              p.write_text(s, encoding='utf-8')
              changed.append(str(p))

          print('migrated:', changed)
          PY
      - name: Commit migration and remove temporary workflow
        run: |
          rm .github/workflows/temp-shared-hw-header-css.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hw/A1.html hw/A2.html hw/A3.html hw/A4.html hw/A5.html hw/A6.html hw/A7.html hw/A8.html hw/A9.html hw/assets/css/worksheet-common.css .github/workflows/temp-shared-hw-header-css.yml
          git commit -m 'refactor(hw): centralize worksheet header glass CSS'
          git push origin dev