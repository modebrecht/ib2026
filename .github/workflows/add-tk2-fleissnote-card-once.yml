name: Add TK2 Fleissnote card
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/add-tk2-fleissnote-card-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch
        run: python .github/scripts/add_tk2_fleissnote_card.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('tk2/index.html').read_text(encoding='utf-8')
          assert 'class="fleiss-card"' in s
          assert 'Abgabe = 1 Punkt' in s
          assert 'Zielwert = bis +1 Punkt' in s
          assert 'Maximum = 2 Punkte' in s
          assert 'module-a8' not in s
          assert "count+' / 7'" in s
          assert '(count/7*100)' in s
          print('Fleissnote card checks OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/index.html
          git commit -m "tk2: add Fleissnote info card"
          git push origin dev
