name: Unlock root worksheets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unlock-root-worksheets.yml'

permissions:
  contents: write

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove worksheet locks from root index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Remove disabled attributes from root worksheet launch links.
          text = re.sub(r'(<a\b[^>]*class="btn-link"[^>]*)\s+disabled>', r'\1>', text)

          # Remove the obsolete CSS rule that visually/physically disabled those links.
          text = re.sub(
              r'\n    \.btn-link\[disabled\] \{\n'
              r'      opacity: 0\.4;\n'
              r'      pointer-events: none;\n'
              r'      cursor: not-allowed;\n'
              r'      box-shadow: none;\n'
              r'    \}\n',
              '\n',
              text
          )

          path.write_text(text, encoding='utf-8')
          PY

          if grep -qE '<a[^>]*class="btn-link"[^>]*disabled' index.html; then
            echo 'Disabled worksheet link still present' >&2
            exit 1
          fi

          rm .github/workflows/unlock-root-worksheets.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/unlock-root-worksheets.yml
          git commit -m 'Unlock all root worksheet links'
          git push origin main
