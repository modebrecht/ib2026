name: Final A5 circle cleanup
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/remove-a5-remaining-circles-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch
        run: python .github/scripts/remove_a5_remaining_circles.py
      - name: Verify
        run: |
          node --check tk2/a4Scenes.js
          node --check tk2/sceneKeycaps.js
          grep -q "var CHORD_HOLD_MS=800;" tk2/sceneKeycaps.js
          git diff --exit-code -- tk2/sceneKeycaps.js
          python - <<'PY'
          from pathlib import Path
          s=Path('tk2/a4Scenes.js').read_text(encoding='utf-8')
          assert "keyX=552-keyRowWidth" in s
          assert 'var keyScale' not in s
          assert "sceneDecoration=cfg.family==='windows'?'':" in s
          assert '<circle cx="310" cy="76" r="74"' not in s
          assert '<circle cx="315" cy="83" r="94"' not in s
          assert '<circle cx="485" cy="133" r="42"' not in s
          assert '<rect x="447" y="95" width="76" height="76" rx="20"' in s
          assert s.count('translate(-126 -35) scale(1.51 1.25)') == 2
          # Maximized window bounds stay inside desktop x=28..393, y=25..280.
          x=112*1.51-126; y=58*1.25-35; r=(112+225)*1.51-126; b=(58+158)*1.25-35
          assert 28 <= x <= r <= 393 and 25 <= y <= b <= 280,(x,y,r,b)
          # Every current 3-key shortcut fits unscaled before x=552.
          combos=[['Ctrl','Shift','T'],['Ctrl','Shift','Tab'],['Win','Shift','S'],['Ctrl','Shift','Esc']]
          def w(k): return 68 if k=='Ctrl' else (70 if len(k)>2 else 48)
          for keys in combos:
            row=sum(w(k) for k in keys)+26*(len(keys)-1)
            left=552-row
            assert left>=284 and left+row<=552,(keys,left,row)
          print('final A5 visual checks OK; 3-key rows fit; maximize bounded; 800ms preserved')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/a4Scenes.js
          git commit -m "tk2: remove remaining A5 decorative circles"
          git push origin dev
