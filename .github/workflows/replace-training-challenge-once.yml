name: Replace training with challenge

on:
  push:
    paths:
      - '.github/workflows/replace-training-challenge-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Replace training with challenge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('tk2/tasten.html')
          text = p.read_text(encoding='utf-8')

          text = text.replace('<span class="nav-ico">◎</span>Training</button>', '<span class="nav-ico">◎</span>Challenge</button>')
          text = text.replace('<i>◎</i>Training</button>', '<i>◎</i>Challenge</button>')
          text = text.replace("train:'Training'", "train:'Challenge'")

          section = re.compile(r'<section class="view" id="view-train">.*?</section>', re.S)
          replacement = '''<section class="view" id="view-train">
        <div class="view-inner">
          <div class="view-head">
            <div><span class="eyebrow">10 Fragen · aktives Abrufen</span><h1>Challenge</h1><p>Wähle aus vier Tastenkombinationen. Falsche Antworten kommen später nochmals.</p></div>
            <span class="count-pill" id="roundPill">1 / 10</span>
          </div>
          <div class="practice-layout">
            <div class="practice-card" id="challengeCard">
              <span class="prompt-label" id="practiceLabel">Welche Tastenkombination passt?</span>
              <h2 id="practicePrompt">Kopieren</h2>
              <div class="quiz-options" id="quizOptions"></div>
              <div class="answer" id="practiceAnswer"></div>
              <div class="practice-actions"><button class="solid-btn" id="challengeNext" hidden>Weiter →</button></div>
            </div>
            <aside class="side-card">
              <div><h3>Challenge</h3><p style="color:var(--muted);font-size:.86rem;line-height:1.45;margin-bottom:12px">10 zufällige Kürzel. Ziel: alle am Ende sicher erkennen.</p><button class="soft-btn" id="challengeRestart">Neue Challenge</button></div>
              <div class="mini-stats">
                <div class="mini-stat"><span>Punkte</span><strong id="challengeScore">0 / 1000</strong></div>
                <div class="mini-stat"><span>Direkt richtig</span><strong id="challengeDirect">0 / 10</strong></div>
                <div class="mini-stat"><span>Serie</span><strong id="streak">0</strong></div>
                <div class="mini-stat"><span>Wiederholungen</span><strong id="challengeRetries">0</strong></div>
              </div>
            </aside>
          </div>
        </div>
      </section>'''
          text, n = section.subn(lambda m: replacement, text, count=1)
          if n != 1:
              raise SystemExit('challenge section replacement failed')

          js = re.compile(r'function shufflePractice\(firstId=null\).*?function nextPractice\(\)\{.*?\}\n', re.S)
          js_replacement = r'''const challenge={queue:[],index:0,phase:'main',score:0,directCorrect:0,streak:0,bestStreak:0,retries:0,answered:false};
function challengeDistractors(item,n=3){return shortcuts.filter(s=>s.id!==item.id).sort(()=>Math.random()-.5).slice(0,n)}
function startChallenge(firstId=null){let ids=shortcuts.map(s=>s.id).sort(()=>Math.random()-.5);if(firstId&&ids.includes(firstId)){ids=ids.filter(id=>id!==firstId);ids.unshift(firstId)}challenge.queue=ids.slice(0,10).map(id=>({id,main:true}));Object.assign(challenge,{index:0,phase:'main',score:0,directCorrect:0,streak:0,bestStreak:0,retries:0,answered:false});renderChallengeHUD();renderChallenge()}
function renderChallengeHUD(){$('#challengeScore').textContent=`${challenge.score} / 1000`;$('#challengeDirect').textContent=`${challenge.directCorrect} / 10`;$('#streak').textContent=challenge.streak;$('#challengeRetries').textContent=challenge.retries}
function challengeItem(){const q=challenge.queue[challenge.index];return q?shortcuts.find(s=>s.id===q.id):null}
function renderChallenge(){if(challenge.index>=challenge.queue.length){finishChallenge();return}challenge.answered=false;const q=challenge.queue[challenge.index],item=challengeItem();if(!item){challenge.index++;renderChallenge();return}const mainDone=challenge.queue.slice(0,challenge.index).filter(x=>x.main).length;$('#roundPill').textContent=q.main?`${Math.min(mainDone+1,10)} / 10`:'Wiederholung';$('#practiceLabel').textContent=q.main?'Welche Tastenkombination passt?':'Nochmals: Welche Kombination passt?';$('#practicePrompt').textContent=item.title;$('#practiceAnswer').classList.remove('show');$('#practiceAnswer').innerHTML='';$('#challengeNext').hidden=true;const host=$('#quizOptions');host.innerHTML='';[item,...challengeDistractors(item)].sort(()=>Math.random()-.5).forEach(choice=>{const b=document.createElement('button');b.className='quiz-option';b.textContent=keyText(choice);b.dataset.correct=choice.id===item.id?'1':'0';b.onclick=()=>gradeChallenge(b,choice.id===item.id,item,q);host.appendChild(b)})}
function gradeChallenge(btn,correct,item,q){if(challenge.answered)return;challenge.answered=true;$$('.quiz-option').forEach(b=>b.disabled=true);btn.classList.add(correct?'correct':'wrong');if(!correct){const right=$('.quiz-option[data-correct="1"]');if(right)right.classList.add('correct')}if(correct){challenge.streak++;challenge.bestStreak=Math.max(challenge.bestStreak,challenge.streak);if(q.main){challenge.directCorrect++;challenge.score+=100}haptic([12,24,18]);toast('Richtig ✓')}else{challenge.streak=0;challenge.retries++;challenge.queue.push({id:item.id,main:false});haptic([24,34,24]);toast('Kommt später nochmals')}renderChallengeHUD();$('#practiceAnswer').innerHTML=`<div class="keys">${keyMarkup(item)}</div><p>${escapeHtml(item.desc)}</p>`;$('#practiceAnswer').classList.add('show');$('#challengeNext').hidden=false}
function nextChallenge(){if(!challenge.answered)return;challenge.index++;renderChallenge()}
function finishChallenge(){$('#roundPill').textContent='Geschafft ✓';$('#practiceLabel').textContent='Challenge abgeschlossen';$('#practicePrompt').textContent='10 / 10 gemeistert 🎯';$('#quizOptions').innerHTML='';$('#practiceAnswer').innerHTML=`<p><strong>${challenge.directCorrect} von 10</strong> direkt richtig · ${challenge.retries} Wiederholung${challenge.retries===1?'':'en'} · beste Serie ${challenge.bestStreak}.</p>`;$('#practiceAnswer').classList.add('show');$('#challengeNext').hidden=true;haptic([20,35,20,35,50])}
'''
          text, n = js.subn(lambda m: js_replacement, text, count=1)
          if n != 1:
              raise SystemExit('challenge JS replacement failed')

          text = text.replace("const practice=e.target.closest('[data-practice]');if(practice){shufflePractice(practice.dataset.practice);renderPractice();showView('train');return}", "const practice=e.target.closest('[data-practice]');if(practice){startChallenge(practice.dataset.practice);showView('train');return}")
          text = text.replace("$('#revealBtn').onclick=()=>$('#practiceAnswer').classList.add('show');$('#nextBtn').onclick=nextPractice;$('#practiceMode').onchange=renderPractice;", "$('#challengeNext').onclick=nextChallenge;$('#challengeRestart').onclick=()=>startChallenge();")
          text = text.replace('renderHome();renderLearn();fillMemoryCategories();shufflePractice();renderPractice();renderFavorites();', 'renderHome();renderLearn();fillMemoryCategories();startChallenge();renderFavorites();')

          for bad in ['practiceMode','revealBtn','nextBtn','renderPractice()','shufflePractice(']:
              if bad in text:
                  raise SystemExit(f'old training marker remains: {bad}')
          for good in ['10 / 10 gemeistert','function startChallenge','id="challengeRestart"','>Challenge</button>']:
              if good not in text:
                  raise SystemExit(f'missing challenge marker: {good}')

          p.write_text(text, encoding='utf-8')
          PY

      - name: Syntax sanity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('tk2/tasten.html').read_text(encoding='utf-8')
          s=re.search(r'<script>(.*)</script>',t,re.S)
          Path('/tmp/tasten.js').write_text(s.group(1),encoding='utf-8')
          PY
          node --check /tmp/tasten.js

      - name: Commit challenge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/tasten.html
          git commit -m "tk2: replace training with 4-option challenge"
          git push origin dev
