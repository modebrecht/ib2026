name: One-shot render A8 all-ranks battle matrix

on:
  push:
    branches:
      - render
    paths:
      - '.github/workflows/render-a8-battle-matrix-once.yml'

permissions:
  contents: read

jobs:
  all-ranks:
    name: A8 ranks 1-11 + enemy items + rewards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Build exact render production bundle
        run: bash scripts/build-vercel-site.sh
      - name: Serve bundle
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/a8-matrix-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/dist/tk2/A8/ >/dev/null && exit 0
            sleep .5
          done
          cat /tmp/a8-matrix-http.log
          exit 1
      - name: Verify all 11 ranks and enemy-item behavior
        run: |
          cat > /tmp/a8-rank-matrix.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const expected = [
            { level:1, name:'Kobold', hp:60, atk:6, def:0, item:null, reward:1 },
            { level:2, name:'Grüner Goblin', hp:80, atk:8, def:1, item:null, reward:1 },
            { level:3, name:'Hobgoblin', hp:110, atk:10, def:2, item:['rust_blade','weapon'], reward:2 },
            { level:4, name:'Waldgoblin', hp:140, atk:12, def:3, item:null, reward:2 },
            { level:5, name:'Höhlengoblin', hp:170, atk:15, def:5, item:['cave_shield','shield'], reward:3 },
            { level:6, name:'Bergtroll', hp:222, atk:18, def:7, item:['heavy_club','weapon'], reward:4 },
            { level:7, name:'Dunkelgoblin', hp:333, atk:22, def:10, item:['shadow_rune','focus'], reward:4 },
            { level:8, name:'Kriegsgoblin', hp:444, atk:26, def:12, item:['war_blade','weapon'], reward:4 },
            { level:9, name:'Schattengoblin', hp:666, atk:32, def:14, item:['void_charm','focus'], reward:5 },
            { level:10, name:'Feuergoblin', hp:777, atk:38, def:17, item:['ember_blade','weapon'], reward:5 },
            { level:11, name:'Goblinkönig', hp:999, atk:42, def:18, item:['royal_elixir','heal'], reward:100 }
          ];
          const scaled = n => Math.max(0, Math.round(n * 1.16));
          const browser = await chromium.launch({ headless:true });
          const page = await browser.newPage({ viewport:{ width:1440, height:1000 } });
          const errors=[];
          page.on('pageerror', e => errors.push(String(e?.stack||e)));

          try {
            await page.goto('http://127.0.0.1:4173/dist/tk2/A8/', { waitUntil:'networkidle' });
            await page.waitForFunction(() => window.SHORTCUT_QUEST_BATTLE_BALANCE?.installed === true);
            const blueprint = await page.evaluate(() => Object.fromEntries(Object.entries(window.SHORTCUT_QUEST_ENEMIES).map(([k,e]) => [k, { name:e.name,hp:e.hp,atk:e.atk,def:e.def,item:e.item ? {key:e.item.key,kind:e.item.kind}:null }])));
            for (const x of expected) {
              const got=blueprint[String(x.level)];
              assert.ok(got, `rank ${x.level} blueprint missing`);
              assert.deepEqual({name:got.name,hp:got.hp,atk:got.atk,def:got.def}, {name:x.name,hp:x.hp,atk:x.atk,def:x.def}, `rank ${x.level} stats mismatch`);
              assert.deepEqual(got.item, x.item ? {key:x.item[0],kind:x.item[1]} : null, `rank ${x.level} item mismatch`);
            }

            await page.evaluate(() => {
              const sections={}; for(let i=1;i<=30;i++) sections[String(i)]=1;
              const clears={}; for(let i=1;i<=10;i++) clears[String(i)]=true;
              state.sectionClears=sections;
              state.battleClears=clears;
              state.battleUnlocked=11;
              state.skills=[];
              state.coins=0;
              saveState(); updateUI(); renderBattleButtons();
            });
            await page.locator('.nav-toggle[data-view="battle"]').click();
            await page.waitForFunction(() => document.getElementById('battleView')?.classList.contains('active'));

            const rows=[];
            for (const x of expected) {
              await page.evaluate(() => { state.coins=0; updateUI(); });
              const btn=page.locator(`#battleButtons .battle-btn[data-enemy="${x.level}"]`);
              assert.equal(await btn.isEnabled(), true, `rank ${x.level} button must be enabled`);
              await btn.click();
              await page.locator('#battleStartBtn').click();
              await page.waitForFunction(() => window.SHORTCUT_QUEST_BATTLE_ENGINE_V2?.phase === 'fighting');

              const initial=await page.evaluate(() => ({
                name:currentBattleContext.enemy.name,
                hp:currentBattleContext.enemy.maxHp,
                atk:currentBattleContext.enemy.atk,
                def:currentBattleContext.enemy.def,
                item:currentBattleContext.enemy.item ? { key:currentBattleContext.enemy.item.key, kind:currentBattleContext.enemy.item.kind } : null
              }));
              assert.deepEqual(initial, { name:x.name,hp:x.hp,atk:x.atk,def:x.def,item:x.item ? {key:x.item[0],kind:x.item[1]} : null }, `rank ${x.level} live context mismatch`);

              if (x.item) {
                if (x.level === 11) {
                  await page.evaluate(() => {
                    currentBattleContext.hero.maxHp=5000;
                    currentBattleContext.hero.hp=5000;
                    currentBattleContext.hero.def=999;
                    currentBattleContext.enemy.hp=300;
                  });
                  await page.waitForFunction(() => currentBattleContext.enemy.item?.useCount === 1, null, { timeout:6000 });
                  const heal=await page.evaluate(() => ({ hp:currentBattleContext.enemy.hp, used:currentBattleContext.enemy.item.used, count:currentBattleContext.enemy.item.useCount }));
                  assert.equal(heal.used, true, 'Königselixier must mark itself used');
                  assert.equal(heal.count, 1, 'Königselixier must be used exactly once');
                  assert.ok(heal.hp > 300, `Königselixier must heal enemy above 300 HP, got ${heal.hp}`);
                  await page.waitForTimeout(1800);
                  assert.equal(await page.evaluate(() => currentBattleContext.enemy.item.useCount), 1, 'Königselixier must remain one-use only');
                } else {
                  await page.evaluate(() => {
                    currentBattleContext.hero.maxHp=5000;
                    currentBattleContext.hero.hp=5000;
                    currentBattleContext.hero.def=999;
                    currentBattleContext.enemy.atk=1;
                    currentBattleContext.enemy.crit=0;
                  });
                  await page.waitForFunction(() => currentBattleContext.enemy.item?.useCount >= 1, null, { timeout:6000 });
                }
              }

              const itemUses=await page.evaluate(() => currentBattleContext.enemy.item?.useCount || 0);
              await page.evaluate(() => {
                currentBattleContext.enemy.hp=1;
                currentBattleContext.enemy.atk=0;
                currentBattleContext.enemy.crit=0;
              });
              await page.waitForFunction(() => window.SHORTCUT_QUEST_BATTLE_ENGINE_V2?.phase === 'victory', null, { timeout:10000 });
              const outcome=await page.evaluate(level => ({ coins:state.coins, cleared:Boolean(state.battleClears?.[String(level)]), phase:window.SHORTCUT_QUEST_BATTLE_ENGINE_V2.phase, error:window.SHORTCUT_QUEST_BATTLE_ENGINE_V2.lastError }), x.level);
              assert.equal(outcome.phase,'victory');
              assert.equal(outcome.error,null);
              assert.equal(outcome.cleared,true);
              assert.equal(outcome.coins,scaled(x.reward),`rank ${x.level} reward mismatch`);
              rows.push({level:x.level,name:x.name,item:x.item?.[0]||null,itemUses,reward:outcome.coins});

              if (x.level < 11) {
                await page.keyboard.press('Escape');
                await page.waitForFunction(() => document.getElementById('battleSimulation')?.classList.contains('hidden'));
              }
            }
            assert.deepEqual(errors,[],`Uncaught browser errors: ${errors.join(' | ')}`);
            console.log('ALL 11 BATTLE RANKS OK');
            console.log(JSON.stringify(rows,null,2));
          } finally { await browser.close(); }
          NODE
          node /tmp/a8-rank-matrix.mjs
      - name: Server log on failure
        if: failure()
        run: cat /tmp/a8-matrix-http.log || true
