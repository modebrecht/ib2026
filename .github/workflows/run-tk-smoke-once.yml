name: Trigger TK A1-A7 Production Smoke Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-tk-smoke-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch TK smoke against Vercel production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/e2e-smoke-tk.yml/dispatches" \
            -f ref=main \
            -f 'inputs[base_url]=https://ib2026.vercel.app'
