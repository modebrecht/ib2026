name: One-shot A10 Premium Visuals

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/patch-a10-premium-visuals.yml
      - .github/scripts/patch_a10_premium_visuals.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Upgrade all A10 scenario visuals
        run: python .github/scripts/patch_a10_premium_visuals.py

      - name: Commit premium visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hw/A10.html
          git commit -m "ui: upgrade all A10 scenario visuals"
          git push origin HEAD:dev
