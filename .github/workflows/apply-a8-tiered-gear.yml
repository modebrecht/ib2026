name: Apply A8 Tiered Gear Deploy

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/apply-a8-tiered-gear.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Install canonical gear overlay and loader
        run: |
          mkdir -p tk2/A8
          curl -fsSL \
            https://raw.githubusercontent.com/modebrecht/shortcut-quest/2340e9cfdfb95a1747172c09686256ed8f9b4826/2026/gear-visuals.js \
            -o tk2/A8/gear-visuals.js

          python3 - <<'PY'
          from pathlib import Path
          path = Path('tk2/a8-pdf-report.js')
          text = path.read_text(encoding='utf-8')
          marker = 'A8 TIERED GEAR DEV LOADER 2026'
          if marker not in text:
              text += r'''

/* A8 TIERED GEAR DEV LOADER 2026
   The Pages assembler already copies this diagnostic file into /dev/tk2/A8/pdf-report.js.
   Load the canonical Shortcut Quest gear overlay from the same deployed directory. */
(() => {
  if (document.querySelector('script[data-a8-tiered-gear-loader]')) return;
  const script = document.createElement('script');
  script.src = 'gear-visuals.js?v=2340e9cf';
  script.async = false;
  script.dataset.a8TieredGearLoader = 'true';
  document.head.appendChild(script);
})();
'''
              path.write_text(text, encoding='utf-8')
          PY

          node --check tk2/A8/gear-visuals.js
          node --check tk2/a8-pdf-report.js
          grep -Fq 'A8 TIERED KNIGHT GEAR VISUALS 2026' tk2/A8/gear-visuals.js
          grep -Fq 'A8 TIERED GEAR DEV LOADER 2026' tk2/a8-pdf-report.js

      - name: Commit DEV shim
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/A8/gear-visuals.js tk2/a8-pdf-report.js
          git commit -m "feat: stage tiered A8 knight gear overlay"
          git push origin HEAD:dev
