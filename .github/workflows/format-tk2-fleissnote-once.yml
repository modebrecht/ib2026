name: Format TK2 Fleissnote once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/format-tk2-fleissnote-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Format TK2 Fleissnote box
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('tk2/index.html')
          text = p.read_text(encoding='utf-8')

          old = '''  <section class="fleiss-card" aria-label="Fleissnote">
    <div class="fleiss-card-head"><div><span class="fleiss-card-badge">Fleissnote</span><h2>Jede Quest zählt gleich viel</h2></div></div>
    <p><strong>1 Punkt</strong> = Abgabe / Nachweis im OneDrive-Ordner <strong>IB</strong> (einmal mit der Lehrperson teilen). Bei <strong>100 % Genauigkeit</strong> gibt es einen vollen Zusatzpunkt. Sonst wird der Zusatzpunkt anteilig berechnet.</p>
    <div class="fleiss-points"><span>Verbessern erlaubt – bestes Resultat zählt</span><span>Max. 2 Punkte pro Quest · Q1–Q14 = max. 28 Punkte</span></div>
  </section>'''

          new = '''  <section class="fleiss-card" aria-label="Fleissnote">
    <div class="fleiss-card-head"><div><span class="fleiss-card-badge">Fleissnote</span><h2>Jede Quest zählt gleich viel</h2></div></div>
    <ul style="margin:0;padding-left:20px;display:grid;gap:6px;color:var(--text-muted);font-size:.92rem;line-height:1.55;">
      <li><strong style="color:#f8fafc;">1 Punkt</strong> = PDF im OneDrive-Ordner <strong style="color:#f8fafc;">IB</strong></li>
      <li><strong style="color:#f8fafc;">100 % Genauigkeit</strong> = voller Zusatzpunkt; sonst anteilig</li>
      <li>Verbessern erlaubt – <strong style="color:#f8fafc;">nur das beste Resultat zählt</strong></li>
    </ul>
    <div style="margin-top:14px;padding-top:12px;border-top:1px solid rgba(245,158,11,.16);display:grid;gap:3px;color:var(--text-muted);font-size:.86rem;">
      <div><strong style="color:#fde68a;">Maximal 2 Punkte</strong> pro Quest</div>
      <div>Q1–Q14 = <strong style="color:#fde68a;">maximal 28 Punkte</strong></div>
    </div>
  </section>'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one TK2 Fleissnote block, found {count}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/index.html
          git commit -m "Format TK2 Fleissnote info box"
          git push origin dev
