name: Standardize 800ms chord hold
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/standardize-chord-hold-800-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply 800ms chord hold
        run: python .github/scripts/standardize_chord_hold_800.py
      - name: JavaScript syntax
        run: |
          node --check tk2/sceneKeycaps.js
          node --check tk2/docTextScene.js
          node --check tk2/utilityScenes-base.js
          node --check tk2/utilityNavigationScenes.js
          node --check tk2/altGrScene.js
          node --check tk2/a4Scenes.js
          node --check tk2/a4-app.js
          node --check tk2/a5-app.js
      - name: Verify common chord hold
        run: |
          python - <<'PY'
          from pathlib import Path
          shared=Path('tk2/sceneKeycaps.js').read_text(encoding='utf-8')
          a1=Path('tk2/A1.html').read_text(encoding='utf-8')
          a2=Path('tk2/A2.html').read_text(encoding='utf-8')
          a4=Path('tk2/A4.html').read_text(encoding='utf-8')
          a5=Path('tk2/A5.html').read_text(encoding='utf-8')
          alt=Path('tk2/altGrScene.js').read_text(encoding='utf-8')
          doc=Path('tk2/docTextScene.js').read_text(encoding='utf-8')
          util=Path('tk2/utilityScenes-base.js').read_text(encoding='utf-8')
          nav=Path('tk2/utilityNavigationScenes.js').read_text(encoding='utf-8')
          a4s=Path('tk2/a4Scenes.js').read_text(encoding='utf-8')

          assert 'var CHORD_HOLD_MS=800;' in shared
          assert 'allDownAt+CHORD_HOLD_MS' in shared
          assert 'chordHoldMs:CHORD_HOLD_MS' in shared
          assert 'sceneKeycaps.js' in a1
          assert 'sceneKeycaps.js' in a2
          assert 'sceneKeycaps.js' in a4
          assert 'sceneKeycaps.js' in a5
          assert 'window.tk2SceneKeycaps?window.tk2SceneKeycaps.chordHoldMs:800' in alt
          assert 'pressSequence' in doc
          assert 'pressSequence' in util
          assert 'pressSequence' in nav
          assert 'pressSequence' in a4s
          print('OK: A1/A2/A4/A5 animated shortcut chords share 800 ms simultaneous hold; A3 has no key animation')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/sceneKeycaps.js tk2/A2.html tk2/altGrScene.js
          git commit -m "tk2: hold shortcut chords together for 800ms"
          git push origin dev
