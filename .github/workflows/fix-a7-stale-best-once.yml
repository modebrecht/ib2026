name: Fix A7 stale best
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fix-a7-stale-best-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch
        run: python .github/scripts/fix_a7_stale_best.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('tk2/A7.html').read_text(encoding='utf-8')
          assert "$('#best').textContent" not in s
          assert 'id="best"' not in s
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/a7.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('A7 stale #best check OK')
          PY
          node --check /tmp/a7.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+modebrecht@users.noreply.github.com"
          git add tk2/A7.html
          git commit -m "fix: remove stale A7 best-score write"
          git push origin dev
