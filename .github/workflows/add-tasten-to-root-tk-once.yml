name: Add tasten to root TK

on:
  push:
    paths:
      - '.github/workflows/add-tasten-to-root-tk-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply root TK patch
        run: python .github/scripts/add_tasten_to_root_tk.py
      - name: Verify links
        run: |
          grep -q 'href="tk2/index.html"' index.html
          grep -q 'href="tk2/tasten.html"' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "root: add shortcut trainer inside Tastenkombinationen"
          git push origin dev
