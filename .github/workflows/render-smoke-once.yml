name: One-shot render smoke (no TK2 A8)

on:
  push:
    branches:
      - render

permissions:
  contents: read

concurrency:
  group: render-smoke-once
  cancel-in-progress: true

jobs:
  hw:
    name: HW A1-A14 + history + persistence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_URL: https://modebrecht.github.io/ib2026/render
    steps:
      - name: Checkout render
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Run HW smoke suites
        run: >-
          npx playwright test
          e2e/hw-a1-a14.spec.js
          e2e/hw-score-history-fast.spec.js
          e2e/hw-persistence-contract.spec.js
          --browser=chromium --workers=1 --reporter=line,html
      - name: Upload HW failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-smoke-hw-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  tk:
    name: TK2 A1-A7 + history + persistence + Gesamt-PDF
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_URL: https://modebrecht.github.io/ib2026/render
    steps:
      - name: Checkout render
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Run TK2 A1-A7 smoke suites
        run: >-
          npx playwright test
          e2e/tk-a1-a7.spec.js
          e2e/tk-a7-full-play.spec.js
          e2e/tk-score-history-fast.spec.js
          e2e/tk-persistence-contract.spec.js
          --browser=chromium --workers=1 --reporter=line,html
      - name: Smoke TK2 Gesamt-PDF
        run: |
          mkdir -p smoke-artifacts
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('@playwright/test');

          (async () => {
            const baseUrl = process.env.BASE_URL.replace(/\/$/, '');
            const browser = await chromium.launch();
            const context = await browser.newContext({ acceptDownloads: true });
            const page = await context.newPage();

            await page.goto(`${baseUrl}/`, { waitUntil: 'domcontentloaded' });
            await page.evaluate(() => {
              localStorage.clear();
              sessionStorage.clear();
              localStorage.setItem('studentVorname', 'E2E Smoke');
              localStorage.setItem('student_vorname', 'E2E Smoke');
              localStorage.setItem('tk_student_name_v1', 'E2E Smoke');
              localStorage.setItem('tk_quest_scores_v1', JSON.stringify({
                q1:100,q2:100,q3:100,q4:100,q5:100,q6:100,q7:100,
                q8:100,q9:100,q10:100,q11:100,q12:100,q13:100
              }));
              localStorage.setItem('tk_a3_progress_v1', JSON.stringify({
                schemaVersion:2, downloaded:true, onedriveStored:true, completed:true, rewarded:true,
                choices:[
                  {shortcut:'Ctrl + C',reason:'Schneller kopieren'},
                  {shortcut:'Ctrl + Z',reason:'Fehler rückgängig machen'},
                  {shortcut:'Win + L',reason:'Computer sperren'}
                ]
              }));
              localStorage.setItem('tk_a4_progress_v1', JSON.stringify({A:{attempts:2,first:100,second:100,best:100}}));
              localStorage.setItem('tk_a5_progress_v1', JSON.stringify({A:{attempts:2,first:100,second:100,best:100}}));
              localStorage.setItem('tk_a6_progress_v1', JSON.stringify({A:{first:100,best:100},B:{first:100,best:100},C:{first:100,best:100},D:{first:100,best:100}}));
              const now = new Date().toISOString();
              localStorage.setItem('tk_a7_training_v1', JSON.stringify({
                schemaVersion:1,
                modes:{
                  challenge:{all:{completedRuns:2,correct:18,wrong:2,lastAccuracy:90,bestAccuracy:100,lastAt:now,retries:0}},
                  hunt:{all:{completedRuns:1,correct:9,wrong:1,lastAccuracy:90,bestAccuracy:90,lastAt:now,retries:0}},
                  memory:{all:{completedRuns:3,pairs:12,moves:15,points:220,lastEfficiency:80,bestEfficiency:100,lastDiff:'easy',lastElapsed:1000,lastAt:now}}
                }
              }));
              localStorage.setItem('tk_a7_progress_v1', JSON.stringify({
                schemaVersion:2,completed:true,completedStations:3,
                stations:{challenge:2,hunt:1,memory:3},completedRuns:6,accuracy:90,target:70,targetReached:true,pdfReady:true,updatedAt:now
              }));
            });

            await page.goto(`${baseUrl}/tk2/index.html`, { waitUntil: 'domcontentloaded' });
            const exportButton = page.locator('button, a').filter({ hasText: 'Zwischenstand erzeugen' });
            if (await exportButton.count() !== 1) throw new Error('Zwischenstand erzeugen button missing or duplicated');
            const [download] = await Promise.all([
              page.waitForEvent('download', { timeout: 30000 }),
              exportButton.click()
            ]);
            const output = path.resolve('smoke-artifacts', 'TK2-Gesamt-Zwischenstand-E2E.pdf');
            await download.saveAs(output);
            const bytes = fs.readFileSync(output);
            if (bytes.length <= 1000) throw new Error(`Gesamt-PDF too small: ${bytes.length}`);
            if (bytes.subarray(0,5).toString('ascii') !== '%PDF-') throw new Error('Gesamt-PDF signature invalid');
            console.log(`Gesamt-PDF OK: ${bytes.length} bytes`);
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Upload TK2 Gesamt-PDF
        uses: actions/upload-artifact@v4
        with:
          name: render-tk2-gesamtpdf-${{ github.run_id }}
          path: smoke-artifacts/TK2-Gesamt-Zwischenstand-E2E.pdf
          if-no-files-found: error
          retention-days: 7
      - name: Upload TK2 failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-smoke-tk2-a1-a7-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
            smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 7
