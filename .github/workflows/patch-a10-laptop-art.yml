name: One-shot A10 Laptop Art

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/patch-a10-laptop-art.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Replace upgrade scene with clear laptop illustration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('hw/A10.html')
          text = path.read_text(encoding='utf-8')
          svg = '<svg viewBox="0 0 440 250"><g><rect class="ink" x="92" y="29" width="256" height="137" rx="17"/><rect class="paper" x="105" y="42" width="230" height="111" rx="9"/><rect class="soft-blue" x="118" y="55" width="204" height="85" rx="7"/><circle class="blue" cx="220" cy="97" r="31"/><path d="M220 75v24l17 10" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="220" cy="97" r="4" fill="#fff"/><path class="speed-line" d="M131 71h38M126 91h31M132 116h42" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/><circle class="green" cx="220" cy="35" r="3"/><rect class="metal" x="108" y="164" width="224" height="8" rx="4"/><path class="ink" d="M78 170h284l38 48H40l38-48Z"/><path class="metal" d="M91 179h258l22 28H69l22-28Z"/><g fill="#94a3b8"><rect x="104" y="184" width="20" height="7" rx="2"/><rect x="129" y="184" width="20" height="7" rx="2"/><rect x="154" y="184" width="20" height="7" rx="2"/><rect x="179" y="184" width="20" height="7" rx="2"/><rect x="204" y="184" width="20" height="7" rx="2"/><rect x="229" y="184" width="20" height="7" rx="2"/><rect x="254" y="184" width="20" height="7" rx="2"/><rect x="279" y="184" width="20" height="7" rx="2"/><rect x="304" y="184" width="20" height="7" rx="2"/><rect x="115" y="195" width="20" height="7" rx="2"/><rect x="140" y="195" width="20" height="7" rx="2"/><rect x="165" y="195" width="20" height="7" rx="2"/><rect x="190" y="195" width="20" height="7" rx="2"/><rect x="235" y="195" width="20" height="7" rx="2"/><rect x="260" y="195" width="20" height="7" rx="2"/><rect x="285" y="195" width="20" height="7" rx="2"/></g><rect class="paper" x="195" y="192" width="50" height="15" rx="5" opacity=".9"/><path class="line" d="M40 218h360" stroke-width="4"/></g><g class="backup-pulse"><circle class="green" cx="367" cy="66" r="24"/><path d="M356 67l8 8 16-19" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g></svg>'
          pattern = r'upgrade:`<svg viewBox="0 0 440 250">.*?</svg>`,'
          replacement = 'upgrade:`' + svg + '`,'
          new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Expected exactly one upgrade SVG, replaced ' + str(count))
          for check in ['Laptop startet plötzlich schneller.', 'M91 179h258l22 28H69l22-28Z', '<rect x="104" y="184"', 'backup:`<svg']:
              if check not in new_text:
                  raise SystemExit('Validation failed: ' + check)
          path.write_text(new_text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hw/A10.html
          git commit -m "ui: make A10 upgrade scene clearly a laptop"
          git push origin HEAD:dev
