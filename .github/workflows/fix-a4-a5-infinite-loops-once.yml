name: Fix A4 A5 infinite loops
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fix-a4-a5-infinite-loops-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch
        run: python .github/scripts/fix_a4_a5_infinite_loops.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('tk2/a4Scenes.js').read_text(encoding='utf-8')
          a4=Path('tk2/A4.html').read_text(encoding='utf-8')
          a5=Path('tk2/A5.html').read_text(encoding='utf-8')
          assert 'activeController' not in s
          assert s.count("function play(){active=true;run();}") >= 2
          assert s.count("if(active&&autoLoop)run();") >= 2
          assert '<script src="a4Scenes.js"></script>' in a4
          assert '<script src="a4Scenes.js"></script>' in a5
          print('A4/A5 independent infinite loop checks OK')
          PY
          node --check tk2/a4Scenes.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/a4Scenes.js
          git commit -m "tk2: keep A4 A5 visible animations looping"
          git push origin dev
