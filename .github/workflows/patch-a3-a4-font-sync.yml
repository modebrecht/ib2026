name: One-shot A3 A4 Font Sync

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/patch-a3-a4-font-sync.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Wire A3 and A4 to shared worksheet settings
        run: |
          python - <<'PY'
          from pathlib import Path

          for file_name in ('A3.html', 'A4.html'):
              path = Path('hw') / file_name
              text = path.read_text(encoding='utf-8')
              common = '<script src="assets/js/worksheet-common.js"></script>'
              pdf = '<script src="assets/js/pdf-engine.js"></script>'

              if common in text:
                  raise SystemExit(f'{file_name}: worksheet-common.js already present')
              if text.count(pdf) != 1:
                  raise SystemExit(f'{file_name}: expected exactly one pdf-engine include, found {text.count(pdf)}')

              text = text.replace(pdf, common + '\n    ' + pdf, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hw/A3.html hw/A4.html
          git commit -m "fix: sync A3 and A4 font settings"
          git push origin HEAD:dev
