name: Patch A5 E2E carousel

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/patch-e2e-a5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Update A5 carousel flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('e2e/hw-a1-a14.spec.js')
          s = p.read_text(encoding='utf-8')
          old = '''    await expect(page.locator('#cardCounter')).toHaveText('Info');
    await expect(page.locator('#nextCardBtn')).toBeVisible();
    await page.locator('#nextCardBtn').click();

    for (let i = 0; i < ids.length; i += 1) {
      await expect(page.locator('#cardCounter')).toHaveText(`${i + 1} / ${ids.length}`);
      await expect(page.locator(`#${ids[i]}`)).toBeVisible();
      await page.locator(`#${ids[i]}`).fill(`E2E A5 ${i + 1}`);
      if (i < ids.length - 1) await page.locator('#nextCardBtn').click();
    }
'''
          new = '''    await expect(page.locator('#nextCardBtn')).toBeVisible();
    expect(await page.evaluate(() => currentCardIndex)).toBe(0);
    await page.locator('#nextCardBtn').click();

    for (let i = 0; i < ids.length; i += 1) {
      expect(await page.evaluate(() => currentCardIndex)).toBe(i + 1);
      await expect(page.locator(`#${ids[i]}`)).toBeVisible();
      await page.locator(`#${ids[i]}`).fill(`E2E A5 ${i + 1}`);
      if (i < ids.length - 1) await page.locator('#nextCardBtn').click();
    }
'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected one old A5 block, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/hw-a1-a14.spec.js
          git commit -m "test: update A5 smoke for premium carousel"
          git push origin HEAD:dev
