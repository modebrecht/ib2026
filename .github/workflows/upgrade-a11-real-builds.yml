name: One-shot A11 Real Builds Upgrade
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/upgrade-a11-real-builds.yml
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Upgrade A11
        run: python .github/scripts/upgrade_a11_real_builds.py
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hw/A11.html
          git diff --cached --quiet && exit 0
          git commit -m "ui: expand A11 into full-width real build comparisons"
          git push origin dev