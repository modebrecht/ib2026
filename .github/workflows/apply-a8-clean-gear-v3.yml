name: Apply A8 Clean Gear V3

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/apply-a8-clean-gear-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Refresh clean tier overlay
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/modebrecht/shortcut-quest/2742c3e6ee4c4bc72e296d282d4832e1f34d904e/2026/gear-visuals.js \
            -o tk2/A8/gear-visuals.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tk2/a8-pdf-report.js')
          text = path.read_text(encoding='utf-8')
          old = "gear-visuals.js?v=dafdb006"
          new = "gear-visuals.js?v=2742c3e6"
          if old not in text and new not in text:
              raise SystemExit('gear loader cache marker missing')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          node --check tk2/A8/gear-visuals.js
          node --check tk2/a8-pdf-report.js
          grep -Fq 'version: 3' tk2/A8/gear-visuals.js
          grep -Fq 'bodyOverlaySuppressed: true' tk2/A8/gear-visuals.js
          grep -Fq 'gear-visuals.js?v=2742c3e6' tk2/a8-pdf-report.js

      - name: Commit DEV hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/A8/gear-visuals.js tk2/a8-pdf-report.js
          git commit -m "fix: remove pasted-on A8 knight gear icons"
          git push origin HEAD:dev
