name: Fix E2E extender token

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/rerun-extend-e2e.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Fix token replacement safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/extend-e2e-a14.yml')
          s = p.read_text(encoding='utf-8')
          expr = '${' + '{ github.run_id }}'
          old = "              'name: e2e-smoke-hw-a1-a9-" + expr + "': 'name: e2e-smoke-hw-a1-a14-" + expr + "',"
          new = "              'e2e-smoke-hw-a1-a9-': 'e2e-smoke-hw-a1-a14-',"
          if s.count(old) != 1:
              raise SystemExit(f'Expected one artifact-name replacement, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit workflow fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/extend-e2e-a14.yml
          git commit -m "chore: fix E2E extender artifact token"
          git push origin HEAD:dev
