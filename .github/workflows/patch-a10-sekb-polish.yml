name: One-shot A10 Sek B Polish

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/patch-a10-sekb-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Remove remaining advanced A10 terminology
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('hw/A10.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "meta:'Bauform 2,5″ · SATA · meist AHCI'": "meta:'2,5″ · SATA'",
              "meta:'M.2 · SATA · AHCI'": "meta:'M.2 · SATA'",
              "meta:'M.2 · PCIe · NVMe'": "meta:'M.2 · PCIe / NVMe'",
              "desc:'Transportable SSD im Gehäuse, typischerweise über USB-C, USB oder Thunderbolt.'": "desc:'Transportable SSD im Gehäuse, typischerweise über USB oder USB-C.'",
              "meta:'extern · USB/Thunderbolt · Protokoll je nach Gehäuse'": "meta:'extern · USB / USB-C'",
              '<option value="sata">SATA / AHCI</option>': '<option value="sata">SATA</option>',
              '<option value="external">Extern über USB / Thunderbolt</option>': '<option value="external">Extern über USB</option>',
              "title:'Moderner Gaming-PC mit freiem M.2-PCIe-4.0-Slot'": "title:'Moderner Gaming-PC mit freiem M.2-NVMe-Slot'",
              "'Noch nicht – achte auf Schnittstelle/Protokoll'": "'Noch nicht – achte auf Anschluss und SSD-Typ'",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)

          for forbidden in ('AHCI', 'PCIe-4.0', 'PCIe 5.0', 'Thunderbolt'):
              if forbidden in text:
                  raise SystemExit(f'Advanced term still present: {forbidden}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hw/A10.html
          git commit -m "content: simplify A10 terminology"
          git push origin HEAD:dev
