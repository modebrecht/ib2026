name: One-shot A11 Five Cases
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/a11-five-cases.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Patch A11 to five cases
        run: python .github/scripts/a11_five_cases.py
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hw/A11.html
          git diff --cached --quiet && exit 0
          git commit -m "ui: streamline A11 to five progressive cases"
          git push origin dev
