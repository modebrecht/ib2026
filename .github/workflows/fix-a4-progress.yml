name: Fix A4 progress status
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/fix-a4-progress.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace A4 0/1 progress with clear status
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('hw/A4.html')
          s = p.read_text()

          old_open = '0 / 1 Praxis-Test absolviert'
          new_open = 'Praxis-Test noch offen'
          old_done = '1 / 1 Praxis-Test absolviert'
          new_done = 'Praxis-Test bestanden'

          if old_open not in s:
              raise SystemExit(f'Missing expected text: {old_open}')
          if old_done not in s:
              raise SystemExit(f'Missing expected text: {old_done}')

          s = s.replace(old_open, new_open, 1)
          s = s.replace(old_done, new_done, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/fix-a4-progress.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hw/A4.html .github/workflows/fix-a4-progress.yml
          git diff --cached --quiet || git commit -m 'Clarify A4 progress status'
          git push
