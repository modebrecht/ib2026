name: A1 choreography A4 A5
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/a1-choreography-a4-a5-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch
        run: python .github/scripts/a1_choreography_a4_a5.py
      - name: Verify
        run: |
          node --check tk2/a4Scenes.js
          python - <<'PY'
          from pathlib import Path
          s=Path('tk2/a4Scenes.js').read_text(encoding='utf-8')
          checks=[
            "if(mode==='newDoc')",
            "if(mode==='newTab')",
            "if(mode==='closeTab')",
            "if(mode==='reopenTab')",
            "if(mode==='addressBar')",
            "if(mode==='nextTab'||mode==='prevTab')",
            "fill 440ms ease",
            "transform 420ms ease,opacity 380ms ease",
            "stroke 380ms ease",
            "sceneLoopMs=cfg.family==='windows'?5600:LOOP_MS"
          ]
          for c in checks: assert c in s,c
          print('A1 choreography checks OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/a4Scenes.js
          git commit -m "tk2: apply A1 choreography to A4 and A5 scenes"
          git push origin dev
