name: Polish tasten favorites

on:
  push:
    paths:
      - '.github/workflows/polish-tasten-favorites-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply favorites polish
        run: python .github/scripts/polish_tasten_favorites.py
      - name: Check JavaScript
        run: |
          python -c "from pathlib import Path; import re; t=Path('tk2/tasten.html').read_text(encoding='utf-8'); Path('/tmp/tasten.js').write_text(re.search(r'<script>(.*)</script>', t, re.S).group(1), encoding='utf-8')"
          node --check /tmp/tasten.js
      - name: Verify favorites UI
        run: |
          grep -q 'favorite-bomb' tk2/tasten.html
          grep -q 'favorite-qr-head' tk2/tasten.html
          grep -q 'Large keycaps for Lernen + Favoriten' tk2/tasten.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/tasten.html
          git commit -m "tk2: enlarge learning keycaps and surface favorite QR"
          git push origin dev
