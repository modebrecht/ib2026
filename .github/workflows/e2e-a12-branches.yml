name: A12 Chromium QA - dev and render

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/e2e-a12-branches.yml
      - hw/A12.html
      - hw/assets/js/score-history.js
      - e2e/hw-a1-a14.spec.js
      - hw/A8.html
      - hw/A14.html
      - hw/assets/js/score-history.js
      - e2e/hw-a14-autosave.spec.js
      - e2e/hw-a7-a14-boundaries.spec.js
      - e2e/hw-score-history-fast.spec.js
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: a12-browser-qa
  cancel-in-progress: false

jobs:
  a12:
    name: A12 browser contract on ${{ matrix.branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        branch: [dev, render]
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/a12-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/hw/A12.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'A12 local HTTP server did not start'
          cat /tmp/a12-http.log
          exit 1

      - name: Run real A12 browser, PDF, autosave and history checks
        id: browser
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          npx playwright test e2e/hw-a1-a14.spec.js e2e/hw-score-history-fast.spec.js e2e/hw-persistence-contract.spec.js \
            --grep 'A12' --browser=chromium --workers=1 --reporter=line,html

      - name: Publish verifiable QA status on tested branch commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_BRANCH: ${{ matrix.branch }}
          QA_OUTCOME: ${{ steps.browser.outcome }}
          QA_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tested_sha="$(git rev-parse HEAD)"
          case "$QA_OUTCOME" in
            success) qa_state=success; qa_description="A12 Playwright Chromium passed on $QA_BRANCH" ;;
            *) qa_state=failure; qa_description="A12 Playwright Chromium failed or did not run on $QA_BRANCH" ;;
          esac
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$tested_sha" \
            -f "state=$qa_state" \
            -f "context=A12 Chromium ($QA_BRANCH)" \
            -f "description=$qa_description" \
            -f "target_url=$QA_URL"

      - name: Audit A7-A14 smoke tests
        id: hw_smoke
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          npx playwright test e2e/hw-a1-a14.spec.js --grep 'A(7|8|9|10|11|12|13|14):' --browser=chromium --workers=1 --reporter=line
      - name: Audit A7-A14 PDF boundaries
        id: hw_boundaries
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          npx playwright test e2e/hw-a7-a14-boundaries.spec.js --browser=chromium --workers=1 --reporter=line
      - name: A14 autosave and reload Chromium regression
        id: a14_autosave
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          npx playwright test e2e/hw-a14-autosave.spec.js --browser=chromium --workers=1 --reporter=line

      - name: Publish A7-A14 Chromium acceptance status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          QA_BRANCH: ${{ matrix.branch }}
          SMOKE_OUTCOME: ${{ steps.hw_smoke.outcome }}
          BOUNDARY_OUTCOME: ${{ steps.hw_boundaries.outcome }}
          AUTOSAVE_OUTCOME: ${{ steps.a14_autosave.outcome }}
          QA_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sha="$(git rev-parse HEAD)"
          if [ "$SMOKE_OUTCOME" = success ] && [ "$BOUNDARY_OUTCOME" = success ] && [ "$AUTOSAVE_OUTCOME" = success ]; then
            state=success
            description="A7-A14 smoke, PDF boundaries and A14 autosave passed on $QA_BRANCH"
          else
            state=failure
            description="A7-A14 smoke, PDF boundaries or A14 autosave failed on $QA_BRANCH"
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
            -f "state=$state" \
            -f "context=HW A7-A14 QA ($QA_BRANCH)" \
            -f "description=$description" \
            -f "target_url=$QA_URL"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a12-browser-${{ matrix.branch }}-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
            /tmp/a12-http.log
          if-no-files-found: ignore
          retention-days: 7
