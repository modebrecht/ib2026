name: Update root hardware labels
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update labels and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('Kabel, Schnittstellen &amp; passende Einsatzszenarien vertiefen','16 Anschlüsse aus A4 erkennen &amp; ihre Verwendung erklären')
          s=s.replace('A8: EVA-Prinzip, Speicher &amp; Kaufberatung','A8: Hardware anwenden &amp; vertiefen')
          s=s.replace('EVA-Zuordnung, RAM/SSD/HDD-Vergleich &amp; PC-Kaufberatung','EVA, Speicher, Kaufberatung &amp; Schnittstellen-Transfer')
          s=s.replace('10 Fragen zu den Kernkomponenten &ndash; Wissenstest','20 Fragen zu Komponenten &amp; Schnittstellen &ndash; Wissenstest')
          p.write_text(s)
          PY
          rm -f .github/workflows/update-root-hw-structure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/update-root-hw-structure.yml
          git diff --cached --quiet || git commit -m 'Align root labels with hardware worksheet structure'
          git push