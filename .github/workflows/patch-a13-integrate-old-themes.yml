name: One-shot A13 Theme Integration

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/patch-a13-integrate-old-themes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Integrate legacy Green IT themes
        run: python .github/scripts/patch_a13_integrate_old_themes.py

      - name: Commit A13 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hw/A13.html
          git commit -m "content: integrate full Green IT topic set into A13"
          git push origin HEAD:dev
