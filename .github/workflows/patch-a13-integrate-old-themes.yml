name: One-shot A13 Theme Integration

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/patch-a13-integrate-old-themes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Integrate all legacy Green IT themes into A13
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('hw/A13.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace('10 Szenarien', '14 Szenarien')
          text = text.replace('Entscheide bei 10 Alltagssituationen.', 'Entscheide bei 14 Alltagssituationen.')
          text = text.replace('1 / 10', '1 / 14')
          text = text.replace("const K='onedrive_a13_green_it_scenarios_9sek_v1',PASS=7,OK_MS=2300,WRONG_MS=3400;", "const K='onedrive_a13_green_it_scenarios_9sek_v2',PASS=10,OK_MS=2300,WRONG_MS=3400;")

          lifecycle = '''
<section class="surface rounded-[1.6rem] p-5 sm:p-6">
  <div class="flex items-start gap-3 mb-4">
    <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-emerald-500 to-sky-500 text-white flex items-center justify-center shrink-0"><i class="fa-solid fa-arrows-spin"></i></div>
    <div>
      <div class="text-[10px] uppercase font-black tracking-[.18em] text-emerald-600 dark:text-emerald-400">Der ganze Lebenszyklus zählt</div>
      <h2 class="text-lg sm:text-xl font-black mt-1">Von Rohstoffen bis Urban Mining</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Green IT betrachtet nicht nur den Stromverbrauch. Auch Rohstoffabbau, Herstellung, Nutzungsdauer, Reparatur, Wiederverwendung und Recycling gehören dazu.</p>
    </div>
  </div>
  <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">
    <div class="rounded-xl border border-amber-200 dark:border-amber-900/60 bg-amber-50/70 dark:bg-amber-950/20 p-3 text-center"><i class="fa-solid fa-mountain text-amber-600 text-lg"></i><div class="text-xs font-black mt-1">1 · Rohstoffe</div><div class="text-[10px] text-slate-500 mt-1">Metalle & kritische Rohstoffe</div></div>
    <div class="rounded-xl border border-violet-200 dark:border-violet-900/60 bg-violet-50/70 dark:bg-violet-950/20 p-3 text-center"><i class="fa-solid fa-industry text-violet-600 text-lg"></i><div class="text-xs font-black mt-1">2 · Herstellung</div><div class="text-[10px] text-slate-500 mt-1">Energie, Wasser, CO₂-Rucksack</div></div>
    <div class="rounded-xl border border-sky-200 dark:border-sky-900/60 bg-sky-50/70 dark:bg-sky-950/20 p-3 text-center"><i class="fa-solid fa-laptop text-sky-600 text-lg"></i><div class="text-xs font-black mt-1">3 · Nutzung</div><div class="text-[10px] text-slate-500 mt-1">Strom, Cloud & KI</div></div>
    <div class="rounded-xl border border-emerald-200 dark:border-emerald-900/60 bg-emerald-50/70 dark:bg-emerald-950/20 p-3 text-center"><i class="fa-solid fa-screwdriver-wrench text-emerald-600 text-lg"></i><div class="text-xs font-black mt-1">4 · Weiter nutzen</div><div class="text-[10px] text-slate-500 mt-1">Reparieren, aufrüsten, refurbished</div></div>
    <div class="rounded-xl border border-teal-200 dark:border-teal-900/60 bg-teal-50/70 dark:bg-teal-950/20 p-3 text-center col-span-2 sm:col-span-1"><i class="fa-solid fa-recycle text-teal-600 text-lg"></i><div class="text-xs font-black mt-1">5 · Recycling</div><div class="text-[10px] text-slate-500 mt-1">Urban Mining & Rückgewinnung</div></div>
  </div>
</section>
'''
          if 'Von Rohstoffen bis Urban Mining' not in text:
              marker = '<section id="quest"'
              if marker not in text:
                  raise SystemExit('quest marker missing')
              text = text.replace(marker, lifecycle + marker, 1)

          new_scenes = r'''
{id:'lifecycle',title:'Nur der Stromverbrauch zählt?',text:'Du willst beurteilen, wie nachhaltig ein Smartphone ist. Jemand schaut nur darauf, wie viel Strom es beim Laden braucht.',correct:'whole',why:'Zur Umweltwirkung gehört der ganze Lebenszyklus: Rohstoffe, Herstellung, Nutzung, Reparatur/Wiederverwendung und Recycling.',options:[{id:'charge',icon:'fa-plug-circle-bolt',title:'Nur das Laden betrachten',sub:'Herstellung und Entsorgung ignorieren'},{id:'whole',icon:'fa-arrows-spin',title:'Den ganzen Lebenszyklus betrachten',sub:'Von Rohstoffen bis Recycling'},{id:'price',icon:'fa-tag',title:'Nur auf den Kaufpreis schauen',sub:'Ökologische Folgen ausblenden'}]},
{id:'rawmaterials',title:'Im Smartphone stecken wertvolle Rohstoffe',text:'Gold, Kupfer, Lithium, Kobalt und weitere Rohstoffe müssen gewonnen und verarbeitet werden. Einige gelten als kritisch und ihre Gewinnung kann Menschen und Umwelt belasten.',correct:'responsible',why:'Lange Nutzung, Reparierbarkeit, verantwortungsvollere Lieferketten und korrektes Recycling verringern den Druck auf neue Rohstoffe.',options:[{id:'replace',icon:'fa-mobile-screen-button',title:'Möglichst oft ersetzen',sub:'Damit immer das neueste Modell da ist'},{id:'responsible',icon:'fa-earth-europe',title:'Lange nutzen + verantwortungsvoll beschaffen',sub:'Reparierbarkeit, Lieferkette und Recycling mitdenken'},{id:'drawer',icon:'fa-box-archive',title:'Altgeräte einfach sammeln',sub:'Wertstoffe bleiben ungenutzt in der Schublade'}]},
{id:'backpack',title:'Der ökologische Rucksack entsteht früh',text:'Ein funktionierendes Gerät soll ersetzt werden, obwohl es alle Aufgaben noch erfüllt. Bei der Herstellung wurden bereits Rohstoffe, Wasser und viel Energie eingesetzt.',correct:'longer',why:'Je länger ein geeignetes Gerät genutzt wird, desto länger verteilt sich der Herstellungsaufwand auf seine Nutzungszeit.',options:[{id:'yearly',icon:'fa-calendar-xmark',title:'Jährlich neu kaufen',sub:'Auch ohne technischen Grund'},{id:'longer',icon:'fa-hourglass-half',title:'Das Gerät länger nutzen',sub:'Herstellungsaufwand besser ausnutzen'},{id:'spare',icon:'fa-boxes-stacked',title:'Neues kaufen und altes lagern',sub:'Zwei Geräte besitzen, aber nur eines nutzen'}]},
{id:'datacenter',title:'Cloud und KI laufen nicht „in der Luft“',text:'Eine Klasse startet aus Spass immer wieder grosse KI-Aufgaben und lässt unnötige Cloud-Jobs weiterlaufen. Dahinter arbeiten Rechenzentren mit Servern, Kühlung und Stromversorgung.',correct:'purposeful',why:'Cloud- und KI-Dienste benötigen reale Rechenleistung in Rechenzentren. Sinnvolle Nutzung und unnötige Jobs vermeiden spart Ressourcen, ohne digitale Dienste grundsätzlich abzulehnen.',options:[{id:'endless',icon:'fa-repeat',title:'Alles beliebig oft wiederholen',sub:'Rechenaufwand spielt keine Rolle'},{id:'purposeful',icon:'fa-server',title:'Dienste gezielt und sinnvoll nutzen',sub:'Unnötige Berechnungen und Jobs vermeiden'},{id:'offline',icon:'fa-ban',title:'Cloud und KI komplett verbieten',sub:'Nur so sei Green IT möglich'}]}
'''
          if "id:'lifecycle'" not in text:
              total_pos = text.find('const TOTAL=SCENES.length;')
              if total_pos < 0:
                  raise SystemExit('TOTAL marker missing')
              end = text.rfind('];', 0, total_pos)
              if end < 0:
                  raise SystemExit('SCENES end missing')
              text = text[:end] + ',\n' + new_scenes + text[end:]

          text = text.replace('Elektrogeräte gehören in die Rückgabe- oder Sammelstelle, damit Rohstoffe zurückgewonnen werden können.', 'Elektrogeräte gehören in die Rückgabe- oder Sammelstelle. Beim Urban Mining können Metalle und andere Wertstoffe aus Altgeräten zurückgewonnen werden.')
          text = text.replace('Ein Gerät passend zum Bedarf verbraucht bei Herstellung und Betrieb meist weniger Ressourcen als unnötige High-End-Hardware.', 'Nachhaltige IT-Beschaffung bedeutet: passend dimensionieren, lange Nutzungsdauer, Reparierbarkeit und ausreichende Software-Unterstützung statt unnötiger High-End-Hardware.')

          art_insert = r'''lifecycle:`<ellipse cx="220" cy="222" rx="157" ry="13" fill="#0f172a" opacity=".1"/><g class="pulse"><circle cx="220" cy="124" r="67" fill="#dcfce7" stroke="#22c55e" stroke-width="4"/><path d="M220 69a55 55 0 0 1 47 27" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/><path d="M263 86l14 17-22 3Z" fill="#16a34a"/><path d="M267 151a55 55 0 0 1-47 28" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/><path d="M229 181l-20 8 5-21Z" fill="#0ea5e9"/><path d="M173 151a55 55 0 0 1 0-54" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/><path d="M169 102l-4-21 20 8Z" fill="#f59e0b"/></g><g class="float"><circle cx="91" cy="81" r="27" fill="#fef3c7"/><path d="M73 97l18-35 18 35Z" fill="#b45309"/></g><g class="float d2"><circle cx="349" cy="83" r="27" fill="#ede9fe"/><path d="M334 96h30V72h-30Z" fill="#7c3aed"/><path d="M340 72V61h5v11M353 72V57h5v15" stroke="#7c3aed" stroke-width="4"/></g><g class="float d3"><circle cx="351" cy="181" r="27" fill="#dbeafe"/><path d="M338 168h26v23h-26Z" fill="#2563eb"/><path d="M344 164h14" stroke="#2563eb" stroke-width="5"/></g>`,
rawmaterials:`<ellipse cx="220" cy="222" rx="156" ry="13" fill="#0f172a" opacity=".1"/><path d="M49 190l68-123 65 123Z" fill="#92400e"/><path d="M89 190l56-95 53 95Z" fill="#b45309" opacity=".88"/><g class="float"><circle cx="104" cy="151" r="12" fill="#f59e0b"/><circle cx="135" cy="139" r="10" fill="#fde68a"/><circle cx="157" cy="165" r="9" fill="#64748b"/></g><rect x="250" y="50" width="126" height="165" rx="24" fill="#172033"/><rect x="263" y="66" width="100" height="118" rx="13" fill="#eff6ff"/><g class="pulse"><circle cx="313" cy="125" r="39" fill="#dcfce7"/><path d="M313 98c-26 16-31 51 0 62 31-11 26-46 0-62Z" fill="#22c55e"/><path d="M313 112v36M313 129l17-12M313 136l-15-10" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g><circle cx="313" cy="199" r="5" fill="#64748b"/>`,
backpack:`<ellipse cx="220" cy="222" rx="154" ry="13" fill="#0f172a" opacity=".1"/><g class="float"><path d="M78 91c0-25 20-45 45-45s45 20 45 45v105H78Z" fill="#7c3aed"/><rect x="91" y="103" width="64" height="61" rx="13" fill="#ede9fe"/><path d="M99 73c8-28 41-28 49 0" fill="none" stroke="#c4b5fd" stroke-width="10" stroke-linecap="round"/></g><g class="pulse"><circle cx="123" cy="134" r="24" fill="#fff"/><text x="123" y="142" text-anchor="middle" font-size="21" font-weight="900" fill="#7c3aed">CO₂</text></g><rect x="229" y="62" width="151" height="139" rx="22" fill="#172033"/><rect x="244" y="77" width="121" height="99" rx="11" fill="#dbeafe"/><g class="battery-fill"><rect x="262" y="103" width="84" height="39" rx="8" fill="#22c55e"/></g><path d="M286 93h37" stroke="#64748b" stroke-width="5" stroke-linecap="round"/><circle cx="305" cy="188" r="5" fill="#94a3b8"/>`,
datacenter:`<ellipse cx="220" cy="222" rx="157" ry="13" fill="#0f172a" opacity=".1"/><g><rect x="57" y="53" width="104" height="151" rx="15" fill="#172033"/><rect x="70" y="70" width="78" height="28" rx="6" fill="#334155"/><rect x="70" y="108" width="78" height="28" rx="6" fill="#334155"/><rect x="70" y="146" width="78" height="28" rx="6" fill="#334155"/><g class="pulse" fill="#22c55e"><circle cx="137" cy="84" r="4"/><circle cx="137" cy="122" r="4"/><circle cx="137" cy="160" r="4"/></g></g><g><rect x="181" y="53" width="104" height="151" rx="15" fill="#172033"/><rect x="194" y="70" width="78" height="28" rx="6" fill="#334155"/><rect x="194" y="108" width="78" height="28" rx="6" fill="#334155"/><rect x="194" y="146" width="78" height="28" rx="6" fill="#334155"/><path class="dash" d="M203 83h59M203 121h59M203 159h59" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/></g><g class="spin"><circle cx="343" cy="104" r="44" fill="#dbeafe"/><circle cx="343" cy="104" r="11" fill="#2563eb"/><path d="M343 66c12 10 18 22 12 33-11 3-22-1-32-12 2-10 8-17 20-21ZM381 104c-10 12-22 18-33 12-3-11 1-22 12-32 10 2 17 8 21 20ZM343 142c-12-10-18-22-12-33 11-3 22 1 32 12-2 10-8 17-20 21ZM305 104c10-12 22-18 33-12 3 11-1 22-12 32-10-2-17-8-21-20Z" fill="#60a5fa"/></g><g class="float d2"><path d="M317 174c0-18 15-33 33-33 11 0 20 5 26 13 5-5 12-8 19-8 15 0 27 12 27 27 0 1 0 3-.2 4 15 1 26 13 26 28H302c0-15 11-27 25-29-6-4-10-12-10-22Z" fill="#fff" opacity=".92"/></g>` ,
'''
          if 'rawmaterials:`' not in text:
              marker = 'repair:`'
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit('art repair marker missing')
              text = text[:pos] + art_insert + text[pos:]

          required = ["id:'lifecycle'", "id:'rawmaterials'", "id:'backpack'", "id:'datacenter'", '14 Szenarien', 'Von Rohstoffen bis Urban Mining', 'Urban Mining', 'PASS=10']
          for item in required:
              if item not in text:
                  raise SystemExit('validation missing: ' + item)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit A13 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hw/A13.html
          git commit -m "content: integrate full Green IT topic set into A13"
          git push origin HEAD:dev
