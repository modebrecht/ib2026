name: A3 Main Production Smoke
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/a3-main-smoke-once.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://ib2026.vercel.app
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Run A3 production smoke
        run: npx playwright test e2e/tk-a1-a6.spec.js --browser=chromium --workers=1 --reporter=line --grep "A3:"
