name: Unify tasten keycaps

on:
  push:
    paths:
      - '.github/workflows/unify-tasten-keycaps-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply unified keycaps
        run: python .github/scripts/unify_tasten_keycaps.py
      - name: Check JavaScript
        run: |
          python -c "from pathlib import Path; import re; t=Path('tk2/tasten.html').read_text(encoding='utf-8'); Path('/tmp/tasten.js').write_text(re.search(r'<script>(.*)</script>', t, re.S).group(1), encoding='utf-8')"
          node --check /tmp/tasten.js
      - name: Verify no legacy key markup
        run: |
          ! grep -q '<kbd>' tk2/tasten.html
          grep -q 'function keyMarkup(s){return challengeKeyMarkup(s)}' tk2/tasten.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/tasten.html
          git commit -m "tk2: use physical keycaps throughout tasten trainer"
          git push origin dev
