name: A4 Reset Repair
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/a4-reset-repair-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch
        run: python .github/scripts/a4_reset_repair.py
      - name: Verify
        run: |
          node --check tk2/a4Scenes.js
          node --check tk2/sceneKeycaps.js
          grep -q "var CHORD_HOLD_MS=800;" tk2/sceneKeycaps.js
          git diff --exit-code -- tk2/sceneKeycaps.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('tk2/a4Scenes.js').read_text(encoding='utf-8')
          resize=s[s.index('function createWindowResizeScene'):s.index('function createA4Scene')]
          m=re.search(r"function reset\(\)\{(.*?)\}\n    function applyEnd",resize,re.S)
          assert m and 'resetMany(keys)' in m.group(1)
          assert "$('." not in m.group(1) and 'mode===' not in m.group(1)
          main=s[s.index('function createA4Scene'):]
          assert 'page-content-alt' in main and 'doc-dim' in main and 'function switchPage' in main
          assert "sceneLoopMs=cfg.family==='windows'?5600:(isA4Mode?4600:LOOP_MS)" in main
          print('Runtime reset scopes OK; 800ms chord hold preserved')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/a4Scenes.js
          git commit -m "tk2: repair scene reset scopes after premium pass"
          git push origin dev
