name: A3 red invalid inputs
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/a3-red-invalid-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch
        run: python .github/scripts/a3_red_invalid.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('tk2/A3.html').read_text(encoding='utf-8')
          j=Path('tk2/a3-app.js').read_text(encoding='utf-8')
          assert '.choice-row input.is-invalid' in h
          assert "syncChoiceValidation(progress);" in j
          assert "classList.toggle('is-invalid'" in j
          print('A3 red validation checks OK')
          PY
          node --check tk2/a3-app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/A3.html tk2/a3-app.js
          git commit -m "tk2: mark invalid A3 inputs red"
          git push origin dev
