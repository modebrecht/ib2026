name: A5 Premium Pass 2
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/a5-premium-pass-2-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch
        run: python .github/scripts/a5_premium_pass_2.py
      - name: Verify
        run: |
          node --check tk2/a4Scenes.js
          node --check tk2/sceneKeycaps.js
          grep -q "var CHORD_HOLD_MS=800;" tk2/sceneKeycaps.js
          git diff --exit-code -- tk2/sceneKeycaps.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('tk2/a4Scenes.js').read_text(encoding='utf-8')
          checks=[
            'class="snip-toolbar"',
            'class="snip-cursor"',
            'class="snip-confirm"',
            'class="switch-focus"',
            'class="switch-c"',
            'class="snap-zone snap-zone-left"',
            'class="resize-guide"',
            "focus.setAttribute('transform','translate(82 0)')",
            "browser.setAttribute('transform','translate(18 8) scale(.96)')",
            "later(actionAt-180,function()",
            "later(5600,function(){running=false;if(active&&autoLoop)run();})",
            'window.tk2SceneKeycaps.pressSequence'
          ]
          for c in checks: assert c in s,c
          resize=s[s.index('function createWindowResizeScene'):s.index('function createA4Scene')]
          m=re.search(r"function reset\(\)\{(.*?)\}\n    function applyEnd",resize,re.S)
          assert m and 'resetMany(keys)' in m.group(1)
          assert "$('." not in m.group(1) and 'mode===' not in m.group(1)
          print('A5 premium pass 2 checks OK; 800ms chord hold preserved')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/a4Scenes.js
          git commit -m "tk2: finish A5 premium animation pass"
          git push origin dev
