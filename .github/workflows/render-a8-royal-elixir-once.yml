name: One-shot render A8 Königselixier regression

on:
  push:
    branches:
      - render
    paths:
      - '.github/workflows/render-a8-royal-elixir-once.yml'

permissions:
  contents: read

jobs:
  royal-elixir:
    name: A8 Königselixier one-use regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Build exact render bundle
        run: bash scripts/build-vercel-site.sh
      - name: Serve bundle
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/a8-elixir-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/dist/tk2/A8/ >/dev/null && exit 0
            sleep .5
          done
          cat /tmp/a8-elixir-http.log
          exit 1
      - name: Verify Königselixier is consumed exactly once
        run: |
          mkdir -p .qa-runtime
          cat > .qa-runtime/royal-elixir.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const errors = [];
          page.on('pageerror', error => errors.push(String(error?.stack || error)));

          try {
            await page.goto('http://127.0.0.1:4173/dist/tk2/A8/', { waitUntil: 'networkidle' });
            await page.waitForFunction(() => window.SHORTCUT_QUEST_BATTLE_BALANCE?.installed === true);

            await page.evaluate(() => {
              const sections = {};
              for (let i = 1; i <= 30; i += 1) sections[String(i)] = 1;
              const clears = {};
              for (let i = 1; i <= 10; i += 1) clears[String(i)] = true;
              state.sectionClears = sections;
              state.battleClears = clears;
              state.battleUnlocked = 11;
              state.skills = [];
              state.coins = 0;
              saveState();
              updateUI();
              renderBattleButtons();
            });

            await page.locator('.nav-toggle[data-view="battle"]').click();
            await page.waitForFunction(() => document.getElementById('battleView')?.classList.contains('active'));
            await page.locator('#battleButtons .battle-btn[data-enemy="11"]').click();
            await page.locator('#battleStartBtn').click();
            await page.waitForFunction(() => window.SHORTCUT_QUEST_BATTLE_ENGINE_V2?.phase === 'fighting');

            await page.evaluate(() => {
              currentBattleContext.hero.maxHp = 5000;
              currentBattleContext.hero.hp = 5000;
              currentBattleContext.hero.def = 999;
              currentBattleContext.hero.atk = 1;
              currentBattleContext.enemy.hp = 300;
              currentBattleContext.enemy.crit = 0;
            });

            await page.waitForFunction(() => currentBattleContext.enemy.item?.used === true, null, { timeout: 7000 });
            const afterHeal = await page.evaluate(() => ({
              hp: currentBattleContext.enemy.hp,
              used: currentBattleContext.enemy.item.used,
              useCount: currentBattleContext.enemy.item.useCount,
              logs: Array.from(document.querySelectorAll('#battleLog > *, .battle-log > *'))
                .filter(node => /Königselixier/.test(node.textContent || '')).length
            }));
            assert.equal(afterHeal.used, true);
            assert.equal(afterHeal.useCount, 1, 'Königselixier must have useCount 1 immediately after heal');
            assert.ok(afterHeal.hp > 300, `Königselixier must heal above 300 HP, got ${afterHeal.hp}`);

            await page.waitForTimeout(3200);
            const later = await page.evaluate(() => ({
              useCount: currentBattleContext.enemy.item.useCount,
              logs: Array.from(document.querySelectorAll('#battleLog > *, .battle-log > *'))
                .filter(node => /Königselixier/.test(node.textContent || '')).length
            }));
            assert.equal(later.useCount, 1, 'Consumed Königselixier must never increment useCount again');
            assert.equal(later.logs, afterHeal.logs, 'Consumed Königselixier must not create later fake item events');
            assert.deepEqual(errors, [], `Uncaught browser errors: ${errors.join(' | ')}`);
            console.log('KÖNIGSELIXIER REGRESSION OK', { afterHeal, later });
          } finally {
            await browser.close();
          }
          NODE
          node .qa-runtime/royal-elixir.mjs
