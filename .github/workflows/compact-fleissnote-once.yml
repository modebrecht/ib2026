name: Compact Fleissnote copy once

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/compact-fleissnote-once.yml'

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Compact Fleissnote copy
        run: python3 scripts/compact_fleissnote_once.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tk2/index.html
          git commit -m "Compact HW and TK2 Fleissnote copy"
          git push origin dev
