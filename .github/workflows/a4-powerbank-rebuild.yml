name: A4 powerbank asset rebuild
# one-time trigger

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  rebuild:
    if: contains(github.event.head_commit.message, '[a4-powerbank-rebuild]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Install Pillow
        run: python3 -m pip install --quiet Pillow

      - name: Rebuild only the A4 Powerbank WebP with the repository HQ script
        shell: bash
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          mkdir -p "$WORK/hw/assets/hq"
          cp hw/create_hq_webp.py "$WORK/hw/create_hq_webp.py"
          cp hw/assets/hq/hq-micro-usb-powerbank.jpg "$WORK/hw/assets/hq/hq-micro-usb-powerbank.jpg"
          (
            cd "$WORK"
            python3 hw/create_hq_webp.py --max-width 1376 --quality 95
          )
          cp "$WORK/hw/assets/hq-micro-usb-powerbank.webp" hw/assets/hq-micro-usb-powerbank.webp
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          p = Path('hw/assets/hq-micro-usb-powerbank.webp')
          with Image.open(p) as image:
              assert image.format == 'WEBP', image.format
              assert image.width >= 1200, image.size
              assert image.height >= 800, image.size
          assert p.stat().st_size > 100_000, p.stat().st_size
          print('Verified:', image.size, p.stat().st_size, 'bytes')
          PY

      - name: Commit clean result and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/a4-powerbank-rebuild.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hw/assets/hq-micro-usb-powerbank.webp
          git commit -m 'Fix A4 Micro-USB powerbank image'
          git push origin HEAD:dev
