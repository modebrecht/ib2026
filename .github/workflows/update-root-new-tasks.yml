name: One-shot Root A10-A14 Update
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/update-root-new-tasks.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Update root index
        run: python .github/scripts/update_root_new_tasks.py
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "ui: update root index for A10-A14"
          git push origin dev
