name: Unify TK2 theory cards
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/unify-tk2-theory-cards-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch
        run: python .github/scripts/unify_tk2_theory_cards.py
      - name: Verify
        run: |
          node --check tk2/theoryCards.js
          node --check tk2/a4-app.js
          node --check tk2/a5-app.js
          node --check tk2/a4Scenes.js
          python - <<'PY'
          from pathlib import Path
          import re
          for f in ['A1.html','A4.html','A5.html']:
              s=Path('tk2/'+f).read_text(encoding='utf-8')
              assert 'theoryCards.css' in s
              assert 'theoryCards.js' in s
          for f in ['a4-app.js','a5-app.js']:
              s=Path('tk2/'+f).read_text(encoding='utf-8')
              assert 'window.tk2TheoryCards.mount' in s
              block=re.search(r'function renderTheory\(\).*?function showFiftyFifty',s,re.S).group(0)
              assert 'lesson-anim-card' not in block
              assert 'IntersectionObserver' not in block
          a1=Path('tk2/A1.html').read_text(encoding='utf-8')
          assert "window.tk2TheoryCards.mount" in a1
          assert "window.tk2SetTheoryActive=function(value){theoryController.setActive(value);};" in a1
          print('shared theory component checks OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/A1.html tk2/A4.html tk2/A5.html tk2/a4-app.js tk2/a5-app.js
          git commit -m "tk2: unify A1 A4 A5 theory cards"
          git push origin dev
