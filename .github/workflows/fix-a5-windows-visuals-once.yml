name: Fix A5 Windows visuals
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fix-a5-windows-visuals-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch
        run: python .github/scripts/fix_a5_windows_visuals.py
      - name: Verify
        run: |
          node --check tk2/a4Scenes.js
          node --check tk2/sceneKeycaps.js
          grep -q "var CHORD_HOLD_MS=800;" tk2/sceneKeycaps.js
          git diff --exit-code -- tk2/sceneKeycaps.js
          python - <<'PY'
          from pathlib import Path
          s=Path('tk2/a4Scenes.js').read_text(encoding='utf-8')
          assert "Math.min(.78,196/keyRowWidth)" in s
          assert "keyX=536-keyRowWidth*keyScale" in s
          assert "sceneDecoration=cfg.family==='windows'?'':" in s
          assert '<circle cx="310" cy="76" r="74"' not in s
          assert '<circle cx="315" cy="83" r="94"' not in s
          assert 'translate(-132 -42) scale(1.55 1.48)' in s
          assert '<rect x="40" y="40" width="345" height="235"' in s
          # All known 3-key utility combinations stay within x<=536.
          combos=[['Ctrl','Shift','T'],['Ctrl','Shift','Tab'],['Win','Shift','S'],['Ctrl','Shift','Esc']]
          def w(k): return 68 if k=='Ctrl' else (70 if len(k)>2 else 48)
          for keys in combos:
            row=sum(w(k) for k in keys)+26*(len(keys)-1)
            scale=min(.78,196/row)
            left=536-row*scale
            right=left+row*scale
            assert left>=300 and right<=536.0001,(keys,left,right)
          print('A5 visual checks OK; all 3-key rows fit; maximize stays in desktop; 800ms preserved')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/a4Scenes.js
          git commit -m "tk2: fix A5 circles, three-key rows and maximize bounds"
          git push origin dev
