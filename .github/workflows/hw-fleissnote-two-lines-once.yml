name: HW Fleissnote wording once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/hw-fleissnote-two-lines-once.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Refine max points wording
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '<div>Maximal 2 P pro A-Aufgabe</div>'
          new = '<div>Maximal 2 P pro Aufgabe</div>'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one match, found {count}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine HW Fleissnote wording"
          git push origin dev
