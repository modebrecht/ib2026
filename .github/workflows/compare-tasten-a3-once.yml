name: Extract A3 PDF and tasten data

on:
  push:
    paths:
      - '.github/workflows/compare-tasten-a3-once.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Extract comparison data
        run: |
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pathlib import Path
          import json, re
          from pypdf import PdfReader

          pdf = Path('tk2/Tastenkombinationen_Theorie.pdf')
          html = Path('tk2/tasten.html').read_text(encoding='utf-8')

          reader = PdfReader(str(pdf))
          pdf_text = '\n\n--- PAGE ---\n\n'.join((p.extract_text() or '') for p in reader.pages)

          m = re.search(r'const shortcuts\s*=\s*(\[.*?\]);\s*const i18n', html, re.S)
          if not m:
              raise SystemExit('Could not locate shortcuts array')
          shortcuts = json.loads(m.group(1))

          lines = []
          lines.append(f'PDF_PAGES={len(reader.pages)}')
          lines.append(f'SHORTCUT_COUNT={len(shortcuts)}')
          lines.append('\n=== SHORTCUTS IN TASTEN.HTML ===')
          for s in shortcuts:
              title = s.get('title', {}).get('de', '')
              keys = ' + '.join(s.get('keys', []))
              cat = s.get('cat', '')
              lines.append(f'{keys}\t{title}\t[{cat}]')
          lines.append('\n=== PDF TEXT ===')
          lines.append(pdf_text)
          Path('tk2/_a3_compare_extract.txt').write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Commit extract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/_a3_compare_extract.txt
          git commit -m "chore: extract A3 comparison data"
          git push origin HEAD:dev
