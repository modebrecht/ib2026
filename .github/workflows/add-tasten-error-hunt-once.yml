name: Add tasten Fehlerjagd
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/add-tasten-error-hunt-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Apply Fehlerjagd
        run: |
          sed -i "/^for marker in /,/^    pass$/d" .github/scripts/add_tasten_error_hunt.py
          python .github/scripts/add_tasten_error_hunt.py
      - name: Check JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('tk2/tasten.html').read_text()
          js=s.rsplit('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/tasten.js').write_text(js)
          PY
          node --check /tmp/tasten.js
      - name: Verify Fehlerjagd
        run: |
          grep -q 'data-view="hunt"' tk2/tasten.html
          grep -q 'id="view-hunt"' tk2/tasten.html
          grep -q 'id="huntCategory"' tk2/tasten.html
          grep -q "'huntCategory'" tk2/tasten.html
          grep -q 'function gradeHunt' tk2/tasten.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tk2/tasten.html
          git commit -m 'tk2: add Fehlerjagd game mode' || exit 0
          git push origin HEAD:dev
