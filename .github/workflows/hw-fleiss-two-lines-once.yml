name: HW Fleissnote two lines once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/hw-fleiss-two-lines-once.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Split HW Fleissnote max line
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '<div style="margin-top: 6px; color: var(--muted);">Maximal 2 P pro A-Aufgabe · A1–A14 = maximal 28 P.</div>'
          new = '<div style="margin-top: 6px; color: var(--muted);"><div>Maximal 2 P pro A-Aufgabe</div><div>A1–A14 = maximal 28 P</div></div>'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one max-points line, found {count}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Split HW Fleissnote max points into two lines"
          git push origin dev
