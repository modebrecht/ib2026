name: E2E Smoke TK A1-A7

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Vercel production base URL
        required: true
        default: https://ib2026.vercel.app
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-smoke-tk-a1-a7
  cancel-in-progress: false

jobs:
  smoke:
    name: Chromium smoke TK A1-A7
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ inputs.base_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Run TK A1-A7 production smoke
        run: npx playwright test e2e/tk-a1-a7.spec.js --browser=chromium --workers=1 --reporter=line,html

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-tk-a1-a7-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
