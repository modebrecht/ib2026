name: Align A4 A5 scene geometry
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/align-a4-a5-scene-geometry-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch
        run: python .github/scripts/align_a4_a5_scene_geometry.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('tk2/a4Scenes.js').read_text(encoding='utf-8')
          a5=Path('tk2/A5.html').read_text(encoding='utf-8')
          assert 'viewBox=\\"0 0 680 320\\"' not in s
          assert s.count('viewBox=\\"0 0 560 320\\"') >= 2
          assert 'keyX=Math.max(404,540-window.tk2SceneKeycaps.rowWidth(cfg.keys,keyProfile))' in s
          assert 'transform=\\"translate(404 225)\\"' in s
          assert 'transform=\\"translate(392 20)\\"' in s
          assert '<script src="a4Scenes.js"></script>' in a5
          print('A4/A5 geometry checks OK')
          PY
          node --check tk2/a4Scenes.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/a4Scenes.js
          git commit -m "tk2: align A4 A5 scenes with A1 geometry"
          git push origin dev
