name: Fix A5 circle 3keys maximize
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fix-a5-circle-3keys-maximize-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch
        run: python .github/scripts/fix_a5_circle_3keys_maximize.py
      - name: Verify
        run: |
          node --check tk2/a4Scenes.js
          node --check tk2/sceneKeycaps.js
          grep -q "var CHORD_HOLD_MS=800;" tk2/sceneKeycaps.js
          git diff --exit-code -- tk2/sceneKeycaps.js
          python - <<'PY'
          from pathlib import Path
          s=Path('tk2/a4Scenes.js').read_text(encoding='utf-8')
          assert "keyX=552-keyRowWidth" in s
          assert "keyScale=" not in s
          assert "scale('+keyScale+')" not in s
          assert 'circle cx="310" cy="76" r="74"' not in s
          assert 'circle cx="315" cy="83" r="94"' not in s
          assert s.count("translate(win,'translate(-126 -35) scale(1.51 1.25)')")==2
          for keys in ["keys:['Win','Shift','S']","keys:['Ctrl','Shift','Esc']","keys:['Ctrl','Shift','Tab']"]:
              assert keys in s, keys
          print('A5 visual regression checks OK; 800ms key hold preserved')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/a4Scenes.js
          git commit -m "tk2: fix A5 circles, three-key rows, and maximize bounds"
          git push origin dev
