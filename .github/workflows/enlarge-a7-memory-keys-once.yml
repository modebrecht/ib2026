name: Enlarge A7 memory keys
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/enlarge-a7-memory-keys-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Patch
        run: python .github/scripts/enlarge_a7_memory_keys.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('tk2/A7.html').read_text(encoding='utf-8')
          assert '⌨️' not in s
          assert 'mem-term-emoji' not in s
          assert 'key-count-${Math.min(3,c.shortcut.keys.length)}' in s
          assert 'font-size:clamp(1rem,calc(var(--card-text,15px)*1.32),1.55rem)' in s
          assert '.mem-desc-text.key-count-3 kbd' in s
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          assert scripts
          Path('/tmp/a7.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('A7 memory key sizing checks OK')
          PY
          node --check /tmp/a7.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tk2/A7.html
          git commit -m "tk2: enlarge A7 memory keycaps"
          git push origin dev
