name: One-shot Green IT A13 A14 Split
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/split-green-it-a13-a14.yml
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Build A13 and A14
        run: python .github/scripts/split_green_it_a13_a14.py
      - name: Commit split
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hw/A13.html hw/A14.html index.html
          git diff --cached --quiet && exit 0
          git commit -m "content: split Green IT into A13 learning and A14 challenge"
          git push origin dev
