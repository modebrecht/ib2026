name: Fleissnote Punkte ausschreiben once

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fleissnote-points-wording-once.yml'

permissions:
  contents: write

jobs:
  wording:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Write Punkte out in HW and TK2
        run: |
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              'index.html': {
                  '<div><strong>1 P</strong> = PDF im OneDrive-Ordner <strong>IB</strong> · Dateiname immer <strong>A1.PDF, A2.PDF, …</strong></div>': '<div><strong>1 Punkt</strong> = PDF im OneDrive-Ordner <strong>IB</strong> · Dateiname immer <strong>A1.PDF, A2.PDF, …</strong></div>',
                  '<div>Maximal 2 P pro Aufgabe</div>': '<div>Maximal 2 Punkte pro Aufgabe</div>',
                  '<div>A1–A14 = maximal 28 P</div>': '<div>A1–A14 = maximal 28 Punkte</div>',
              },
              'tk2/index.html': {
                  '<p><strong>1 P</strong> = Abgabe / Nachweis im OneDrive-Ordner <strong>IB</strong> (einmal mit der Lehrperson teilen). Bei <strong>100 % Genauigkeit</strong> gibt es einen vollen Zusatzpunkt. Sonst wird der Zusatzpunkt anteilig berechnet.</p>': '<p><strong>1 Punkt</strong> = Abgabe / Nachweis im OneDrive-Ordner <strong>IB</strong> (einmal mit der Lehrperson teilen). Bei <strong>100 % Genauigkeit</strong> gibt es einen vollen Zusatzpunkt. Sonst wird der Zusatzpunkt anteilig berechnet.</p>',
                  '<span>Max. 2 P pro Quest · Q1–Q14 = max. 28 P</span>': '<span>Max. 2 Punkte pro Quest · Q1–Q14 = max. 28 Punkte</span>',
              },
          }

          for path, mapping in replacements.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:80]}')
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tk2/index.html
          git commit -m "Write Fleissnote points out in full"
          git push origin dev
