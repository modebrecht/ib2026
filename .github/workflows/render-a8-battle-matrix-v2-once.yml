name: One-shot render A8 all-ranks battle matrix v2

on:
  push:
    branches:
      - render
    paths:
      - '.github/workflows/render-a8-battle-matrix-v2-once.yml'

permissions:
  contents: read

jobs:
  all-ranks:
    name: A8 ranks 1-11 + enemy items + rewards v2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Build exact render production bundle
        run: bash scripts/build-vercel-site.sh
      - name: Prepare matrix script in repo module context
        run: |
          mkdir -p .qa-runtime
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/render-a8-battle-matrix-once.yml').read_text(encoding='utf-8')
          start_marker = "cat > /tmp/a8-rank-matrix.mjs <<'NODE'\n"
          end_marker = "\n          NODE\n          node /tmp/a8-rank-matrix.mjs"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          Path('.qa-runtime/a8-rank-matrix.mjs').write_text(textwrap.dedent(source[start:end]), encoding='utf-8')
          PY
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/a8-matrix-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/dist/tk2/A8/ >/dev/null && exit 0
            sleep .5
          done
          cat /tmp/a8-matrix-http.log
          exit 1
      - name: Verify all 11 ranks and enemy-item behavior
        run: node .qa-runtime/a8-rank-matrix.mjs
      - name: Server log on failure
        if: failure()
        run: cat /tmp/a8-matrix-http.log || true
