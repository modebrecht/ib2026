name: Temp A6 Header
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/temp-a6-header.yml']
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Align A6 header shell to A9
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hw/A6.html')
          s=p.read_text()
          old_variants=[
            'sticky top-0 z-50 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm',
            'sticky top-0 z-50 bg-white/88 dark:bg-slate-900/88 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800 shadow-sm',
            'sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm',
          ]
          new='sticky top-0 z-40 bg-white/88 dark:bg-slate-900/9 backdrop-blur-xl border-b border-slate-200/80 dark:border-slate-800'
          for old in old_variants:
              if old in s:
                  s=s.replace(old,new,1)
                  p.write_text(s)
                  print('A6 header aligned')
                  break
          else:
              raise SystemExit('Expected A6 header class not found')
          PY
      - name: Commit A6 header and remove temporary workflow
        run: |
          rm .github/workflows/temp-a6-header.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hw/A6.html .github/workflows/temp-a6-header.yml
          git commit -m 'fix(A6): align header with A9'
          git push origin dev
