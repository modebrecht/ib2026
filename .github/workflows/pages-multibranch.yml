name: GitHub Pages Multi-Branch

on:
  push:
    branches:
      - main
      - dev
      - render
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-multibranch
  cancel-in-progress: true

jobs:
  build:
    name: Build main + dev + render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch publishing branches
        run: |
          git fetch --no-tags --depth=1 origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/dev:refs/remotes/origin/dev \
            +refs/heads/render:refs/remotes/origin/render

      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site/dev _site/render

          # Production at the Pages root.
          git archive refs/remotes/origin/main | tar -x -C _site

          # Branch previews below their own paths.
          git archive refs/remotes/origin/dev | tar -x -C _site/dev
          git archive refs/remotes/origin/render | tar -x -C _site/render

          # TK2 A8 review build: inject the pinned Shortcut Quest 2026 runtime
          # into DEV only so classroom review stays deterministic.
          SHORTCUT_QUEST_SHA="6193079dd297e67d54190f8a58c67c46b40517d4"
          rm -rf /tmp/shortcut-quest-a8
          git init -q /tmp/shortcut-quest-a8
          git -C /tmp/shortcut-quest-a8 remote add origin https://github.com/modebrecht/shortcut-quest.git
          git -C /tmp/shortcut-quest-a8 fetch -q --depth=1 origin "$SHORTCUT_QUEST_SHA"
          git -C /tmp/shortcut-quest-a8 checkout -q --detach FETCH_HEAD
          mkdir -p _site/dev/tk2/A8
          cp /tmp/shortcut-quest-a8/2026/index.html _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/sections-data.js _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/skill-hotkeys.js _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/modern-ui.css _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/modern-exercises.css _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/modern-game.css _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/modern-battle.css _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/modern-report.css _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/apexcharts.min.js _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/favicon.svg _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/premium-motion.js _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/battle-motion.js _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/arena-dev-fix.js _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/arena-dev-tuning.css _site/dev/tk2/A8/
          cp -R /tmp/shortcut-quest-a8/2026/assets _site/dev/tk2/A8/

          # IB2026-only A8 diagnostic PDF overlay.
          cp _site/dev/tk2/a8-pdf-report.js _site/dev/tk2/A8/pdf-report.js
          python3 - <<'PY'
          from pathlib import Path

          # Classroom filename: A8-VORNAME.pdf
          pdf_path = Path('_site/dev/tk2/A8/pdf-report.js')
          pdf_js = pdf_path.read_text(encoding='utf-8')
          old_name = "doc.save('A8_Shortcut_Quest_Lernnachweis_' + safeFileName(student) + '.pdf');"
          new_name = "doc.save('A8-' + safeFileName(student) + '.pdf');"
          if old_name not in pdf_js:
              raise SystemExit('A8 PDF filename marker not found')
          pdf_path.write_text(pdf_js.replace(old_name, new_name, 1), encoding='utf-8')

          path = Path('_site/dev/tk2/A8/index.html')
          html = path.read_text(encoding='utf-8')
          arena_style = '<link rel="stylesheet" href="arena-dev-tuning.css?v=6193079d">'
          scripts = [
              '<script src="premium-motion.js"></script>',
              '<script src="battle-motion.js"></script>',
              '<script src="arena-dev-fix.js?v=59809da9"></script>',
              '<script src="pdf-report.js"></script>',
          ]
          if '</head>' not in html or '</body>' not in html:
              raise SystemExit('A8 index.html is missing head/body markers for overlay injection')
          if arena_style not in html:
              html = html.replace('</head>', arena_style + '\n</head>', 1)
          missing = [script for script in scripts if script not in html]
          if missing:
              html = html.replace('</body>', '\n'.join(missing) + '\n</body>', 1)
          path.write_text(html, encoding='utf-8')
          PY

          # Fail the build early if review scripts/styles are malformed or missing.
          node --check _site/dev/tk2/A8/premium-motion.js
          node --check _site/dev/tk2/A8/battle-motion.js
          node --check _site/dev/tk2/A8/arena-dev-fix.js
          node --check _site/dev/tk2/A8/pdf-report.js
          test -s _site/dev/tk2/A8/premium-motion.js
          test -s _site/dev/tk2/A8/battle-motion.js
          test -s _site/dev/tk2/A8/arena-dev-fix.js
          test -s _site/dev/tk2/A8/arena-dev-tuning.css
          test -s _site/dev/tk2/A8/pdf-report.js
          grep -Fq "doc.save('A8-' + safeFileName(student) + '.pdf');" _site/dev/tk2/A8/pdf-report.js
          grep -Fq '<link rel="stylesheet" href="arena-dev-tuning.css?v=6193079d">' _site/dev/tk2/A8/index.html
          grep -Fq '<script src="premium-motion.js"></script>' _site/dev/tk2/A8/index.html
          grep -Fq '<script src="battle-motion.js"></script>' _site/dev/tk2/A8/index.html
          grep -Fq '<script src="arena-dev-fix.js?v=59809da9"></script>' _site/dev/tk2/A8/index.html
          grep -Fq '<script src="pdf-report.js"></script>' _site/dev/tk2/A8/index.html

          # Serve files exactly as committed; do not run Jekyll processing.
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-a8-dev:
    name: Verify DEV A8 UI
    needs: deploy
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Verify deployed inventory and arena
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          (async () => {
            const url = 'https://modebrecht.github.io/ib2026/dev/tk2/A8/?qa=6193079d';
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
              let ready = false;
              for (let attempt = 0; attempt < 12; attempt += 1) {
                const response = await page.goto(url + '&attempt=' + attempt, { waitUntil: 'networkidle' });
                assert.ok(response && response.ok(), `DEV A8 did not load: ${response?.status()}`);
                const html = await page.content();
                if (html.includes('arena-dev-tuning.css?v=6193079d')) {
                  ready = true;
                  break;
                }
                await page.waitForTimeout(5000);
              }
              assert.equal(ready, true, 'GitHub Pages did not expose the expected 6193079d A8 tuning in time');

              // Regression for the reported "Auto anziehen works only halfway" issue.
              // Seed one compatible item per visible loadout position plus two swords,
              // then use the real button and verify both state-driven labels and artwork.
              await page.evaluate(() => {
                const now = Date.now();
                const item = (key, name, icon, slot, category, atk = 0, def = 0, hp = 0) => ({
                  id: `${key}-${now}`,
                  key,
                  name,
                  icon,
                  slot,
                  category,
                  theme: 'knight',
                  description: '',
                  baseAtk: atk,
                  baseDef: def,
                  baseHp: hp,
                  atk,
                  def,
                  hp,
                  tier: 1,
                  totalCopies: 1,
                  createdAt: now,
                  lastObtainedAt: now
                });
                localStorage.setItem('shortcutRitter_v1', JSON.stringify({
                  items: [
                    item('feuer_klinge', 'Feuerklinge', 'sword_fire', 'weapon', 'weapon', 4, 0),
                    item('stahl_sword', 'Stahlklinge', 'sword_steel', 'weapon', 'weapon', 3, 0),
                    item('taktik_helm', 'Taktikhelm', 'helm', 'helm', 'armor', 1, 1),
                    item('panzerhandschuhe', 'Panzerhandschuhe', 'panzerhandschuhe', 'gloves', 'armor', 0, 1),
                    item('runen_amulet', 'Runen-Amulett', 'talisman', 'necklace', 'accessory'),
                    item('stahl_stiefel', 'Stahl-Stiefel', 'stahl-stiefel', 'boots', 'armor', 0, 2),
                    item('lebens_ring', 'Lebensring', 'lebensring', 'ring_left', 'accessory', 0, 0, 20),
                    item('gluecks_ring', 'Glücksring', 'gluecksring', 'ring_right', 'accessory')
                  ],
                  equipment: {}
                }));
              });
              await page.reload({ waitUntil: 'networkidle' });
              await page.locator('.nav-toggle[data-view="inventory"]').click();
              await page.locator('#autoEquipBtn').click();
              await page.waitForTimeout(500);
              await page.waitForFunction(() => {
                const slots = Array.from(document.querySelectorAll('#inventoryView [data-equip-slot]'));
                if (slots.length !== 8 || !slots.every(slot => slot.classList.contains('equipped'))) return false;
                return slots.every(slot => {
                  const art = slot.querySelector('.slot-icon > img, .slot-icon > svg');
                  if (!art) return false;
                  const rect = art.getBoundingClientRect();
                  if (rect.width < 45 || rect.height < 45) return false;
                  return art.tagName !== 'IMG' || (art.complete && art.naturalWidth > 0);
                });
              });

              const inventoryState = await page.locator('#inventoryView').evaluate(view => {
                const slots = Array.from(view.querySelectorAll('[data-equip-slot]'));
                return slots.map(slot => {
                  const art = slot.querySelector('.slot-icon > img, .slot-icon > svg');
                  const rect = art?.getBoundingClientRect();
                  return {
                    slot: slot.dataset.equipSlot,
                    equipped: slot.classList.contains('equipped'),
                    label: slot.querySelector('.slot-header span')?.textContent?.trim() || '',
                    art: art?.tagName || '',
                    artWidth: rect?.width || 0,
                    artHeight: rect?.height || 0,
                    imageLoaded: art?.tagName === 'IMG' ? Boolean(art.complete && art.naturalWidth > 0) : true
                  };
                });
              });
              assert.equal(inventoryState.length, 8, 'Inventory must expose all eight equipment slots');
              assert.ok(inventoryState.every(slot => slot.equipped), 'Auto-equip must fill every compatible equipment slot');
              assert.ok(inventoryState.every(slot => slot.art), 'Every auto-equipped slot must render item art');
              assert.ok(inventoryState.every(slot => slot.artWidth >= 45 && slot.artHeight >= 45), 'Auto-equipped item art must be visibly sized');
              assert.ok(inventoryState.every(slot => slot.imageLoaded), 'External auto-equipped item art must load successfully');
              assert.ok(inventoryState.some(slot => slot.label === 'Feuerklinge'), 'Best weapon must be auto-equipped');
              assert.ok(inventoryState.some(slot => slot.label === 'Stahlklinge'), 'Second weapon must fill the second weapon slot');
              await page.locator('#playerCard').screenshot({ path: 'a8-inventory-deployed.png' });

              // Existing arena regression coverage stays intact.
              await page.locator('.nav-toggle[data-view="battle"]').click();
              await page.waitForFunction(() => document.getElementById('battleStagePreview')?.classList.contains('arena-svg-composed'));
              await page.waitForTimeout(600);

              const state = await page.locator('#battleStagePreview').evaluate(stage => {
                const hero = stage.querySelector('.battle-side.hero');
                const enemy = stage.querySelector('.battle-side.enemy');
                const heroHead = stage.querySelector('.battle-side.hero .battle-side-head');
                const heroStats = stage.querySelector('.battle-side.hero .battle-statline');
                const heroPortrait = stage.querySelector('.battle-side.hero .battle-portrait');
                const enemyPortrait = stage.querySelector('.battle-side.enemy .battle-portrait');
                const enemyImage = stage.querySelector('.battle-side.enemy .battle-portrait-icon > img');
                const start = stage.querySelector('#battleStartBtn');
                const heroIcon = stage.querySelector('.battle-side.hero .battle-portrait-icon');
                const enemyIcon = stage.querySelector('.battle-side.enemy .battle-portrait-icon');
                const weapons = Array.from(stage.querySelectorAll('.battle-side.hero .a8-arena-weapon'));
                const card = stage.closest('.battle-card');
                const rect = el => el?.getBoundingClientRect();
                const heroPortraitRect = rect(heroPortrait);
                const enemyPortraitRect = rect(enemyPortrait);
                const headRect = rect(heroHead);
                const statsRect = rect(heroStats);
                return {
                  background: getComputedStyle(stage).backgroundImage,
                  width: rect(stage)?.width || 0,
                  height: rect(stage)?.height || 0,
                  heroInside: !!hero,
                  enemyInside: !!enemy,
                  startInside: !!start,
                  startWidth: rect(start)?.width || 0,
                  startHeight: rect(start)?.height || 0,
                  heroAnimation: heroIcon ? getComputedStyle(heroIcon).animationName : '',
                  enemyAnimation: enemyIcon ? getComputedStyle(enemyIcon).animationName : '',
                  enemyImageTransform: enemyImage ? getComputedStyle(enemyImage).transform : '',
                  heroGround: heroPortraitRect?.bottom || 0,
                  enemyGround: enemyPortraitRect?.bottom || 0,
                  heroStatsGap: headRect && statsRect ? statsRect.top - headRect.bottom : 999,
                  weaponCount: weapons.length,
                  weaponTransforms: weapons.map(weapon => getComputedStyle(weapon).transform),
                  weaponArtTransforms: weapons.map(weapon => {
                    const art = weapon.querySelector('img, svg, object');
                    return art ? getComputedStyle(art).transform : '';
                  }),
                  weaponSizes: weapons.map(weapon => {
                    const r = rect(weapon);
                    return { width: r?.width || 0, height: r?.height || 0, top: r?.top || 0 };
                  }),
                  heroTop: heroPortraitRect?.top || 0,
                  heroHeight: heroPortraitRect?.height || 0,
                  cardOverflow: card ? card.scrollWidth > card.clientWidth + 2 : true,
                  pageOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 2
                };
              });

              await page.locator('#battleStagePreview').screenshot({ path: 'a8-arena-deployed.png' });

              assert.match(state.background, /arena-scene\.svg/i, 'Deployed arena must use arena-scene.svg');
              assert.ok(state.width > 900 && state.height >= 500, 'Deployed desktop arena must remain a large showpiece');
              assert.equal(state.heroInside, true, 'Knight must be inside deployed arena');
              assert.equal(state.enemyInside, true, 'Enemy must be inside deployed arena');
              assert.equal(state.startInside, true, 'Fight CTA must be inside deployed arena');
              assert.ok(state.startWidth >= 300 && state.startHeight >= 56, 'Fight CTA must stay large');
              assert.match(state.heroAnimation, /a8KnightIdle/i, 'Knight idle animation must run');
              assert.match(state.enemyAnimation, /a8EnemyIdle/i, 'Enemy idle animation must run');
              assert.notEqual(state.enemyImageTransform, 'none', 'Enemy PNG visual footline correction must be active');
              assert.ok(Math.abs(state.heroGround - state.enemyGround) <= 2, 'Knight and enemy must share the same arena ground line');
              assert.ok(state.heroStatsGap >= 0 && state.heroStatsGap <= 16, 'Knight stats must sit directly below the knight info box');
              assert.equal(state.weaponCount, 2, 'Knight must show two arena weapon layers');
              assert.ok(state.weaponSizes.every(size => size.width >= 60 && size.height >= 70), 'Knight arena weapons must remain visibly sized');
              assert.ok(state.weaponSizes.every(size => size.top >= state.heroTop + state.heroHeight * 0.76), 'Knight sword grips must stay down at the hanging fists, not the waist');
              assert.ok(state.weaponTransforms.every(transform => transform && transform !== 'none'), 'Knight sword wrapper rotations must be active');
              assert.ok(state.weaponArtTransforms.every(transform => transform && transform !== 'none'), 'Knight sword art must be flipped blade-down');
              assert.equal(state.cardOverflow, false, 'Deployed battle card must not overflow horizontally');
              assert.equal(state.pageOverflow, false, 'Deployed page must not overflow horizontally');
              console.log('OK: deployed DEV A8 auto-equip visuals and arena verified; screenshots captured.');
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload A8 UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a8-ui-deployed
          path: |
            a8-inventory-deployed.png
            a8-arena-deployed.png
          if-no-files-found: error
          retention-days: 7
