name: GitHub Pages Multi-Branch

on:
  push:
    branches:
      - main
      - dev
      - render
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-multibranch
  cancel-in-progress: true

jobs:
  build:
    name: Build main + dev + render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch publishing branches
        run: |
          git fetch --no-tags --depth=1 origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/dev:refs/remotes/origin/dev \
            +refs/heads/render:refs/remotes/origin/render

      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site/dev _site/render

          git archive refs/remotes/origin/main | tar -x -C _site
          git archive refs/remotes/origin/dev | tar -x -C _site/dev
          git archive refs/remotes/origin/render | tar -x -C _site/render

          # Deterministic DEV-only TK2 A8 preview.
          SHORTCUT_QUEST_SHA="6a655e2ba732dca9c84b08a74341d6adcda9b63b"
          rm -rf /tmp/shortcut-quest-a8
          git init -q /tmp/shortcut-quest-a8
          git -C /tmp/shortcut-quest-a8 remote add origin https://github.com/modebrecht/shortcut-quest.git
          git -C /tmp/shortcut-quest-a8 fetch -q --depth=1 origin "$SHORTCUT_QUEST_SHA"
          git -C /tmp/shortcut-quest-a8 checkout -q --detach FETCH_HEAD

          mkdir -p _site/dev/tk2/A8
          for file in \
            index.html sections-data.js skill-hotkeys.js \
            modern-ui.css modern-exercises.css modern-game.css modern-battle.css modern-report.css \
            apexcharts.min.js favicon.svg premium-motion.js battle-motion.js knight-premium-motion.js \
            arena-dev-fix.js arena-dev-tuning.css a8-dev-polish.js battle-continuity.js battle-balance.js; do
            cp "/tmp/shortcut-quest-a8/2026/$file" "_site/dev/tk2/A8/$file"
          done
          cp -R /tmp/shortcut-quest-a8/2026/assets _site/dev/tk2/A8/

          # IB2026-only diagnostic PDF overlay.
          cp _site/dev/tk2/a8-pdf-report.js _site/dev/tk2/A8/pdf-report.js
          python3 - <<'PY'
          from pathlib import Path

          pdf_path = Path('_site/dev/tk2/A8/pdf-report.js')
          pdf_js = pdf_path.read_text(encoding='utf-8')
          old_name = "doc.save('A8_Shortcut_Quest_Lernnachweis_' + safeFileName(student) + '.pdf');"
          new_name = "doc.save('A8-' + safeFileName(student) + '.pdf');"
          if old_name not in pdf_js:
              raise SystemExit('A8 PDF filename marker not found')
          pdf_path.write_text(pdf_js.replace(old_name, new_name, 1), encoding='utf-8')

          path = Path('_site/dev/tk2/A8/index.html')
          html = path.read_text(encoding='utf-8')
          arena_style = '<link rel="stylesheet" href="arena-dev-tuning.css?v=6193079d">'
          scripts = [
              '<script src="premium-motion.js"></script>',
              '<script src="battle-motion.js?v=5f9aa1a7"></script>',
              '<script src="arena-dev-fix.js?v=59809da9"></script>',
              '<script src="a8-dev-polish.js?v=8af72c1b"></script>',
              '<script src="battle-continuity.js?v=6a655e2b"></script>',
              '<script src="battle-balance.js?v=6a655e2b"></script>',
              '<script src="knight-premium-motion.js?v=74934b8f"></script>',
              '<script src="pdf-report.js"></script>',
          ]
          if '</head>' not in html or '</body>' not in html:
              raise SystemExit('A8 index.html is missing head/body markers')
          if arena_style not in html:
              html = html.replace('</head>', arena_style + '\n</head>', 1)
          missing = [script for script in scripts if script not in html]
          if missing:
              html = html.replace('</body>', '\n'.join(missing) + '\n</body>', 1)
          path.write_text(html, encoding='utf-8')
          PY

          node --check _site/dev/tk2/A8/premium-motion.js
          node --check _site/dev/tk2/A8/battle-motion.js
          node --check _site/dev/tk2/A8/knight-premium-motion.js
          node --check _site/dev/tk2/A8/arena-dev-fix.js
          node --check _site/dev/tk2/A8/a8-dev-polish.js
          node --check _site/dev/tk2/A8/battle-continuity.js
          node --check _site/dev/tk2/A8/battle-balance.js
          node --check _site/dev/tk2/A8/pdf-report.js
          grep -Fq "doc.save('A8-' + safeFileName(student) + '.pdf');" _site/dev/tk2/A8/pdf-report.js
          grep -Fq '<script src="battle-continuity.js?v=6a655e2b"></script>' _site/dev/tk2/A8/index.html
          grep -Fq '<script src="battle-balance.js?v=6a655e2b"></script>' _site/dev/tk2/A8/index.html
          grep -Fq 'SHORTCUT_QUEST_BATTLE_ENGINE_V2' _site/dev/tk2/A8/index.html
          grep -Fq 'SHORTCUT_QUEST_ENEMY_ITEMS' _site/dev/tk2/A8/index.html
          grep -Fq 'A8 PREMIUM HD BATTLE MOTION 2026' _site/dev/tk2/A8/battle-motion.js
          grep -Fq 'A8 PREMIUM KNIGHT MOTION 2026' _site/dev/tk2/A8/knight-premium-motion.js
          grep -Fq 'BATTLE UI SKILL BAR PREMIUM PASS 2026' _site/dev/tk2/A8/modern-battle.css
          grep -Fq 'BATTLE UI SKILL CARD FIT FIX 2026' _site/dev/tk2/A8/modern-battle.css
          grep -Fq 'BATTLE SKILL CONTENT HIERARCHY FIX 2026' _site/dev/tk2/A8/modern-battle.css
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-a8-dev:
    name: Verify DEV A8 UI
    needs: deploy
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Verify deployed inventory, arena, Battle V2 and balance
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          const keyMap = {
            CTRL: 'Control', CONTROL: 'Control', ALT: 'Alt', SHIFT: 'Shift', WIN: 'Meta', META: 'Meta',
            ESC: 'Escape', ESCAPE: 'Escape', ENTER: 'Enter', RETURN: 'Enter', TAB: 'Tab', SPACE: ' ',
            HOME: 'Home', END: 'End', DELETE: 'Delete', BACKSPACE: 'Backspace',
            ARROWUP: 'ArrowUp', ARROWDOWN: 'ArrowDown', ARROWLEFT: 'ArrowLeft', ARROWRIGHT: 'ArrowRight'
          };
          const pwKey = token => keyMap[String(token || '').toUpperCase()] || token;

          (async () => {
            const url = 'https://modebrecht.github.io/ib2026/dev/tk2/A8/?qa=6a655e2b';
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
              let ready = false;
              for (let attempt = 0; attempt < 12; attempt += 1) {
                const response = await page.goto(url + '&attempt=' + attempt, { waitUntil: 'networkidle' });
                assert.ok(response && response.ok(), `DEV A8 did not load: ${response?.status()}`);
                const html = await page.content();
                if (
                  html.includes('battle-continuity.js?v=6a655e2b') &&
                  html.includes('battle-balance.js?v=6a655e2b') &&
                  html.includes('SHORTCUT_QUEST_ENEMY_ITEMS') &&
                  html.includes('SHORTCUT_QUEST_BATTLE_ENGINE_V2')
                ) {
                  ready = true;
                  break;
                }
                await page.waitForTimeout(5000);
              }
              assert.equal(ready, true, 'GitHub Pages did not expose the expected 6a655e2b A8 build in time');

              const balance = await page.evaluate(() => ({
                installed: window.SHORTCUT_QUEST_BATTLE_BALANCE?.installed,
                multiplier: window.SHORTCUT_QUEST_BATTLE_BALANCE?.heroAutoAttackMultiplier,
                cooldown: window.SHORTCUT_QUEST_BATTLE_BALANCE?.cooldownTurns,
                cap: window.SHORTCUT_QUEST_BATTLE_BALANCE?.shortcutCoinCap,
                powers: ['sturm_hieb', 'schutzwall', 'kampfrausch', 'lichtbrunnen'].map(key => window.SHORTCUT_QUEST_BATTLE_BALANCE?.getSkillBasePower(key, 1))
              }));
              assert.equal(balance.installed, true);
              assert.equal(balance.multiplier, 0.45);
              assert.equal(balance.cooldown, 4);
              assert.equal(balance.cap, 4);
              assert.deepEqual(balance.powers, [12, 7, 4, 18]);

              await page.evaluate(() => {
                const now = Date.now();
                const item = (key, name, icon, slot, category, atk = 0, def = 0, hp = 0) => ({
                  id: `${key}-${now}`, key, name, icon, slot, category, theme: 'knight', description: '',
                  baseAtk: atk, baseDef: def, baseHp: hp, atk, def, hp,
                  tier: 1, totalCopies: 1, createdAt: now, lastObtainedAt: now
                });
                const sectionClears = {};
                for (let i = 1; i <= 30; i += 1) sectionClears[String(i)] = 1;
                const skills = SKILL_POOL.map(skill => ({
                  ...skill,
                  tier: 1,
                  totalCopies: 1,
                  overcapBonusPercent: 0
                }));
                localStorage.setItem('shortcutRitter_v1', JSON.stringify({
                  sectionClears,
                  battleClears: { '1': true, '2': true, '3': true, '4': true },
                  battleUnlocked: 5,
                  coins: 40,
                  skills,
                  items: [
                    item('feuer_klinge', 'Feuerklinge', 'sword_fire', 'weapon', 'weapon', 4),
                    item('stahl_sword', 'Stahlklinge', 'sword_steel', 'weapon', 'weapon', 3),
                    item('taktik_helm', 'Taktikhelm', 'helm', 'helm', 'armor', 1, 1),
                    item('panzerhandschuhe', 'Panzerhandschuhe', 'panzerhandschuhe', 'gloves', 'armor', 0, 1),
                    item('runen_amulet', 'Runen-Amulett', 'talisman', 'necklace', 'accessory'),
                    item('stahl_stiefel', 'Stahl-Stiefel', 'stahl-stiefel', 'boots', 'armor', 0, 2),
                    item('lebens_ring', 'Lebensring', 'lebensring', 'ring_left', 'accessory', 0, 0, 20),
                    item('gluecks_ring', 'Glücksring', 'gluecksring', 'ring_right', 'accessory')
                  ],
                  equipment: {}
                }));
              });
              await page.reload({ waitUntil: 'networkidle' });
              assert.equal(await page.evaluate(() => state.skills?.length || 0), 4, 'DEV QA state must load the four current shortcut skills');

              // Inventory -> equip remains functional.
              await page.locator('.nav-toggle[data-view="inventory"]').click();
              await page.waitForTimeout(250);
              assert.equal(await page.locator('#autoEquipBtn').textContent(), 'Alles anziehen');
              await page.locator('#autoEquipBtn').click();
              await page.waitForFunction(() => Array.from(document.querySelectorAll('#inventoryView [data-equip-slot]')).length === 8 && Array.from(document.querySelectorAll('#inventoryView [data-equip-slot]')).every(slot => slot.classList.contains('equipped')));
              await page.locator('#playerCard').screenshot({ path: 'a8-inventory-deployed.png' });

              // Premium pre-battle arena remains intact.
              await page.locator('.nav-toggle[data-view="battle"]').click();
              await page.waitForFunction(() => document.getElementById('battleStagePreview')?.classList.contains('arena-svg-composed'));
              await page.locator('#battleButtons .battle-btn[data-enemy="5"]').click();
              await page.waitForFunction(() => document.querySelector('.a8-preview-enemy-item')?.getAttribute('title') === 'Steinschild');
              const preview = await page.locator('#battleStagePreview').evaluate(stage => {
                const rect = el => el?.getBoundingClientRect();
                const hero = stage.querySelector('.battle-side.hero .battle-portrait');
                const enemy = stage.querySelector('.battle-side.enemy .battle-portrait');
                return {
                  background: getComputedStyle(stage).backgroundImage,
                  groundDelta: Math.abs((rect(hero)?.bottom || 0) - (rect(enemy)?.bottom || 0)),
                  pageOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 2
                };
              });
              assert.match(preview.background, /arena-scene\.svg/i);
              assert.ok(preview.groundDelta <= 2, `Pre-battle fighters must share the groundline (delta ${preview.groundDelta})`);
              assert.equal(preview.pageOverflow, false);
              await page.locator('#battleStagePreview').screenshot({ path: 'a8-arena-deployed.png' });

              // Measure the static active-battle baseline before attack transforms move either fighter.
              await page.locator('#battleStartBtn').click();
              await page.waitForFunction(() => window.SHORTCUT_QUEST_BATTLE_ENGINE_V2?.phase === 'fighting');
              await page.waitForFunction(() => Boolean(document.querySelector('#battleArena .a8-themed-battle-backdrop')));
              const active = await page.locator('#battleArena').evaluate(arena => {
                const rect = el => el?.getBoundingClientRect();
                const hero = arena.querySelector('.fighter.knight');
                const enemy = arena.querySelector('.fighter.enemy');
                const backdrop = arena.querySelector('.a8-themed-battle-backdrop');
                return {
                  background: backdrop ? getComputedStyle(backdrop).backgroundImage : '',
                  groundDelta: Math.abs((rect(hero)?.bottom || 0) - (rect(enemy)?.bottom || 0)),
                  premiumVersion: window.A8_PREMIUM_BATTLE?.version || 0,
                  knightVersion: window.A8_KNIGHT_PREMIUM?.version || 0
                };
              });
              assert.match(active.background, /battle-bg-mountain\.svg/i);
              assert.ok(active.groundDelta <= 2, `Active fighters must share the static groundline (delta ${active.groundDelta})`);
              assert.equal(active.premiumVersion, 2);
              assert.equal(active.knightVersion, 1);
              await page.locator('#battleArena').screenshot({ path: 'a8-battle-active-deployed.png' });

              // Premium attack choreography is verified separately so its transforms cannot invalidate baseline geometry.
              await page.waitForFunction(() => {
                const battle = window.A8_PREMIUM_BATTLE_DEBUG;
                const knight = window.A8_KNIGHT_PREMIUM_DEBUG;
                return battle && knight && battle.impacts >= 1 && knight.attacks >= 1;
              }, null, { timeout: 5000 });

              // Use one real assigned shortcut: deployed bonus must be +1 and visibly stronger than autohit.
              const shortcut = await page.evaluate(() => {
                const entry = battleSkillStates.find(candidate => candidate?.mode === 'combo' && candidate?.comboSequence?.length >= 2);
                return entry ? { sequence: entry.comboSequence.slice(), coins: state.coins } : null;
              });
              assert.ok(shortcut && shortcut.sequence.length >= 2, 'A deployed battle skill must have a real shortcut combo');
              const keys = shortcut.sequence.map(pwKey);
              for (const key of keys) await page.keyboard.down(key);
              await page.waitForTimeout(40);
              for (const key of [...keys].reverse()) await page.keyboard.up(key);
              await page.waitForFunction(() => window.SHORTCUT_QUEST_BATTLE_BALANCE?.shortcutCoinsThisBattle === 1);
              const rewarded = await page.evaluate(() => ({
                coins: state.coins,
                bonus: window.SHORTCUT_QUEST_BATTLE_BALANCE.shortcutCoinsThisBattle,
                strong: document.getElementById('battleArena')?.classList.contains('a8-skill-impact-strong') || false,
                log: document.getElementById('battleLog')?.textContent || ''
              }));
              assert.equal(rewarded.coins, shortcut.coins + 1);
              assert.equal(rewarded.bonus, 1);
              assert.equal(rewarded.strong, true);
              assert.match(rewarded.log, /Shortcut-Bonus/);
              await page.locator('#battleArena').screenshot({ path: 'a8-battle-balance-deployed.png' });

              // Freeze guard + terminal transition.
              await page.waitForFunction(() => {
                const engine = window.SHORTCUT_QUEST_BATTLE_ENGINE_V2;
                return engine && (engine.turn >= 3 || engine.phase !== 'fighting');
              }, null, { timeout: 7000 });
              await page.waitForFunction(() => ['victory', 'defeat'].includes(window.SHORTCUT_QUEST_BATTLE_ENGINE_V2?.phase), null, { timeout: 45000 });
              const finished = await page.evaluate(() => ({
                phase: window.SHORTCUT_QUEST_BATTLE_ENGINE_V2?.phase,
                outcome: window.SHORTCUT_QUEST_BATTLE_ENGINE_V2?.lastOutcome,
                lastError: window.SHORTCUT_QUEST_BATTLE_ENGINE_V2?.lastError
              }));
              assert.ok(['victory', 'defeat'].includes(finished.phase));
              assert.equal(finished.phase, finished.outcome);
              assert.equal(finished.lastError, null);

              console.log('OK: deployed DEV A8 pin, balance runtime, inventory, arena, themed active battle, real shortcut reward and Battle V2 verified.');
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload A8 UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a8-ui-deployed
          path: |
            a8-inventory-deployed.png
            a8-arena-deployed.png
            a8-battle-active-deployed.png
            a8-battle-balance-deployed.png
          if-no-files-found: error
          retention-days: 7
