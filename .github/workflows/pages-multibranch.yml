name: GitHub Pages Multi-Branch

on:
  push:
    branches:
      - main
      - dev
      - render
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-multibranch
  cancel-in-progress: true

jobs:
  build:
    name: Build main + dev + render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch publishing branches
        run: |
          git fetch --no-tags --depth=1 origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/dev:refs/remotes/origin/dev \
            +refs/heads/render:refs/remotes/origin/render

      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site/dev _site/render

          # Production at the Pages root.
          git archive refs/remotes/origin/main | tar -x -C _site

          # Branch previews below their own paths.
          git archive refs/remotes/origin/dev | tar -x -C _site/dev
          git archive refs/remotes/origin/render | tar -x -C _site/render

          # TK2 A8 review build: inject the pinned Shortcut Quest 2026 runtime
          # into DEV only so classroom review stays deterministic.
          SHORTCUT_QUEST_SHA="c0615b3c7ce0553e81d32cec4c076d9794c0bd7c"
          rm -rf /tmp/shortcut-quest-a8
          git init -q /tmp/shortcut-quest-a8
          git -C /tmp/shortcut-quest-a8 remote add origin https://github.com/modebrecht/shortcut-quest.git
          git -C /tmp/shortcut-quest-a8 fetch -q --depth=1 origin "$SHORTCUT_QUEST_SHA"
          git -C /tmp/shortcut-quest-a8 checkout -q --detach FETCH_HEAD
          mkdir -p _site/dev/tk2/A8
          cp /tmp/shortcut-quest-a8/2026/index.html _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/sections-data.js _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/skill-hotkeys.js _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/modern-ui.css _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/modern-exercises.css _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/modern-game.css _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/modern-battle.css _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/modern-report.css _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/apexcharts.min.js _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/favicon.svg _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/premium-motion.js _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/battle-motion.js _site/dev/tk2/A8/
          cp /tmp/shortcut-quest-a8/2026/arena-dev-fix.js _site/dev/tk2/A8/
          cp -R /tmp/shortcut-quest-a8/2026/assets _site/dev/tk2/A8/

          # IB2026-only A8 diagnostic PDF overlay.
          cp _site/dev/tk2/a8-pdf-report.js _site/dev/tk2/A8/pdf-report.js
          python3 - <<'PY'
          from pathlib import Path

          # Classroom filename: A8-VORNAME.pdf
          pdf_path = Path('_site/dev/tk2/A8/pdf-report.js')
          pdf_js = pdf_path.read_text(encoding='utf-8')
          old_name = "doc.save('A8_Shortcut_Quest_Lernnachweis_' + safeFileName(student) + '.pdf');"
          new_name = "doc.save('A8-' + safeFileName(student) + '.pdf');"
          if old_name not in pdf_js:
              raise SystemExit('A8 PDF filename marker not found')
          pdf_path.write_text(pdf_js.replace(old_name, new_name, 1), encoding='utf-8')

          path = Path('_site/dev/tk2/A8/index.html')
          html = path.read_text(encoding='utf-8')
          scripts = [
              '<script src="premium-motion.js"></script>',
              '<script src="battle-motion.js"></script>',
              '<script src="arena-dev-fix.js?v=c0615b3c"></script>',
              '<script src="pdf-report.js"></script>',
          ]
          if '</body>' not in html:
              raise SystemExit('A8 index.html has no </body> marker for overlay injection')
          missing = [script for script in scripts if script not in html]
          if missing:
              html = html.replace('</body>', '\n'.join(missing) + '\n</body>', 1)
              path.write_text(html, encoding='utf-8')
          PY

          # Fail the build early if review scripts are malformed or missing.
          node --check _site/dev/tk2/A8/premium-motion.js
          node --check _site/dev/tk2/A8/battle-motion.js
          node --check _site/dev/tk2/A8/arena-dev-fix.js
          node --check _site/dev/tk2/A8/pdf-report.js
          test -s _site/dev/tk2/A8/premium-motion.js
          test -s _site/dev/tk2/A8/battle-motion.js
          test -s _site/dev/tk2/A8/arena-dev-fix.js
          test -s _site/dev/tk2/A8/pdf-report.js
          grep -Fq "doc.save('A8-' + safeFileName(student) + '.pdf');" _site/dev/tk2/A8/pdf-report.js
          grep -Fq '<script src="premium-motion.js"></script>' _site/dev/tk2/A8/index.html
          grep -Fq '<script src="battle-motion.js"></script>' _site/dev/tk2/A8/index.html
          grep -Fq '<script src="arena-dev-fix.js?v=c0615b3c"></script>' _site/dev/tk2/A8/index.html
          grep -Fq '<script src="pdf-report.js"></script>' _site/dev/tk2/A8/index.html

          # Serve files exactly as committed; do not run Jekyll processing.
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-a8-dev:
    name: Verify DEV A8 arena
    needs: deploy
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Verify deployed arena and capture screenshot
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          (async () => {
            const url = 'https://modebrecht.github.io/ib2026/dev/tk2/A8/?qa=c0615b3c';
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
              let ready = false;
              for (let attempt = 0; attempt < 12; attempt += 1) {
                const response = await page.goto(url + '&attempt=' + attempt, { waitUntil: 'networkidle' });
                assert.ok(response && response.ok(), `DEV A8 did not load: ${response?.status()}`);
                const html = await page.content();
                if (html.includes('arena-dev-fix.js?v=c0615b3c')) {
                  ready = true;
                  break;
                }
                await page.waitForTimeout(5000);
              }
              assert.equal(ready, true, 'GitHub Pages did not expose the expected c0615b3c A8 runtime in time');

              await page.locator('.nav-toggle[data-view="battle"]').click();
              await page.waitForFunction(() => document.getElementById('battleStagePreview')?.classList.contains('arena-svg-composed'));
              await page.waitForTimeout(600);

              const state = await page.locator('#battleStagePreview').evaluate(stage => {
                const hero = stage.querySelector('.battle-side.hero');
                const enemy = stage.querySelector('.battle-side.enemy');
                const start = stage.querySelector('#battleStartBtn');
                const heroIcon = stage.querySelector('.battle-side.hero .battle-portrait-icon');
                const enemyIcon = stage.querySelector('.battle-side.enemy .battle-portrait-icon');
                const card = stage.closest('.battle-card');
                const rect = el => el?.getBoundingClientRect();
                return {
                  background: getComputedStyle(stage).backgroundImage,
                  width: rect(stage)?.width || 0,
                  height: rect(stage)?.height || 0,
                  heroInside: !!hero,
                  enemyInside: !!enemy,
                  startInside: !!start,
                  startWidth: rect(start)?.width || 0,
                  startHeight: rect(start)?.height || 0,
                  heroAnimation: heroIcon ? getComputedStyle(heroIcon).animationName : '',
                  enemyAnimation: enemyIcon ? getComputedStyle(enemyIcon).animationName : '',
                  cardOverflow: card ? card.scrollWidth > card.clientWidth + 2 : true,
                  pageOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 2
                };
              });

              // Capture first so failed assertions still leave visual evidence.
              await page.locator('#battleStagePreview').screenshot({ path: 'a8-arena-deployed.png' });

              assert.match(state.background, /arena-scene\.svg/i, 'Deployed arena must use arena-scene.svg');
              assert.ok(state.width > 900 && state.height >= 500, 'Deployed desktop arena must remain a large showpiece');
              assert.equal(state.heroInside, true, 'Knight must be inside deployed arena');
              assert.equal(state.enemyInside, true, 'Enemy must be inside deployed arena');
              assert.equal(state.startInside, true, 'Fight CTA must be inside deployed arena');
              assert.ok(state.startWidth >= 300 && state.startHeight >= 56, 'Fight CTA must stay large');
              assert.match(state.heroAnimation, /a8KnightIdle/i, 'Knight idle animation must run');
              assert.match(state.enemyAnimation, /a8EnemyIdle/i, 'Enemy idle animation must run');
              assert.equal(state.cardOverflow, false, 'Deployed battle card must not overflow horizontally');
              assert.equal(state.pageOverflow, false, 'Deployed page must not overflow horizontally');
              console.log('OK: deployed DEV A8 arena verified and screenshot captured.');
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload A8 arena screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a8-arena-deployed
          path: a8-arena-deployed.png
          if-no-files-found: error
          retention-days: 7
