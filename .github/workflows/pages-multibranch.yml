name: GitHub Pages Multi-Branch

on:
  push:
    branches:
      - main
      - dev
      - render
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-multibranch
  cancel-in-progress: true

jobs:
  build:
    name: Build main + dev + render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch publishing branches
        run: |
          git fetch --no-tags --depth=1 origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/dev:refs/remotes/origin/dev \
            +refs/heads/render:refs/remotes/origin/render

      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site/dev _site/render

          git archive refs/remotes/origin/main | tar -x -C _site
          git archive refs/remotes/origin/dev | tar -x -C _site/dev
          git archive refs/remotes/origin/render | tar -x -C _site/render

          # Deterministic DEV-only TK2 A8 preview.
          SHORTCUT_QUEST_SHA="5f9aa1a74423ac600d3cb49a3974ccfb20f41688"
          rm -rf /tmp/shortcut-quest-a8
          git init -q /tmp/shortcut-quest-a8
          git -C /tmp/shortcut-quest-a8 remote add origin https://github.com/modebrecht/shortcut-quest.git
          git -C /tmp/shortcut-quest-a8 fetch -q --depth=1 origin "$SHORTCUT_QUEST_SHA"
          git -C /tmp/shortcut-quest-a8 checkout -q --detach FETCH_HEAD

          mkdir -p _site/dev/tk2/A8
          for file in \
            index.html sections-data.js skill-hotkeys.js \
            modern-ui.css modern-exercises.css modern-game.css modern-battle.css modern-report.css \
            apexcharts.min.js favicon.svg premium-motion.js battle-motion.js \
            arena-dev-fix.js arena-dev-tuning.css a8-dev-polish.js; do
            cp "/tmp/shortcut-quest-a8/2026/$file" "_site/dev/tk2/A8/$file"
          done
          cp -R /tmp/shortcut-quest-a8/2026/assets _site/dev/tk2/A8/

          # IB2026-only diagnostic PDF overlay.
          cp _site/dev/tk2/a8-pdf-report.js _site/dev/tk2/A8/pdf-report.js
          python3 - <<'PY'
          from pathlib import Path

          pdf_path = Path('_site/dev/tk2/A8/pdf-report.js')
          pdf_js = pdf_path.read_text(encoding='utf-8')
          old_name = "doc.save('A8_Shortcut_Quest_Lernnachweis_' + safeFileName(student) + '.pdf');"
          new_name = "doc.save('A8-' + safeFileName(student) + '.pdf');"
          if old_name not in pdf_js:
              raise SystemExit('A8 PDF filename marker not found')
          pdf_path.write_text(pdf_js.replace(old_name, new_name, 1), encoding='utf-8')

          path = Path('_site/dev/tk2/A8/index.html')
          html = path.read_text(encoding='utf-8')
          arena_style = '<link rel="stylesheet" href="arena-dev-tuning.css?v=6193079d">'
          scripts = [
              '<script src="premium-motion.js"></script>',
              '<script src="battle-motion.js?v=5f9aa1a7"></script>',
              '<script src="arena-dev-fix.js?v=59809da9"></script>',
              '<script src="a8-dev-polish.js?v=8af72c1b"></script>',
              '<script src="pdf-report.js"></script>',
          ]
          if '</head>' not in html or '</body>' not in html:
              raise SystemExit('A8 index.html is missing head/body markers')
          if arena_style not in html:
              html = html.replace('</head>', arena_style + '\n</head>', 1)
          missing = [script for script in scripts if script not in html]
          if missing:
              html = html.replace('</body>', '\n'.join(missing) + '\n</body>', 1)
          path.write_text(html, encoding='utf-8')
          PY

          node --check _site/dev/tk2/A8/premium-motion.js
          node --check _site/dev/tk2/A8/battle-motion.js
          node --check _site/dev/tk2/A8/arena-dev-fix.js
          node --check _site/dev/tk2/A8/a8-dev-polish.js
          node --check _site/dev/tk2/A8/pdf-report.js
          grep -Fq "doc.save('A8-' + safeFileName(student) + '.pdf');" _site/dev/tk2/A8/pdf-report.js
          grep -Fq '<script src="battle-motion.js?v=5f9aa1a7"></script>' _site/dev/tk2/A8/index.html
          grep -Fq '<script src="a8-dev-polish.js?v=8af72c1b"></script>' _site/dev/tk2/A8/index.html
          grep -Fq 'SHORTCUT_QUEST_BATTLE_ENGINE_V2' _site/dev/tk2/A8/index.html
          grep -Fq 'SHORTCUT_QUEST_ENEMY_ITEMS' _site/dev/tk2/A8/index.html
          grep -Fq 'A8 PREMIUM HD BATTLE MOTION 2026' _site/dev/tk2/A8/battle-motion.js
          grep -Fq 'BATTLE UI SKILL BAR PREMIUM PASS 2026' _site/dev/tk2/A8/modern-battle.css
          grep -Fq 'BATTLE UI SKILL CARD FIT FIX 2026' _site/dev/tk2/A8/modern-battle.css
          grep -Fq 'BATTLE SKILL CONTENT HIERARCHY FIX 2026' _site/dev/tk2/A8/modern-battle.css
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-a8-dev:
    name: Verify DEV A8 UI
    needs: deploy
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Verify deployed inventory, arena, Battle V2 and skills
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          (async () => {
            const url = 'https://modebrecht.github.io/ib2026/dev/tk2/A8/?qa=5f9aa1a7';
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
              let ready = false;
              for (let attempt = 0; attempt < 12; attempt += 1) {
                const response = await page.goto(url + '&attempt=' + attempt, { waitUntil: 'networkidle' });
                assert.ok(response && response.ok(), `DEV A8 did not load: ${response?.status()}`);
                const html = await page.content();
                if (html.includes('battle-motion.js?v=5f9aa1a7') && html.includes('SHORTCUT_QUEST_ENEMY_ITEMS') && html.includes('SHORTCUT_QUEST_BATTLE_ENGINE_V2')) {
                  ready = true;
                  break;
                }
                await page.waitForTimeout(5000);
              }
              assert.equal(ready, true, 'GitHub Pages did not expose the expected 5f9aa1a7 A8 build in time');

              await page.evaluate(() => {
                const now = Date.now();
                const item = (key, name, icon, slot, category, atk = 0, def = 0, hp = 0) => ({
                  id: `${key}-${now}`, key, name, icon, slot, category, theme: 'knight', description: '',
                  baseAtk: atk, baseDef: def, baseHp: hp, atk, def, hp,
                  tier: 1, totalCopies: 1, createdAt: now, lastObtainedAt: now
                });
                const sectionClears = {};
                for (let i = 1; i <= 30; i += 1) sectionClears[String(i)] = 1;
                localStorage.setItem('shortcutRitter_v1', JSON.stringify({
                  sectionClears,
                  battleClears: { '1': true, '2': true, '3': true, '4': true },
                  battleUnlocked: 5,
                  items: [
                    item('feuer_klinge', 'Feuerklinge', 'sword_fire', 'weapon', 'weapon', 4),
                    item('stahl_sword', 'Stahlklinge', 'sword_steel', 'weapon', 'weapon', 3),
                    item('taktik_helm', 'Taktikhelm', 'helm', 'helm', 'armor', 1, 1),
                    item('panzerhandschuhe', 'Panzerhandschuhe', 'panzerhandschuhe', 'gloves', 'armor', 0, 1),
                    item('runen_amulet', 'Runen-Amulett', 'talisman', 'necklace', 'accessory'),
                    item('stahl_stiefel', 'Stahl-Stiefel', 'stahl-stiefel', 'boots', 'armor', 0, 2),
                    item('lebens_ring', 'Lebensring', 'lebensring', 'ring_left', 'accessory', 0, 0, 20),
                    item('gluecks_ring', 'Glücksring', 'gluecksring', 'ring_right', 'accessory')
                  ],
                  equipment: {},
                  skills: [
                    { key: 'shield_wall', name: 'Alles markieren', icon: 'shield', effect: 'defense', power: 4, description: 'Erhöht DEF um 4 für 5 gegnerische Angriffe.' },
                    { key: 'heal', name: 'Drucken', icon: 'heal', effect: 'heal', power: 12, description: 'Heilt 12 HP.' },
                    { key: 'strike', name: 'Kopieren', icon: 'lightning', effect: 'damage', power: 6, description: 'Fügt sofort 6 Schaden zu.' },
                    { key: 'frenzy', name: 'Suchen', icon: 'target', effect: 'attack', power: 2, description: 'Erhöht ATK um 2 für 5 gegnerische Angriffe.' }
                  ]
                }));
              });
              await page.reload({ waitUntil: 'networkidle' });

              // Inventory guidance/regression.
              await page.locator('.nav-toggle[data-view="inventory"]').click();
              await page.waitForTimeout(250);
              const emptySlots = await page.locator('#inventoryView [data-equip-slot]').evaluateAll(slots => slots.map(slot => ({
                equipped: slot.classList.contains('equipped'),
                ready: slot.classList.contains('a8-slot-ready'),
                animation: getComputedStyle(slot).animationName
              })));
              assert.equal(await page.locator('#autoEquipBtn').textContent(), 'Alles anziehen');
              assert.equal(emptySlots.length, 8);
              assert.ok(emptySlots.every(slot => !slot.equipped && slot.ready && /a8EquipSlotPulse/.test(slot.animation)));
              await page.locator('#autoEquipBtn').click();
              await page.waitForFunction(() => Array.from(document.querySelectorAll('#inventoryView [data-equip-slot]')).length === 8 && Array.from(document.querySelectorAll('#inventoryView [data-equip-slot]')).every(slot => slot.classList.contains('equipped')));
              await page.locator('#playerCard').screenshot({ path: 'a8-inventory-deployed.png' });

              // Pre-battle arena stays intact and enemy gear is visible.
              await page.locator('.nav-toggle[data-view="battle"]').click();
              await page.waitForFunction(() => document.getElementById('battleStagePreview')?.classList.contains('arena-svg-composed'));
              await page.locator('#battleButtons .battle-btn[data-enemy="5"]').click();
              await page.waitForFunction(() => document.querySelector('.a8-preview-enemy-item')?.getAttribute('title') === 'Steinschild');
              const preview = await page.locator('#battleStagePreview').evaluate(stage => {
                const rect = el => el?.getBoundingClientRect();
                const hero = stage.querySelector('.battle-side.hero .battle-portrait');
                const enemy = stage.querySelector('.battle-side.enemy .battle-portrait');
                const weapons = Array.from(stage.querySelectorAll('.battle-side.hero .a8-arena-weapon'));
                const enemyItem = stage.querySelector('.a8-preview-enemy-item');
                return {
                  background: getComputedStyle(stage).backgroundImage,
                  width: rect(stage)?.width || 0,
                  height: rect(stage)?.height || 0,
                  groundDelta: Math.abs((rect(hero)?.bottom || 0) - (rect(enemy)?.bottom || 0)),
                  weaponCount: weapons.length,
                  enemyItem: enemyItem?.getAttribute('title') || '',
                  enemyItemKind: enemyItem?.dataset.kind || '',
                  pageOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 2
                };
              });
              assert.match(preview.background, /arena-scene\.svg/i);
              assert.ok(preview.width > 900 && preview.height >= 500);
              assert.ok(preview.groundDelta <= 2);
              assert.equal(preview.weaponCount, 2);
              assert.equal(preview.enemyItem, 'Steinschild');
              assert.equal(preview.enemyItemKind, 'shield');
              assert.equal(preview.pageOverflow, false);
              await page.locator('#battleStagePreview').screenshot({ path: 'a8-arena-deployed.png' });

              // Real active battle + redesigned skill UI + premium enemy item use.
              await page.locator('#battleStartBtn').click();
              await page.waitForFunction(() => !document.getElementById('battleSimulation')?.classList.contains('hidden'));
              await page.waitForFunction(() => (window.A8_PREMIUM_BATTLE_DEBUG?.enemyItemUses || 0) >= 1 && (window.A8_PREMIUM_BATTLE_DEBUG?.impacts || 0) >= 1, null, { timeout: 4000 });
              await page.waitForTimeout(120);

              const active = await page.locator('#battleSimulation').evaluate(sim => {
                const rect = el => el?.getBoundingClientRect();
                const card = sim.closest('.battle-card');
                const arena = document.getElementById('battleArena');
                const knight = document.getElementById('battleKnightSprite');
                const enemy = document.getElementById('battleEnemySprite');
                const enemyItem = document.querySelector('#battleEnemy .a8-enemy-item');
                const debug = window.A8_PREMIUM_BATTLE_DEBUG || {};
                return {
                  visible: !sim.classList.contains('hidden') && (rect(sim)?.height || 0) > 0,
                  arenaWidth: rect(arena)?.width || 0,
                  arenaHeight: rect(arena)?.height || 0,
                  knightHeight: rect(knight)?.height || 0,
                  enemyHeight: rect(enemy)?.height || 0,
                  enemyItem: enemyItem?.getAttribute('title') || '',
                  enemyItemUses: debug.enemyItemUses || 0,
                  impacts: debug.impacts || 0,
                  lastItemAction: debug.lastItemAction || '',
                  premiumVersion: window.A8_PREMIUM_BATTLE?.version || 0,
                  cardOverflow: card ? card.scrollWidth > card.clientWidth + 2 : true
                };
              });
              assert.equal(active.visible, true);
              assert.ok(active.arenaWidth > 900 && active.arenaHeight >= 400);
              assert.ok(active.knightHeight >= 220 && active.enemyHeight >= 200);
              assert.equal(active.enemyItem, 'Steinschild');
              assert.ok(active.enemyItemUses >= 1);
              assert.ok(active.impacts >= 1);
              assert.equal(active.lastItemAction, 'block');
              assert.equal(active.premiumVersion, 2);
              assert.equal(active.cardOverflow, false);

              const skillUi = await page.locator('#battleSkillBar').evaluate(bar => {
                const rect = el => el?.getBoundingClientRect();
                const cards = Array.from(bar.querySelectorAll('.battle-skill'));
                return {
                  display: getComputedStyle(bar).display,
                  cards: cards.map(card => {
                    const name = card.querySelector('.battle-skill-name');
                    const icon = card.querySelector('.battle-skill-icon');
                    const desc = card.querySelector('.battle-skill-desc');
                    const combo = card.querySelector('.battle-skill-combo');
                    const nameRect = rect(name);
                    const descRect = rect(desc);
                    const comboRect = rect(combo);
                    return {
                      width: rect(card)?.width || 0,
                      height: rect(card)?.height || 0,
                      iconWidth: rect(icon)?.width || 0,
                      iconHeight: rect(icon)?.height || 0,
                      iconMarkup: icon?.innerHTML || '',
                      descHeight: descRect?.height || 0,
                      descTop: descRect?.top || 0,
                      comboBottom: comboRect?.bottom || 0,
                      buttonHeight: rect(card.querySelector('button'))?.height || 0,
                      nameText: name?.textContent?.trim() || '',
                      nameWidth: nameRect?.width || 0,
                      nameScrollWidth: name?.scrollWidth || 0,
                      nameWhiteSpace: name ? getComputedStyle(name).whiteSpace : '',
                      clipped: card.scrollHeight > card.clientHeight + 2
                    };
                  }),
                  pageOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 2
                };
              });
              assert.equal(skillUi.display, 'grid');
              assert.equal(skillUi.cards.length, 4);
              assert.ok(skillUi.cards.every(card => card.width >= 210));
              assert.ok(skillUi.cards.every(card => card.height >= 120 && card.height <= 190));
              assert.ok(skillUi.cards.every(card => card.iconWidth >= 40 && card.iconHeight >= 40));
              assert.equal(new Set(skillUi.cards.map(card => card.iconMarkup)).size, 4);
              assert.ok(skillUi.cards.every(card => card.descHeight >= 14 && card.buttonHeight >= 110));
              assert.ok(skillUi.cards.every(card => card.comboBottom === 0 || card.descTop >= card.comboBottom - 1));
              assert.ok(skillUi.cards.every(card => card.nameText.length >= 3));
              assert.ok(skillUi.cards.every(card => card.nameWhiteSpace !== 'nowrap'));
              assert.ok(skillUi.cards.every(card => card.nameScrollWidth <= card.nameWidth + 2));
              assert.ok(skillUi.cards.every(card => !card.clipped));
              assert.equal(skillUi.pageOverflow, false);

              // Battle V2 must keep progressing independently of the presentation layer.
              await page.waitForFunction(() => {
                const engine = window.SHORTCUT_QUEST_BATTLE_ENGINE_V2;
                return engine && (engine.turn >= 3 || engine.phase !== 'fighting');
              }, null, { timeout: 7000 });
              const progressed = await page.evaluate(() => ({
                version: window.SHORTCUT_QUEST_BATTLE_ENGINE_V2?.version,
                turn: window.SHORTCUT_QUEST_BATTLE_ENGINE_V2?.turn,
                lastError: window.SHORTCUT_QUEST_BATTLE_ENGINE_V2?.lastError
              }));
              assert.equal(progressed.version, 2);
              assert.ok(progressed.turn >= 2);
              assert.equal(progressed.lastError, null);

              await page.waitForFunction(() => ['victory', 'defeat'].includes(window.SHORTCUT_QUEST_BATTLE_ENGINE_V2?.phase), null, { timeout: 45000 });
              const finished = await page.evaluate(() => ({
                phase: window.SHORTCUT_QUEST_BATTLE_ENGINE_V2?.phase,
                outcome: window.SHORTCUT_QUEST_BATTLE_ENGINE_V2?.lastOutcome,
                lastError: window.SHORTCUT_QUEST_BATTLE_ENGINE_V2?.lastError
              }));
              assert.ok(['victory', 'defeat'].includes(finished.phase));
              assert.equal(finished.phase, finished.outcome);
              assert.equal(finished.lastError, null);
              await page.locator('#battleSimulation').screenshot({ path: 'a8-battle-active-deployed.png' });

              console.log('OK: deployed DEV A8 inventory, arena, Battle V2, premium enemy-item motion and skill hierarchy verified.');
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload A8 UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a8-ui-deployed
          path: |
            a8-inventory-deployed.png
            a8-arena-deployed.png
            a8-battle-active-deployed.png
          if-no-files-found: error
          retention-days: 7