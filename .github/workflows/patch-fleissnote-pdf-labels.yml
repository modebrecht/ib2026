name: One-shot Fleissnote PDF Labels

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/patch-fleissnote-pdf-labels.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Add PDF suffix to Fleissnote A6 and A7
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          for old, new in (('>A6</strong>', '>A6.PDF</strong>'), ('>A7</strong>', '>A7.PDF</strong>')):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {old!r}, found {count}')
              text = text.replace(old, new, 1)

          # Verify all nine Fleissnote labels now exist with .PDF.
          for i in range(1, 10):
              label = f'>A{i}.PDF</strong>'
              if label not in text:
                  raise SystemExit(f'Missing Fleissnote label {label}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit labels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "ui: label all Fleissnote items as PDF"
          git push origin HEAD:dev
